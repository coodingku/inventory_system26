<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Banner | Finex Admin 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .config-card { background: white; border-radius: 30px; border: 1px solid #f1f5f9; }
        .img-preview { width: 100%; aspect-ratio: 21/9; object-fit: cover; border-radius: 20px; background: #f1f5f9; }
        /* Style Sidebar Minimalis */
        aside { width: 260px; background: white; height: 100vh; position: sticky; top: 0; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; padding: 24px 12px; }
        .menu-item { display: flex; align-items: center; padding: 12px 16px; color: #64748b; font-weight: 600; font-size: 14px; border-radius: 12px; transition: 0.2s; margin-bottom: 2px; cursor: pointer; text-decoration: none; }
        .menu-item.active { background-color: #fff1f2; color: #f72585; }
        .menu-icon { width: 22px; margin-right: 12px; text-align: center; }
    </style>
</head>
<body class="flex">

<aside class="hidden md:flex">
    <div class="mb-8 px-4">
        <h1 class="text-xl font-black text-slate-800">Finex Admin 🌸</h1>
        <p class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">Beauty Bloom POS</p>
    </div>
    <nav class="flex-1 px-2">
        <a href="online-dashboard.html" class="menu-item"><i class="fa-solid fa-chart-pie menu-icon"></i> Dasbor</a>
        <a href="admin-input-produk.html" class="menu-item"><i class="fa-solid fa-box menu-icon"></i> Produk</a>
        <a href="pengaturan-iklan.html" class="menu-item active"><i class="fa-solid fa-rectangle-ad menu-icon"></i> Banner Promo</a>
        <a href="admin-online.html" class="menu-item"><i class="fa-solid fa-bag-shopping menu-icon"></i> Pesanan</a>
    </nav>
</aside>

<main class="flex-1 p-6 md:p-12 max-w-5xl">
    <header class="mb-10 flex justify-between items-end">
        <div>
            <h2 class="text-2xl font-black text-slate-800 italic">Banner Iklan Dashboard 🖼️</h2>
            <p class="text-slate-500 text-sm">Upload gambar promo langsung ke sistem.</p>
        </div>
        <div id="statusAds" class="text-[10px] font-black px-4 py-2 rounded-xl bg-green-100 text-green-600">MODUL AKTIF</div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
            <div class="config-card p-6 shadow-sm sticky top-10 border-2 border-pink-50">
                <h3 class="text-xs font-black text-slate-800 uppercase mb-6 flex items-center gap-2">
                    <i class="fa-solid fa-cloud-arrow-up text-pink-500"></i> Upload Banner Baru
                </h3>
                
                <div class="space-y-5">
                    <div class="border-2 border-dashed border-slate-200 rounded-2xl p-4 text-center hover:border-pink-300 transition-colors cursor-pointer relative" onclick="document.getElementById('fileInput').click()">
                        <i class="fa-solid fa-images text-3xl text-slate-300 mb-2"></i>
                        <p class="text-[10px] font-bold text-slate-400 uppercase">Klik untuk Pilih Gambar</p>
                        <input type="file" id="fileInput" class="hidden" accept="image/*" onchange="previewFile()">
                    </div>

                    <div id="previewContainer" class="hidden">
                        <p class="text-[9px] font-black text-slate-400 mb-2 uppercase">Preview:</p>
                        <img id="imgPreview" class="img-preview shadow-md">
                    </div>

                    <button onclick="handleUpload()" id="btnUpload" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-pink-500 disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i> Simpan ke Dashboard
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-2 space-y-4" id="bannerList">
            <div class="text-center py-20 text-slate-300"><i class="fa-solid fa-circle-notch animate-spin text-2xl"></i></div>
        </div>
    </div>
</main>

<script>
    let currentBanners = [];

    window.onload = () => { loadBanners(); };

    async function loadBanners() {
        const { data } = await db.from('app_settings').select('value_text').eq('key_name', 'dashboard_banners').single();
        if (data) {
            currentBanners = JSON.parse(data.value_text || "[]");
            renderList();
        }
    }

    function previewFile() {
        const file = document.getElementById('fileInput').files[0];
        const preview = document.getElementById('imgPreview');
        const container = document.getElementById('previewContainer');
        
        if (file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                preview.src = e.target.result;
                container.classList.remove('hidden');
            }
            reader.readAsDataURL(file);
        }
    }

    async function handleUpload() {
        const fileInput = document.getElementById('fileInput');
        const btn = document.getElementById('btnUpload');
        const file = fileInput.files[0];

        if (!file) return alert("Pilih gambar dulu bos! 😊");

        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> MENGUPLOAD...`;

        try {
            // 1. Upload ke Supabase Storage (Bucket: promotions)
            const fileName = `banner_${Date.now()}.${file.name.split('.').pop()}`;
            const { data: uploadData, error: uploadError } = await db.storage
                .from('promotions')
                .upload(fileName, file);

            if (uploadError) throw uploadError;

            // 2. Ambil Public URL
            const { data: urlData } = db.storage.from('promotions').getPublicUrl(fileName);
            const publicUrl = urlData.publicUrl;

            // 3. Simpan Link ke Array dan Database
            currentBanners.push(publicUrl);
            const { error: dbError } = await db.from('app_settings')
                .update({ value_text: JSON.stringify(currentBanners) })
                .eq('key_name', 'dashboard_banners');

            if (dbError) throw dbError;

            alert("Banner berhasil ditambahkan! 🌸");
            fileInput.value = "";
            document.getElementById('previewContainer').classList.add('hidden');
            renderList();

        } catch (err) {
            console.error(err);
            alert("Gagal upload: " + err.message);
        } finally {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> Simpan ke Dashboard`;
        }
    }

    async function removeBanner(index) {
        if (!confirm("Hapus banner ini?")) return;
        
        // Opsional: Kamu bisa menghapus file di Storage juga di sini jika mau
        currentBanners.splice(index, 1);
        
        await db.from('app_settings')
            .update({ value_text: JSON.stringify(currentBanners) })
            .eq('key_name', 'dashboard_banners');
        
        renderList();
    }

    function renderList() {
        const container = document.getElementById('bannerList');
        if (currentBanners.length === 0) {
            container.innerHTML = `<div class="bg-white p-16 rounded-[35px] text-center text-slate-400 border-2 border-dashed italic text-xs uppercase font-black">Belum ada banner aktif</div>`;
            return;
        }

        container.innerHTML = currentBanners.map((url, index) => `
            <div class="config-card p-4 shadow-sm group">
                <div class="relative overflow-hidden rounded-2xl">
                    <img src="${url}" class="img-preview">
                    <button onclick="removeBanner(${index})" class="absolute top-3 right-3 w-10 h-10 bg-white/90 backdrop-blur text-red-500 rounded-xl shadow-lg opacity-0 group-hover:opacity-100 transition-all">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }
</script>
</body>
</html>
