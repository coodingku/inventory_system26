<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Finex Beauty</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <div class="flex">
        <aside class="w-64 bg-slate-800 min-h-screen text-white p-6 sticky top-0 h-screen">
            <h2 class="text-2xl font-bold mb-10 text-pink-400">Finex Admin ✨</h2>
            <nav class="space-y-4">
                <button onclick="showSection('section-customer')" class="block w-full text-left hover:text-pink-300 transition"><i class="fas fa-users mr-2"></i> Data Customer</button>
                <button onclick="showSection('section-transaksi')" class="block w-full text-left hover:text-pink-300 transition"><i class="fas fa-file-invoice-dollar mr-2"></i> Laporan Transaksi</button>
            </nav>
        </aside>

        <main class="flex-1 p-8">
            
            <section id="section-customer" class="admin-section">
                <h3 class="text-2xl font-bold text-slate-800 mb-6">Data Customer Terdaftar</h3>
                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-100 text-slate-600 uppercase text-xs font-bold">
                            <tr>
                                <th class="p-4">Nama</th>
                                <th class="p-4">Email</th>
                                <th class="p-4">WhatsApp</th>
                                <th class="p-4">Alamat Default</th>
                            </tr>
                        </thead>
                        <tbody id="table-customer" class="text-sm divide-y">
                            </tbody>
                    </table>
                </div>
            </section>

            <section id="section-transaksi" class="admin-section hidden">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold text-slate-800">Laporan Transaksi Online</h3>
                    <select id="filter-status" onchange="loadTransaksi()" class="p-2 border rounded-xl bg-white text-sm outline-none focus:ring-2 focus:ring-pink-300">
                        <option value="Semua">Semua Status</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Terkirim">Terkirim</option>
                        <option value="Pending">Pending / Belum Bayar</option>
                        <option value="Batal">Dibatalkan</option>
                    </select>
                </div>

                <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-100 text-slate-600 uppercase text-xs font-bold">
                            <tr>
                                <th class="p-4">Invoice</th>
                                <th class="p-4">Penerima</th>
                                <th class="p-4">Kurir</th>
                                <th class="p-4">Total</th>
                                <th class="p-4">Status</th>
                                <th class="p-4">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="table-transaksi" class="text-sm divide-y">
                            </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

<script>
    // Fungsi navigasi antar section
    function showSection(id) {
        document.querySelectorAll('.admin-section').forEach(s => s.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'section-customer') loadCustomers();
        if(id === 'section-transaksi') loadTransaksi();
    }

    // 1. LOAD DATA CUSTOMER
    async function loadCustomers() {
        const { data, error } = await db.from('customers').select('*').order('created_at', { ascending: false });
        if (error) return console.error(error);

        const tbody = document.getElementById('table-customer');
        tbody.innerHTML = data.map(c => `
            <tr class="hover:bg-slate-50">
                <td class="p-4 font-bold">${c.full_name || '-'}</td>
                <td class="p-4">${c.email || '-'}</td>
                <td class="p-4">${c.phone_number || '-'}</td>
                <td class="p-4 text-xs text-slate-500">${c.address_shipping || '-'}</td>
            </tr>
        `).join('');
    }

    // 2. LOAD DATA TRANSAKSI DENGAN FILTER
    async function loadTransaksi() {
        const filter = document.getElementById('filter-status').value;
        let query = db.from('transaksi_online').select('*').order('created_at', { ascending: false });

        // Terapkan filter jika bukan 'Semua'
        if (filter !== "Semua") {
            query = query.eq('status_order', filter);
        }

        const { data, error } = await query;
        if (error) return console.error(error);

        const tbody = document.getElementById('table-transaksi');
        tbody.innerHTML = data.map(t => {
            // Warna label status
            let color = "bg-slate-100 text-slate-600";
            if (t.status_order === 'Selesai') color = "bg-green-100 text-green-600";
            if (t.status_order === 'Batal') color = "bg-red-100 text-red-600";
            if (t.status_order === 'Terkirim') color = "bg-blue-100 text-blue-600";

            return `
                <tr class="hover:bg-slate-50">
                    <td class="p-4 font-mono font-bold text-pink-600">${t.no_invoice}</td>
                    <td class="p-4">
                        <p class="font-bold">${t.nama_penerima}</p>
                        <p class="text-[10px] text-slate-400">${t.wa_penerima}</p>
                    </td>
                    <td class="p-4 text-xs uppercase">${t.kurir}</td>
                    <td class="p-4 font-bold">Rp ${t.grand_total.toLocaleString()}</td>
                    <td class="p-4">
                        <span class="px-3 py-1 rounded-full text-[10px] font-black uppercase ${color}">
                            ${t.status_order}
                        </span>
                    </td>
                    <td class="p-4">
                        <button onclick="updateStatus('${t.id}', 'Selesai')" class="text-green-500 hover:text-green-700 mr-2" title="Selesaikan"><i class="fas fa-check-circle"></i></button>
                        <button onclick="updateStatus('${t.id}', 'Batal')" class="text-red-500 hover:text-red-700" title="Batalkan"><i class="fas fa-times-circle"></i></button>
                    </td>
                </tr>
            `;
        }).join('');
    }

    // 3. UPDATE STATUS ORDER
    async function updateStatus(id, newStatus) {
        if(!confirm(`Ubah status transaksi menjadi ${newStatus}?`)) return;
        
        const { error } = await db.from('transaksi_online')
            .update({ status_order: newStatus })
            .eq('id', id);

        if (error) alert("Gagal update status");
        else loadTransaksi();
    }

    // Jalankan load pertama kali
    window.onload = () => loadCustomers();
</script>
</body>
</html>
