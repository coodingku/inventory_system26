<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Pesanan Online Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #fee2e2; color: #ef4444; }
        .dikemas { background: #fef3c7; color: #d97706; }
        .dikirim { background: #dcfce7; color: #16a34a; }
        
        /* Custom Sidebar Scroll */
        .sidebar-nav::-webkit-scrollbar { width: 0px; }
        .sidebar-link { transition: all 0.3s ease; border-radius: 16px; margin-bottom: 4px; }
        .sidebar-link:hover { background: #fff1f2; color: #f72585; }
        .sidebar-link.active { background: #f72585; color: white; box-shadow: 0 10px 15px -3px rgba(247, 37, 133, 0.3); }
    </style>
</head>
<body class="flex">

    <aside class="w-64 bg-white h-screen sticky top-0 border-r border-slate-100 flex flex-col p-6 hidden md:flex">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Finex Admin 🌸</h1>
            <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">Beauty Bloom POS</p>
        </div>

        <nav class="flex-1 sidebar-nav overflow-y-auto">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="admin-online.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 font-bold text-sm">
                <i class="fas fa-shopping-basket w-5"></i> Pesanan Online
            </a>
            <a href="stok.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-boxes w-5"></i> Kelola Stok
            </a>
            <a href="customers-list.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-users w-5"></i> Data Customer
            </a>

            <p class="text-[10px] font-bold text-slate-400 uppercase mt-10 mb-4 px-2 tracking-widest">Laporan</p>
            <a href="laporan.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-file-invoice-dollar w-5"></i> Keuangan Online
            </a>
        </nav>

        <div class="mt-auto">
            <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-4 py-3 text-red-400 font-bold text-sm w-full">
                <i class="fas fa-sign-out-alt w-5"></i> Keluar Sistem
            </button>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-10 max-w-6xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Manajemen Pesanan Online 🛒</h2>
                <p class="text-slate-500 text-sm">Pantau proses kemas dan kirim paket pelanggan.</p>
            </div>
            <button onclick="loadOrders()" class="bg-white border border-slate-200 text-slate-600 px-5 py-3 rounded-2xl font-bold text-sm shadow-sm hover:bg-slate-50 transition-all flex items-center gap-2">
                <i class="fas fa-sync-alt"></i> Refresh Data
            </button>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
            <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
                <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center mb-4 text-sm"><i class="fas fa-file-invoice"></i></div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Total Pesanan</p>
                <h3 id="stat-total" class="text-2xl font-black text-slate-800 mt-1">0</h3>
            </div>
            <div class="bg-white p-6 rounded-[32px] shadow-sm border border-slate-100">
                <div class="w-10 h-10 bg-amber-50 text-amber-500 rounded-xl flex items-center justify-center mb-4 text-sm"><i class="fas fa-clock"></i></div>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Perlu Diproses</p>
                <h3 id="stat-pending" class="text-2xl font-black text-amber-600 mt-1">0</h3>
            </div>
        </div>

        <div class="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-50/50 border-b border-slate-50">
                        <tr>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Invoice & Customer</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Total & Bayar</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Status</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px] text-center">Aksi Operasional</th>
                        </tr>
                    </thead>
                    <tbody id="orderList" class="divide-y divide-slate-50">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

<script>
    window.onload = loadOrders;

    async function loadOrders() {
        const { data, error } = await db.from('transaksi_online')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) return console.error(error);

        document.getElementById('stat-total').innerText = data.length;
        document.getElementById('stat-pending').innerText = data.filter(x => x.status_order === 'Pending').length;

        const container = document.getElementById('orderList');
        container.innerHTML = data.map(trx => {
            const statusStyle = trx.status_order.toLowerCase();
            
            return `
            <tr class="hover:bg-slate-50/50 transition-all">
                <td class="px-8 py-6">
                    <p class="font-black text-slate-800 text-sm mb-1">${trx.no_invoice}</p>
                    <p class="text-xs text-slate-500 font-bold">${trx.nama_penerima}</p>
                    <p class="text-[10px] text-slate-400 italic mt-1"><i class="fab fa-whatsapp"></i> ${trx.wa_penerima}</p>
                </td>
                <td class="px-8 py-6">
                    <p class="font-black text-pink-500 text-sm">Rp ${parseFloat(trx.grand_total).toLocaleString()}</p>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">${trx.metode_bayar}</p>
                </td>
                <td class="px-8 py-6">
                    <span class="status-badge ${statusStyle}">${trx.status_order}</span>
                </td>
                <td class="px-8 py-6">
                    <div class="flex justify-center gap-3">
                        ${trx.status_order === 'Pending' ? 
                            `<button onclick="updateStatus('${trx.id}', 'Dikemas')" class="bg-slate-900 text-white text-[10px] font-black px-4 py-2 rounded-xl hover:bg-black transition-all">KEMAS BARANG</button>` : 
                            (trx.status_order === 'Dikemas' ? 
                            `<button onclick="updateStatus('${trx.id}', 'Dikirim')" class="bg-blue-500 text-white text-[10px] font-black px-4 py-2 rounded-xl hover:bg-blue-600 shadow-lg shadow-blue-100 transition-all">INPUT RESI / KIRIM</button>` : 
                            `<span class="text-slate-300 text-[10px] font-bold uppercase tracking-widest italic">Success</span>`)
                        }
                        <button onclick="viewDetail('${trx.id}')" class="bg-slate-100 text-slate-400 hover:text-slate-600 w-9 h-9 rounded-xl flex items-center justify-center transition-all"><i class="fas fa-expand-alt text-xs"></i></button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

   async function updateStatus(id, statusBaru) {
    console.log("Mengubah status ID:", id, "ke:", statusBaru); // Cek di console browser

    let keteranganLog = statusBaru === 'Dikemas' 
        ? 'Pembayaran diterima. Barang sedang dikemas Tim Bloom ✨' 
        : 'Pesanan sudah dikirim! Klik detail untuk cek resi 🚚';
    
    try {
        // 1. Update Tabel Utama
        const { error: errUpdate } = await db
            .from('transaksi_online')
            .update({ status_order: statusBaru })
            .eq('id', id);

        if (errUpdate) throw errUpdate;

        // 2. Tambah Log Aktivitas agar Customer Bisa Lacak
        const { error: errLog } = await db
            .from('transaksi_online_log')
            .insert([{
                transaksi_id: id,
                status: statusBaru,
                keterangan: keteranganLog
            }]);

        if (errLog) throw errLog;

        alert(`✅ Sukses! Pesanan kini berstatus: ${statusBaru}`);
        loadOrders(); // Muat ulang tabel

    } catch (error) {
        console.error("Detail Error:", error);
        alert("Gagal memproses: " + error.message);
    }
}
    async function viewDetail(id) {
        const { data } = await db.from('transaksi_online_detail').select('*').eq('transaksi_id', id);
        if (data) {
            let list = data.map(i => `- ${i.nama_barang} (${i.qty}x)`).join('\n');
            alert("RINCIAN PESANAN:\n\n" + list);
        }
    }
</script>
</body>
</html>
