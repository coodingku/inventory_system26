<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Pesanan Online Bloom 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .pending { background: #fee2e2; color: #ef4444; }
        .proses, .dikemas { background: #fef3c7; color: #d97706; }
        .dikirim { background: #e0f2fe; color: #0284c7; }
        .selesai { background: #dcfce7; color: #16a34a; }
        .dibatalkan { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
        
        .sidebar-link { transition: all 0.3s ease; border-radius: 16px; margin-bottom: 4px; }
        .sidebar-link:hover { background: #fff1f2; color: #f72585; }
        .sidebar-link.active { background: #f72585; color: white; box-shadow: 0 10px 15px -3px rgba(247, 37, 133, 0.3); }

        .card-table { border-radius: 30px; }
        .btn-action { transition: all 0.2s active:scale-95; }

        @media print {
            aside, header, .filter-section, .no-print { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .card-table { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="flex">

    <aside class="w-64 bg-white h-screen sticky top-0 border-r border-slate-100 flex flex-col p-6 hidden md:flex">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Finex Admin 🌸</h1>
            <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">Beauty Bloom POS</p>
        </div>

        <nav class="flex-1 sidebar-nav overflow-y-auto">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="admin-online.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 font-bold text-sm">
                <i class="fas fa-shopping-basket w-5"></i> Pesanan Online
            </a>
            <a href="produk.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-boxes w-5"></i> Kelola Stok
            </a>
            <a href="customers-list.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-users w-5"></i> Data Customer
            </a>
        </nav>

        <div class="mt-auto">
            <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-4 py-3 text-red-400 font-bold text-sm w-full text-left">
                <i class="fas fa-sign-out-alt w-5"></i> Keluar Sistem
            </button>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-10 max-w-6xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Manajemen Pesanan Online 🛒</h2>
                <p class="text-slate-500 text-sm">Kelola pengiriman dan pantau pembayaran lunas.</p>
            </div>
            <div class="flex gap-2 no-print">
                <button id="btnAudio" onclick="enableAudio()" class="bg-amber-100 text-amber-600 px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm border border-amber-200">
                    <i class="fas fa-volume-mute"></i> Suara
                </button>
                <button onclick="exportToExcel()" class="bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg">
                    <i class="fas fa-file-excel"></i> Excel
                </button>
                <button onclick="window.print()" class="bg-blue-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg">
                    <i class="fas fa-print"></i> PDF
                </button>
            </div>
        </header>

        <div class="filter-section grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-white p-6 rounded-[30px] border border-slate-100 shadow-sm">
            <div class="md:col-span-2">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Cari Nota / Customer</label>
                <input type="text" id="searchBox" onkeyup="filterData()" placeholder="Ketik No. Invoice atau Nama..." class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Mulai Tanggal</label>
                <input type="date" id="dateStart" onchange="filterData()" class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Sampai Tanggal</label>
                <input type="date" id="dateEnd" onchange="filterData()" class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
        </div>

        <div class="bg-white rounded-[35px] shadow-sm border border-slate-100 overflow-hidden card-table">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="mainTable">
                    <thead class="bg-slate-50/50 border-b border-slate-50">
                        <tr>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Detail Pesanan</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Status</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center no-print">Aksi Operasional</th>
                        </tr>
                    </thead>
                    <tbody id="orderList" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </main>

<script>
    let rawData = [];
    let isVoiceActive = false;

    window.onload = async () => {
        await loadOrders();
        subscribeRealtime();
    };

    function subscribeRealtime() {
        db.channel('online_orders')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'transaksi_online' }, payload => {
            if (payload.eventType === 'INSERT' && isVoiceActive) playVoiceNotification();
            loadOrders();
        }).subscribe();
    }

    function playVoiceNotification() {
        const text = "Ada pesanan online masuk";
        const message = new SpeechSynthesisUtterance(text);
        message.lang = "id-ID";
        window.speechSynthesis.speak(message);
    }

    function enableAudio() {
        isVoiceActive = true;
        window.speechSynthesis.speak(new SpeechSynthesisUtterance("Notifikasi suara aktif"));
        const btn = document.getElementById('btnAudio');
        btn.innerHTML = '<i class="fas fa-volume-up"></i> Suara Aktif';
        btn.className = "bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm";
    }

    async function loadOrders() {
        const { data, error } = await db.from('transaksi_online').select('*').order('created_at', { ascending: false });
        if (error) return console.error(error);
        rawData = data;
        renderTable(data);
    }

function renderTable(data) {
        const container = document.getElementById('orderList');
        container.innerHTML = data.map(trx => {
            const s = trx.status_order;
            const statusClass = s.toLowerCase();
            const total = parseFloat(trx.grand_total || 0).toLocaleString();
            
            return `
            <tr class="hover:bg-slate-50/40 transition-all">
                <td class="px-8 py-6">
                    <p class="font-black text-slate-800 text-sm mb-0.5">${trx.no_invoice}</p>
                    <p class="text-xs text-slate-500 font-bold uppercase">${trx.nama_penerima || 'Tanpa Nama'}</p>
                    
                    <div class="flex flex-col gap-1 mt-2 no-print">
                        <p class="text-[10px] text-slate-400 font-bold"><i class="fas fa-phone-alt"></i> ${trx.wa_penerima || '-'}</p>
                        <button onclick="sendWA('${trx.wa_penerima}', '${trx.nama_penerima}', '${trx.no_invoice}', '${trx.status_order}')" 
                                class="text-[10px] text-green-500 font-black hover:text-green-600 flex items-center gap-1 w-fit bg-green-50 px-2 py-1 rounded-lg">
                            <i class="fab fa-whatsapp"></i> HUBUNGI CUSTOMER
                        </button>
                    </div>

                    <p class="text-[10px] text-pink-500 font-black mt-2 italic">Total: Rp ${total}</p>
                    <p class="text-[9px] text-slate-400 mt-2">${new Date(trx.created_at).toLocaleString('id-ID')}</p>
                </td>
                <td class="px-8 py-6 text-center">
                    <span class="status-badge ${statusClass}">${s}</span>
                </td>
                <td class="px-8 py-6 no-print">
                    <div class="flex justify-center items-center gap-2">
                        ${renderActionButton(trx)}
                        <button onclick="viewDetail('${trx.id}')" class="bg-slate-100 text-slate-400 w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-pink-50 transition-all">
                            <i class="fas fa-list-ul text-xs"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

   function renderActionButton(trx) {
        const s = trx.status_order;
        const id = trx.id;
        
        // 1. Tombol Batal (Muncul selama status bukan Selesai/Dibatalkan)
        const canCancel = (s !== 'Selesai' && s !== 'Dibatalkan');
        const btnBatal = canCancel ? `
            <button onclick="updateStatus('${id}', 'Dibatalkan')" class="w-10 h-10 bg-red-50 text-red-500 rounded-2xl flex items-center justify-center hover:bg-red-500 hover:text-white transition-all shadow-sm" title="Batalkan">
                <i class="fas fa-times text-xs"></i>
            </button>` : '';

        // 2. Tombol Print Nota (Selalu muncul untuk membantu admin cetak invoice)
        const btnPrint = `
            <button onclick="printNota('${id}')" class="bg-slate-100 text-slate-600 w-10 h-10 rounded-2xl flex items-center justify-center hover:bg-pink-100 transition-all shadow-sm" title="Cetak Nota">
                <i class="fas fa-print text-xs"></i>
            </button>`;

        let btnUtama = '';

        // 3. Logika Tombol Alur Kerja
        if (s === 'Pending') {
            btnUtama = `<button onclick="updateStatus('${id}', 'Dikemas')" class="bg-slate-900 text-white text-[10px] font-black px-5 py-3 rounded-2xl shadow-lg uppercase">Kemas Manual</button>`;
        }
        else if (s === 'PROSES' || s === 'Dikemas') {
            btnUtama = `<button onclick="updateStatus('${id}', 'Dikirim')" class="bg-blue-500 text-white text-[10px] font-black px-5 py-3 rounded-2xl shadow-lg uppercase italic">Kirim Barang</button>`;
        }
        else if (s === 'Dikirim') {
            btnUtama = `<button onclick="updateStatus('${id}', 'Selesai')" class="bg-green-500 text-white text-[10px] font-black px-5 py-3 rounded-2xl shadow-lg uppercase">Selesaikan</button>`;
        }
        else if (s === 'Selesai') {
            btnUtama = `<div class="flex items-center gap-1 text-green-500 font-black text-[9px] uppercase"><i class="fas fa-check-double"></i> Transaksi Berhasil</div>`;
        } else {
            btnUtama = `<span class="text-slate-300 text-[10px] font-bold">DITUTUP</span>`;
        }

        // Gabungkan semua tombol agar tampil sejajar
        return `
            <div class="flex justify-center items-center gap-2">
                ${btnPrint}
                ${btnUtama}
                ${btnBatal}
            </div>
        `;
    }

    async function printNota(id) {
        try {
            // Ambil data header transaksi
            const { data: header, error: hError } = await db.from('transaksi_online').select('*').eq('id', id).single();
            // Ambil data detail barang
            const { data: items, error: iError } = await db.from('transaksi_online_detail').select('*').eq('transaksi_id', id);
            
            if (hError || !header) return alert("Data nota tidak ditemukan!");

            const printWindow = window.open('', '_blank');
            
            // Buat baris barang untuk tabel nota
            let itemHtml = items.map(i => `
                <tr>
                    <td style="padding: 5px 0;">
                        ${i.nama_barang}<br>
                        <small>${i.qty} x Rp ${parseFloat(i.harga_satuan).toLocaleString()}</small>
                    </td>
                    <td style="text-align:right; vertical-align:top; padding: 5px 0;">
                        Rp ${(i.qty * i.harga_satuan).toLocaleString()}
                    </td>
                </tr>`).join('');

            // Desain struk thermal (lebar 70-80mm)
            printWindow.document.write(`
                <html>
                <head><title>Print Nota - ${header.no_invoice}</title></head>
                <body style="font-family: 'Courier New', Courier, monospace; width: 70mm; padding: 5px; font-size: 12px; color: #000;">
                    <center>
                        <strong style="font-size: 16px;">FINEX BEAUTY BLOOM 🌸</strong><br>
                        Nota Pesanan Online<br>
                        --------------------------------
                    </center>
                    Nota : ${header.no_invoice}<br>
                    Tgl  : ${new Date(header.created_at).toLocaleString('id-ID')}<br>
                    Cust : ${header.nama_penerima}<br>
                    --------------------------------
                    <table style="width:100%; border-collapse: collapse;">
                        ${itemHtml}
                        <tr><td colspan="2">--------------------------------</td></tr>
                        <tr>
                            <td>Ongkir:</td>
                            <td style="text-align:right">Rp ${parseFloat(header.ongkos_kirim || 0).toLocaleString()}</td>
                        </tr>
                        <tr style="font-weight:bold; font-size: 14px;">
                            <td>TOTAL:</td>
                            <td style="text-align:right">Rp ${parseFloat(header.grand_total).toLocaleString()}</td>
                        </tr>
                    </table>
                    --------------------------------
                    <center><br>Terima kasih sudah belanja cantik!<br>IG: @finexbeautybloom</center>
                    <script>
                        window.onload = function() { 
                            window.print(); 
                            setTimeout(function(){ window.close(); }, 500); 
                        }
                    <\/script>
                </body>
                </html>
            `);
            printWindow.document.close();
        } catch (e) {
            alert("Gagal print: " + e.message);
        }
    }

    

    function sendWA(phone, name, inv, status) {
        if (!phone) return alert("Nomor WhatsApp tidak ditemukan!");
        
        // Membersihkan nomor (menghilangkan spasi/strip)
        let cleanPhone = phone.replace(/[^0-9]/g, "");
        
        // Pastikan awalan 62
        if (cleanPhone.startsWith("0")) {
            cleanPhone = "62" + cleanPhone.slice(1);
        }

        const msg = `Halo Kak ${name}, kami dari *Finex Beauty Bloom* 🌸\n\nMau menginfokan pesanan *${inv}* saat ini statusnya: *${status.toUpperCase()}*.\n\nTerima kasih sudah belanja cantik! ✨`;
        
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
  async function updateStatus(id, statusBaru) {
        let confirmText = `Ubah status pesanan menjadi ${statusBaru.toUpperCase()}?`;
        if (statusBaru === 'Dibatalkan') {
            confirmText = "⚠️ APAKAH ANDA YAKIN INGIN MEMBATALKAN PESANAN INI?\n(Jika bayar pakai saldo, uang akan dikembalikan otomatis)";
        }
        
        if (!confirm(confirmText)) return;

        try {
            // 1. AMBIL DATA TRANSAKSI TERLEBIH DAHULU (Untuk cek metode bayar)
            const { data: trx, error: errTrx } = await db.from('transaksi_online')
                .select('*')
                .eq('id', id)
                .single();

            if (errTrx) throw errTrx;

            // 2. LOGIKA REFUND SALDO (Hanya jika dibatalkan & bayar pakai Saldo Akun)
            if (statusBaru === 'Dibatalkan' && trx.kurir === 'Saldo Akun') {
                
                // Ambil saldo terbaru customer
                const { data: cust } = await db.from('customers')
                    .select('saldo')
                    .eq('id', trx.customer_id)
                    .single();

                if (cust) {
                    const saldoBaru = Number(cust.saldo || 0) + Number(trx.grand_total);

                    // Kembalikan uang ke tabel customers
                    const { error: errRefund } = await db.from('customers')
                        .update({ saldo: saldoBaru })
                        .eq('id', trx.customer_id);

                    if (errRefund) throw new Error("Gagal mengembalikan saldo ke customer");

                    // Catat histori pengembalian di topup_history agar saldo sinkron
                    await db.from('topup_history').insert([{
                        no_invoice: 'REFUND-' + trx.no_invoice,
                        customer_id: trx.customer_id,
                        nominal: trx.grand_total,
                        status: 'SUCCESS'
                    }]);
                }
            }

            // 3. UPDATE STATUS TRANSAKSI UTAMA
            const { error: errUpdate } = await db.from('transaksi_online')
                .update({ status_order: statusBaru })
                .eq('id', id);

            if (errUpdate) throw errUpdate;
            
            // 4. Catat ke log histori operasional
            let ketLog = (statusBaru === 'Dibatalkan' && trx.kurir === 'Saldo Akun') 
                         ? 'Dibatalkan & Saldo Refunded' 
                         : 'Update via Admin Panel';

            await db.from('transaksi_online_log').insert([{ 
                transaksi_id: id, 
                status: statusBaru, 
                keterangan: ketLog 
            }]);
            
            // Beri notifikasi sukses
            if (statusBaru === 'Dibatalkan' && trx.kurir === 'Saldo Akun') {
                alert("Pesanan Dibatalkan! Saldo Rp " + Number(trx.grand_total).toLocaleString() + " telah dikembalikan ke customer. 🌸");
            } else {
                alert("Status berhasil diperbarui! ✨");
            }

            loadOrders(); // Refresh tabel admin
        } catch (err) {
            alert("Terjadi Kesalahan: " + err.message);
        }
    }
    async function viewDetail(id) {
        const { data } = await db.from('transaksi_online_detail').select('*').eq('transaksi_id', id);
        if (data && data.length > 0) {
            let list = data.map(i => `📍 ${i.nama_barang} (${i.qty}x)`).join('\n');
            alert("RINCIAN BARANG:\n\n" + list);
        } else {
            alert("Data produk tidak ditemukan.");
        }
    }

    function filterData() {
        const kw = document.getElementById('searchBox').value.toLowerCase();
        const start = document.getElementById('dateStart').value;
        const end = document.getElementById('dateEnd').value;
        
        let filtered = rawData.filter(i => {
            const matchKw = i.no_invoice.toLowerCase().includes(kw) || i.nama_penerima.toLowerCase().includes(kw);
            const tgl = i.created_at.split('T')[0];
            let matchTgl = true;
            if (start && end) matchTgl = (tgl >= start && tgl <= end);
            return matchKw && matchTgl;
        });
        renderTable(filtered);
    }

    function exportToExcel() {
        const wb = XLSX.utils.table_to_book(document.getElementById("mainTable"));
        XLSX.writeFile(wb, "Pesanan_Online_BeautyBloom.xlsx");
    }

    
    
    function logout() { sessionStorage.clear(); window.location.replace('login.html'); }
</script>
</body>
</html>
