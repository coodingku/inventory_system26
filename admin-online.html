<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Pesanan Online Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
        .status-badge { padding: 4px 12px; border-radius: 20px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .pending { background: #fee2e2; color: #ef4444; }
        .dikemas { background: #fef3c7; color: #d97706; }
        .dikirim { background: #e0f2fe; color: #0284c7; }
        .selesai { background: #f3e8ff; color: #7e22ce; }
        .dibatalkan { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }
        
        .sidebar-link { transition: all 0.3s ease; border-radius: 16px; margin-bottom: 4px; }
        .sidebar-link:hover { background: #fff1f2; color: #f72585; }
        .sidebar-link.active { background: #f72585; color: white; box-shadow: 0 10px 15px -3px rgba(247, 37, 133, 0.3); }

        @media print {
            aside, header, .filter-section, .no-print { display: none !important; }
            main { margin: 0 !important; padding: 0 !important; }
            .card-table { border: none !important; box-shadow: none !important; }
        }
    </style>
</head>
<body class="flex">

    <aside class="w-64 bg-white h-screen sticky top-0 border-r border-slate-100 flex flex-col p-6 hidden md:flex">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Finex Admin 🌸</h1>
            <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">Beauty Bloom POS</p>
        </div>

        <nav class="flex-1 sidebar-nav overflow-y-auto">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="admin-online.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 font-bold text-sm">
                <i class="fas fa-shopping-basket w-5"></i> Pesanan Online
            </a>
            <a href="produk.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-boxes w-5"></i> Kelola Stok
            </a>
            <a href="customers-list.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-users w-5"></i> Data Customer
            </a>
        </nav>

        <div class="mt-auto">
            <button onclick="logout()" class="sidebar-link flex items-center gap-3 px-4 py-3 text-red-400 font-bold text-sm w-full text-left">
                <i class="fas fa-sign-out-alt w-5"></i> Keluar Sistem
            </button>
        </div>
    </aside>

    <main class="flex-1 p-4 md:p-10 max-w-6xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Manajemen Pesanan Online 🛒</h2>
                <p class="text-slate-500 text-sm">Filter data, cetak laporan, dan hubungi customer.</p>
            </div>
            <div class="flex gap-2">
                <button onclick="exportToExcel()" class="bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-green-100">
                    <i class="fas fa-file-excel"></i> Export Excel
                </button>
                <button onclick="window.print()" class="bg-blue-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-lg shadow-blue-100">
                    <i class="fas fa-print"></i> PDF / Halaman Ini
                </button>
            </div>
        </header>

        <div class="filter-section grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-white p-6 rounded-[30px] border border-slate-100 shadow-sm">
            <div class="md:col-span-2">
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Cari Nota / Customer</label>
                <input type="text" id="searchBox" onkeyup="filterData()" placeholder="Ketik No. Invoice atau Nama..." class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Mulai Tanggal</label>
                <input type="date" id="dateStart" onchange="filterData()" class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-2">Sampai Tanggal</label>
                <input type="date" id="dateEnd" onchange="filterData()" class="w-full mt-1 px-4 py-3 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
        </div>

        <div class="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden card-table">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="mainTable">
                    <thead class="bg-slate-50/50 border-b border-slate-50">
                        <tr>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Invoice & Customer</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Total & Bayar</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px]">Status</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[2px] text-center no-print">Aksi Operasional</th>
                        </tr>
                    </thead>
                    <tbody id="orderList" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </main>

<script>
  let rawData = [];
    let lastOrderCount = 0; // Untuk melacak jumlah pesanan sebelumnya
    let isFirstLoad = true; // Agar suara tidak bunyi saat pertama kali buka halaman

    window.onload = async () => {
        await loadOrders();
        // Cek pesanan baru setiap 30 detik secara otomatis
        setInterval(loadOrders, 30000); 
    };

    async function loadOrders() {
        const { data, error } = await db.from('transaksi_online')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) return console.error(error);
        
        rawData = data;

        // --- LOGIKA NOTIFIKASI SUARA ---
        const currentOrderCount = data.length;

        // Jika jumlah data bertambah dibanding cek terakhir
        if (!isFirstLoad && currentOrderCount > lastOrderCount) {
            playVoiceNotification();
        }

        lastOrderCount = currentOrderCount;
        isFirstLoad = false;
        // -------------------------------

        renderTable(data);
    }

    // FUNGSI SUARA MANUSIA
    function playVoiceNotification() {
        const message = new SpeechSynthesisUtterance("Ada pesanan masuk");
        message.lang = "id-ID"; // Bahasa Indonesia
        message.pitch = 1;     // Nada suara
        message.rate = 0.9;    // Kecepatan bicara (sedikit pelan agar jelas)

        let count = 0;
        const interval = setInterval(() => {
            window.speechSynthesis.speak(message);
            count++;
            if (count >= 3) clearInterval(interval); // Berhenti setelah 3x
        }, 2000); // Jeda antar ucapan 2 detik
    }

    // ... sisa fungsi renderTable, filterData, sendWA, dll tetap sama seperti sebelumnya ...
    function renderTable(data) {
        const container = document.getElementById('orderList');
        container.innerHTML = data.map(trx => {
            const statusStyle = trx.status_order.toLowerCase();
            return `
            <tr class="hover:bg-slate-50/50 transition-all">
                <td class="px-8 py-6">
                    <p class="font-black text-slate-800 text-sm mb-1">${trx.no_invoice}</p>
                    <p class="text-xs text-slate-500 font-bold">${trx.nama_penerima}</p>
                    <div class="flex items-center gap-2 mt-1 no-print">
                        <button onclick="sendWA('${trx.wa_penerima}', '${trx.nama_penerima}', '${trx.no_invoice}', '${trx.status_order}')" class="text-[10px] text-green-500 font-bold hover:underline flex items-center gap-1">
                            <i class="fab fa-whatsapp"></i> Hubungi Customer
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1">${new Date(trx.created_at).toLocaleDateString('id-ID')}</p>
                </td>
                <td class="px-8 py-6">
                    <p class="font-black text-pink-500 text-sm">Rp ${parseFloat(trx.grand_total).toLocaleString()}</p>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">${trx.metode_bayar}</p>
                </td>
                <td class="px-8 py-6">
                    <span class="status-badge ${statusStyle}">${trx.status_order}</span>
                </td>
                <td class="px-8 py-6 no-print">
                    <div class="flex justify-center items-center gap-3">
                        <button onclick="printNota('${trx.id}')" class="bg-slate-100 text-slate-600 w-9 h-9 rounded-xl flex items-center justify-center hover:bg-pink-50 hover:text-pink-500 transition-all" title="Print Nota">
                            <i class="fas fa-print text-xs"></i>
                        </button>
                        ${renderActionButton(trx)}
                        <button onclick="viewDetail('${trx.id}')" class="bg-slate-100 text-slate-400 hover:text-slate-600 w-9 h-9 rounded-xl flex items-center justify-center transition-all">
                            <i class="fas fa-expand-alt text-xs"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }
    // ... fungsi lainnya ...

    function renderTable(data) {
        const container = document.getElementById('orderList');
        container.innerHTML = data.map(trx => {
            const statusStyle = trx.status_order.toLowerCase();
            return `
            <tr class="hover:bg-slate-50/50 transition-all">
                <td class="px-8 py-6">
                    <p class="font-black text-slate-800 text-sm mb-1">${trx.no_invoice}</p>
                    <p class="text-xs text-slate-500 font-bold">${trx.nama_penerima}</p>
                    <div class="flex items-center gap-2 mt-1 no-print">
                        <button onclick="sendWA('${trx.wa_penerima}', '${trx.nama_penerima}', '${trx.no_invoice}', '${trx.status_order}')" class="text-[10px] text-green-500 font-bold hover:underline flex items-center gap-1">
                            <i class="fab fa-whatsapp"></i> Hubungi Customer
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-400 mt-1">${new Date(trx.created_at).toLocaleDateString('id-ID')}</p>
                </td>
                <td class="px-8 py-6">
                    <p class="font-black text-pink-500 text-sm">Rp ${parseFloat(trx.grand_total).toLocaleString()}</p>
                    <p class="text-[10px] font-bold text-slate-400 mt-1 uppercase tracking-tighter">${trx.metode_bayar}</p>
                </td>
                <td class="px-8 py-6">
                    <span class="status-badge ${statusStyle}">${trx.status_order}</span>
                </td>
                <td class="px-8 py-6 no-print">
                    <div class="flex justify-center items-center gap-3">
                        <button onclick="printNota('${trx.id}')" class="bg-slate-100 text-slate-600 w-9 h-9 rounded-xl flex items-center justify-center hover:bg-pink-50 hover:text-pink-500 transition-all" title="Print Nota">
                            <i class="fas fa-print text-xs"></i>
                        </button>
                        ${renderActionButton(trx)}
                        <button onclick="viewDetail('${trx.id}')" class="bg-slate-100 text-slate-400 hover:text-slate-600 w-9 h-9 rounded-xl flex items-center justify-center transition-all">
                            <i class="fas fa-expand-alt text-xs"></i>
                        </button>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function filterData() {
        const keyword = document.getElementById('searchBox').value.toLowerCase();
        const start = document.getElementById('dateStart').value;
        const end = document.getElementById('dateEnd').value;

        let filtered = rawData.filter(item => {
            const matchSearch = item.no_invoice.toLowerCase().includes(keyword) || 
                              item.nama_penerima.toLowerCase().includes(keyword);
            
            const itemDate = item.created_at.split('T')[0];
            let matchDate = true;
            if (start && end) matchDate = (itemDate >= start && itemDate <= end);
            else if (start) matchDate = (itemDate >= start);
            else if (end) matchDate = (itemDate <= end);

            return matchSearch && matchDate;
        });

        renderTable(filtered);
    }

    function renderActionButton(trx) {
        const showBatal = (trx.status_order !== 'Selesai' && trx.status_order !== 'Dibatalkan');
        const btnBatal = showBatal ? `<button onclick="updateStatus('${trx.id}', 'Dibatalkan')" class="text-red-400 hover:text-red-600 transition-all" title="Batalkan"><i class="fas fa-times-circle text-lg"></i></button>` : '';

        if (trx.status_order === 'Pending') {
            return `<button onclick="updateStatus('${trx.id}', 'Dikemas')" class="bg-slate-900 text-white text-[10px] font-black px-4 py-2 rounded-xl">KEMAS</button> ${btnBatal}`;
        } else if (trx.status_order === 'Dikemas') {
            return `<button onclick="updateStatus('${trx.id}', 'Dikirim')" class="bg-blue-500 text-white text-[10px] font-black px-4 py-2 rounded-xl">KIRIM</button> ${btnBatal}`;
        } else if (trx.status_order === 'Dikirim') {
            return `<button onclick="updateStatus('${trx.id}', 'Selesai')" class="bg-green-500 text-white text-[10px] font-black px-4 py-2 rounded-xl italic">SELESAI ✓</button> ${btnBatal}`;
        } else if (trx.status_order === 'Dibatalkan') {
            return `<span class="text-slate-400 text-[10px] font-bold italic">CLOSED</span>`;
        } else {
            return `<span class="text-purple-500 text-[10px] font-black uppercase tracking-widest">SUCCESS ✨</span>`;
        }
    }

    function sendWA(phone, name, inv, status) {
        const cleanPhone = phone.replace(/[^0-9]/g, "");
        const msg = `Halo Kak ${name}, kami dari *Beauty Bloom* 🌸\n\nMau menginfokan pesanan dengan invoice *${inv}* saat ini sudah *${status}*. Terima kasih! ✨`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    async function printNota(id) {
        const { data: header } = await db.from('transaksi_online').select('*').eq('id', id).single();
        const { data: items } = await db.from('transaksi_online_detail').select('*').eq('transaksi_id', id);

        const printWindow = window.open('', '_blank');
        let itemHtml = items.map(i => `
            <tr>
                <td style="padding: 5px 0;">${i.nama_barang}<br><small>${i.qty} x Rp ${parseFloat(i.harga_satuan).toLocaleString()}</small></td>
                <td style="text-align: right;">Rp ${(i.qty * i.harga_satuan).toLocaleString()}</td>
            </tr>
        `).join('');

        printWindow.document.write(`
            <html>
            <body style="font-family: monospace; width: 80mm; padding: 10px; font-size: 12px;">
                <center><strong>BEAUTY BLOOM 🌸</strong><br>Online Shop Nota<br>---------------------------</center>
                Inv: ${header.no_invoice}<br>Tgl: ${new Date(header.created_at).toLocaleString()}<br>Cust: ${header.nama_penerima}<br>---------------------------
                <table style="width: 100%; font-size: 11px;">${itemHtml}</table>
                ---------------------------<br><div style="display: flex; justify-content: space-between;"><strong>TOTAL:</strong><strong>Rp ${parseFloat(header.grand_total).toLocaleString()}</strong></div>
                <br><center>Terima kasih sudah belanja!</center>
            </body>
            </html>
        `);
        printWindow.document.close();
        printWindow.print();
    }

    function exportToExcel() {
        const table = document.getElementById("mainTable");
        const wb = XLSX.utils.table_to_book(table, { sheet: "Laporan Pesanan" });
        XLSX.writeFile(wb, "Laporan_Bloom_Online.xlsx");
    }

    async function updateStatus(id, statusBaru) {
        if (statusBaru === 'Dibatalkan' && !confirm("Batalkan pesanan ini?")) return;
        const { error } = await db.from('transaksi_online').update({ status_order: statusBaru }).eq('id', id);
        if (!error) {
            await db.from('transaksi_online_log').insert([{ transaksi_id: id, status: statusBaru, keterangan: 'Status diperbarui oleh Admin' }]);
            loadOrders();
        }
    }

    async function viewDetail(id) {
        const { data } = await db.from('transaksi_online_detail').select('*').eq('transaksi_id', id);
        if (data) alert("DETAIL ITEM:\n\n" + data.map(i => `- ${i.nama_barang} (${i.qty}x)`).join('\n'));
    }

    function logout() {
        sessionStorage.clear();
        window.location.replace('login.html');
    }
</script>
</body>
</html>
