<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout | Finex Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-SxwBHyWfI2h4Py-b"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff0f3; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; background: white; font-size: 14px; }
        .input-field:focus { border-color: #ff85a2; box-shadow: 0 0 0 2px #ffe5ec; }
        .courier-box { transition: all 0.2s ease; border: 2px solid #f1f5f9; cursor: pointer; }
        .courier-box.active { border-color: #f72585; background: #fff0f3; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#fff0f3] pb-10">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40 p-4 border-b border-pink-100">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <a href="online-shop.html" class="text-pink-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Checkout Pesanan 🌸</h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6 border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-pink-400"></i> Produk Dipesan
            </h3>
            <div id="checkout-list" class="space-y-4 text-sm"></div>
            
            <div class="mt-6 pt-4 border-t border-dashed border-slate-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 text-xs uppercase font-bold">Subtotal Produk</span>
                    <span id="txt-subtotal" class="text-slate-600 font-bold">Rp 0</span>
                </div>
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 text-xs uppercase font-bold">Ongkos Kirim</span>
                    <span id="txt-ongkir" class="text-slate-600 font-bold">Rp 0</span>
                </div>
                <div id="row-diskon" class="flex justify-between items-center mb-3 hidden">
                    <span class="text-pink-500 text-xs uppercase font-black">Diskon Member Reward 🎁</span>
                    <span id="txt-diskon" class="text-pink-500 font-bold">- Rp 0</span>
                </div>

                <div class="flex justify-between items-end border-t border-slate-50 pt-3">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                        <h2 id="txt-total" class="text-2xl font-black text-[#f72585]">Rp 0</h2>
                    </div>
                    <div id="info-saldo" class="text-right hidden">
                        <p class="text-[9px] text-slate-400 font-bold uppercase">Saldo Kamu</p>
                        <p id="txt-saldo-user" class="text-xs font-black text-green-600">Rp 0</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-truck text-pink-400"></i> Informasi Pengiriman
            </h3>
            <div class="space-y-4">
                <input type="text" id="cust-name" class="input-field" placeholder="Nama Penerima">
                <input type="number" id="cust-phone" class="input-field" placeholder="No. WhatsApp (628...)">
                
                <div class="relative">
                    <input type="text" id="destination-search" onkeyup="searchArea(this.value)" class="input-field" placeholder="Ketik Kecamatan Tujuan..." autocomplete="off">
                    <div id="area-results" class="absolute z-50 w-full bg-white shadow-xl rounded-2xl mt-1 max-h-48 overflow-y-auto hidden text-xs border border-slate-100 no-scrollbar"></div>
                    <input type="hidden" id="destination-id">
                </div>

                <textarea id="cust-address" rows="3" class="input-field" placeholder="Alamat Lengkap (Jl, No Rumah, RT/RW)"></textarea>

                <button type="button" onclick="checkShippingRates()" id="btn-cek-ongkir" class="w-full py-4 bg-slate-800 text-white rounded-2xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-slate-200 active:scale-95 transition-all">
                    Cek Ongkos Kirim 🚚
                </button>

                <div id="shipping-options" class="space-y-2 mt-4"></div>
            </div>
        </div>

        <input type="hidden" id="selected-courier-name">
        <input type="hidden" id="selected-shipping-cost" value="0">

        <button onclick="processOrder()" id="btn-order" class="w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-[22px] font-black text-lg shadow-lg shadow-pink-200 active:scale-95 transition-all mb-4">
            BAYAR SEKARANG ✨
        </button>
    </main>

<script>
    const BITES_API_KEY = "biteship_live.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoid2Vic2l0ZSBmaW5leCIsInVzZXJJZCI6IjY5YjUzYTFjZmExYTg5MmM2Y2MxOTYzNyIsImlhdCI6MTc3MzQ5NTE2Mn0.lu-I0J6bMZsD38H7sk8LAEB6S_a88T-laIvZX3_NzAk"; 
    const ORIGIN_ID = "IDNP10CL1081"; 

    let cartData = JSON.parse(localStorage.getItem('finexcart')) || [];
    let subtotalFinal = 0;
    let shippingCost = 0;
    let diskonMember = 0;
    let userData = null;

    window.onload = async () => { 
        await loadCustomerData(); 
        renderCheckout(); 
    };

    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            const { data } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (data) {
                userData = data;
                document.getElementById('cust-name').value = data.full_name || "";
                document.getElementById('cust-phone').value = data.phone_number || "";
                document.getElementById('cust-address').value = data.address_shipping || "";
                
                // Tampilkan Saldo
                document.getElementById('info-saldo').classList.remove('hidden');
                document.getElementById('txt-saldo-user').innerText = "Rp " + (data.saldo || 0).toLocaleString();

                // Hitung Diskon Member jika sudah Klaim & Belanja > 200rb
                checkLoyalty(data);
            }
        }
    }

    function checkLoyalty(profile) {
        let currentSubtotal = cartData.reduce((sum, i) => sum + (i.qty * i.harga), 0);
        
        // Syarat: is_reward_claimed TRUE & Belanja > 200rb
        if (profile.is_reward_claimed === true && currentSubtotal >= 200000) {
            diskonMember = 25000; // Contoh potongan 25rb
            document.getElementById('row-diskon').classList.remove('hidden');
            document.getElementById('txt-diskon').innerText = "- Rp " + diskonMember.toLocaleString();
        }
    }

    function renderCheckout() {
        if (cartData.length === 0) return window.location.href = "online-shop.html";
        const container = document.getElementById('checkout-list');
        subtotalFinal = 0;
        
        container.innerHTML = cartData.map(item => {
            const namaItem = item.nama || item.nama_barang || "Produk";
            const sub = item.qty * item.harga;
            subtotalFinal += sub;
            return `
            <div class="flex justify-between items-start mb-2">
                <div>
                    <p class="font-bold text-slate-700 uppercase text-[12px]">${namaItem}</p>
                    <p class="text-[11px] text-slate-400 font-bold">${item.qty} x Rp ${item.harga.toLocaleString()}</p>
                </div>
                <p class="font-bold text-slate-800">Rp ${sub.toLocaleString()}</p>
            </div>`;
        }).join('');
        
        updateTotalDisplay();
    }

    function updateTotalDisplay() {
        const total = subtotalFinal + shippingCost - diskonMember;
        document.getElementById('txt-subtotal').innerText = "Rp " + subtotalFinal.toLocaleString();
        document.getElementById('txt-ongkir').innerText = "Rp " + shippingCost.toLocaleString();
        document.getElementById('txt-total').innerText = "Rp " + (total < 0 ? 0 : total).toLocaleString();

        const btn = document.getElementById('btn-order');
        if (userData && userData.saldo >= total && total > 0) {
            btn.innerHTML = "BAYAR PAKAI SALDO ✨";
            btn.className = "w-full bg-gradient-to-r from-green-400 to-green-600 text-white py-5 rounded-[22px] font-black text-lg shadow-lg shadow-green-100 active:scale-95 transition-all mb-4";
        } else {
            btn.innerHTML = "BAYAR SEKARANG ✨";
            btn.className = "w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-[22px] font-black text-lg shadow-lg shadow-pink-200 active:scale-95 transition-all mb-4";
        }
    }

    // --- FUNGSI BITESHIP ---
    async function searchArea(query) {
        const box = document.getElementById('area-results');
        if (query.length < 3) return box.classList.add('hidden');
        try {
            const res = await fetch(`https://api.biteship.com/v1/maps/areas?countries=ID&input=${query}&type=single`, {
                headers: { 'Authorization': BITES_API_KEY.trim() }
            });
            const data = await res.json();
            if (data.areas) {
                box.innerHTML = data.areas.map(a => `<div onclick="selectArea('${a.id}', '${a.name}')" class="p-4 hover:bg-pink-50 cursor-pointer border-b border-slate-50 font-bold text-slate-600 text-xs">${a.name}</div>`).join('');
                box.classList.remove('hidden');
            }
        } catch (e) {}
    }

    function selectArea(id, name) {
        document.getElementById('destination-id').value = id;
        document.getElementById('destination-search').value = name;
        document.getElementById('area-results').classList.add('hidden');
    }

    async function checkShippingRates() {
        const destId = document.getElementById('destination-id').value;
        if (!destId) return alert("Pilih kecamatan dulu! 🌸");
        const btn = document.getElementById('btn-cek-ongkir');
        btn.innerText = "MENGHITUNG...";
        try {
            const res = await fetch('https://api.biteship.com/v1/shippings/rates', {
                method: 'POST',
                headers: { 'Authorization': BITES_API_KEY.trim(), 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    origin_area_id: ORIGIN_ID,
                    destination_area_id: destId,
                    couriers: "jne,jnt,sicepat",
                    items: cartData.map(i => ({ name: i.nama || i.nama_barang, value: i.harga, weight: 200, quantity: i.qty }))
                })
            });
            const data = await res.json();
            if (data.results) renderShippingOptions(data.results);
        } catch (e) { alert("Error Biteship."); }
        finally { btn.innerText = "Cek Ongkos Kirim 🚚"; }
    }

    function renderShippingOptions(rates) {
        const container = document.getElementById('shipping-options');
        container.innerHTML = rates.map(r => `
            <div onclick="selectCourier('${r.courier_name} ${r.courier_service}', ${r.price})" class="p-4 border-2 rounded-2xl flex justify-between items-center courier-box bg-white mb-2">
                <div><p class="text-[10px] font-black text-slate-400 uppercase">${r.courier_name}</p>
                <p class="text-xs font-bold text-slate-700">${r.duration}</p></div>
                <p class="font-black text-slate-800 text-sm">Rp ${r.price.toLocaleString()}</p>
            </div>`).join('');
    }

    function selectCourier(name, price) {
        document.querySelectorAll('.courier-box').forEach(el => el.classList.remove('border-pink-500', 'bg-pink-50', 'active'));
        event.currentTarget.classList.add('border-pink-500', 'bg-pink-50', 'active');
        shippingCost = price;
        document.getElementById('selected-courier-name').value = name;
        document.getElementById('selected-shipping-cost').value = price;
        updateTotalDisplay();
    }

    // --- PROSES ORDER ---
    async function processOrder() {
        const totalBayar = subtotalFinal + shippingCost - diskonMember;
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const courier = document.getElementById('selected-courier-name').value || "Manual";

        if (!name || !address) return alert("Lengkapi Alamat! 🌸");

        const btn = document.getElementById('btn-order');
        btn.innerText = "Processing..."; btn.disabled = true;

        try {
            const inv = `BLM-${Date.now().toString().slice(-6)}`;

            // A. BAYAR PAKAI SALDO
            if (userData && userData.saldo >= totalBayar && totalBayar > 0) {
                if (!confirm("Gunakan saldo akun untuk membayar?")) {
                    btn.disabled = false; btn.innerText = "BAYAR SEKARANG ✨";
                    return;
                }

                // 1. Potong Saldo & Reset Reward Member
                await db.from('customers').update({ 
                    saldo: userData.saldo - totalBayar,
                    is_reward_claimed: false // Reset status diskon setelah dipakai
                }).eq('id', userData.id);

                // 2. Simpan Transaksi (Langsung Dikemas)
                const { data: trx } = await db.from('transaksi_online').insert([{
                    no_invoice: inv, customer_id: userData.id, nama_penerima: name, wa_penerima: phone,
                    alamat_kirim: address, kurir: courier, ongkos_kirim: shippingCost,
                    grand_total: totalBayar, status_order: 'Dikemas'
                }]).select().single();

                // 3. Simpan Detail
                const details = cartData.map(item => ({
                    transaksi_id: trx.id, produk_id: item.id, nama_barang: item.nama || item.nama_barang, qty: item.qty,
                    harga_satuan: item.harga, subtotal_item: item.qty * item.harga
                }));
                await db.from('transaksi_online_detail').insert(details);

                localStorage.removeItem('finexcart');
                alert("Pembayaran Saldo Berhasil! Pesanan sedang dikemas. 🌸");
                window.location.href = "online-shop.html";
            } 
            
            // B. BAYAR PAKAI MIDTRANS
            else {
                const { data: midtrans } = await db.functions.invoke('smart-endpoint', {
                    body: { action: 'generate_token', order_id: inv, amount: totalBayar, customer_name: name, customer_email: userData.email }
                });

                if (!midtrans?.token) throw new Error("Gagal Midtrans.");

                const { data: trx } = await db.from('transaksi_online').insert([{
                    no_invoice: inv, customer_id: userData.id, nama_penerima: name, wa_penerima: phone,
                    alamat_kirim: address, kurir: courier, ongkos_kirim: shippingCost,
                    grand_total: totalBayar, status_order: 'Pending', snap_token: midtrans.token
                }]).select().single();

                const details = cartData.map(item => ({
                    transaksi_id: trx.id, produk_id: item.id, nama_barang: item.nama || item.nama_barang, qty: item.qty,
                    harga_satuan: item.harga, subtotal_item: item.qty * item.harga
                }));
                await db.from('transaksi_online_detail').insert(details);

                // Jika pembayaran ini sukses lewat Midtrans, reward juga harus direset (Dilakukan di Webhook/Smart-Endpoint)
                
                localStorage.removeItem('finexcart');
                window.snap.pay(midtrans.token, {
                    onSuccess: () => { window.location.href = "online-shop.html"; },
                    onPending: () => { window.location.href = "online-shop.html"; },
                    onClose: () => { window.location.href = "online-shop.html"; }
                });
            }
        } catch (e) {
            alert(e.message);
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
