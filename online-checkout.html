<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout | Finex Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-SxwBHyWfI2h4Py-b"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff0f3; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; background: white; font-size: 14px; }
        .input-field:focus { border-color: #ff85a2; box-shadow: 0 0 0 2px #ffe5ec; }
        .courier-box { transition: all 0.2s ease; border: 2px solid #f1f5f9; }
        .courier-box.active { border-color: #f72585; background: #fff0f3; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-[#fff0f3] pb-10">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40 p-4 border-b border-pink-100">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <a href="online-shop.html" class="text-pink-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Checkout Pesanan 🌸</h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6 border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-pink-400"></i> Produk Dipesan
            </h3>
            <div id="checkout-list" class="space-y-4 text-sm"></div>
            
            <div class="mt-6 pt-4 border-t border-dashed border-slate-200">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-slate-400 text-xs uppercase font-bold">Subtotal Produk</span>
                    <span id="txt-subtotal" class="text-slate-600 font-bold">Rp 0</span>
                </div>
                <div id="row-diskon" class="flex justify-between items-center mb-1 hidden">
                    <span class="text-green-500 text-xs uppercase font-bold">Total Diskon Online</span>
                    <span id="txt-diskon" class="text-green-500 font-bold">- Rp 0</span>
                </div>
                <div class="flex justify-between items-center mb-3">
                    <span class="text-slate-400 text-xs uppercase font-bold">Ongkos Kirim</span>
                    <span id="txt-ongkir" class="text-slate-600 font-bold">Rp 0</span>
                </div>
                <div class="flex justify-between items-end border-t border-slate-50 pt-3">
                    <div>
                        <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                        <h2 id="txt-total" class="text-2xl font-black text-[#f72585]">Rp 0</h2>
                    </div>
                    <div id="badge-hemat" class="hidden bg-green-100 text-green-600 text-[10px] font-black px-3 py-1 rounded-full uppercase">Hemat Rp 0</div>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-truck text-pink-400"></i> Informasi Pengiriman
            </h3>
            <div class="space-y-4">
                <input type="text" id="cust-name" class="input-field" placeholder="Nama Penerima">
                <input type="number" id="cust-phone" class="input-field" placeholder="No. WhatsApp (628...)">
                
                <div class="relative">
                    <input type="text" id="destination-search" onkeyup="searchArea(this.value)" class="input-field" placeholder="Ketik Kecamatan/Kota Tujuan...">
                    <div id="area-results" class="absolute z-50 w-full bg-white shadow-xl rounded-2xl mt-1 max-h-48 overflow-y-auto hidden text-xs border border-slate-100 no-scrollbar"></div>
                    <input type="hidden" id="destination-id">
                </div>

                <textarea id="cust-address" rows="3" class="input-field" placeholder="Alamat Lengkap (Jl, No Rumah, RT/RW)"></textarea>

                <button type="button" onclick="checkShippingRates()" id="btn-cek-ongkir" class="w-full py-4 bg-slate-800 text-white rounded-2xl text-xs font-bold uppercase tracking-widest shadow-lg shadow-slate-200 active:scale-95 transition-all">
                    Cek Ongkos Kirim 🚚
                </button>

                <div id="shipping-options" class="space-y-2 mt-4"></div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-credit-card text-pink-400"></i> Pilih Pembayaran
            </h3>
            <div class="p-4 border-2 border-pink-500 bg-pink-50 rounded-2xl flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-white text-pink-500 rounded-full flex items-center justify-center shadow-sm">
                        <i class="fas fa-bolt-lightning"></i>
                    </div>
                    <div>
                        <p class="font-bold text-slate-700 text-sm">Otomatis (Midtrans)</p>
                        <p class="text-[10px] text-slate-400">Virtual Account, QRIS, E-Wallet</p>
                    </div>
                </div>
                <i class="fas fa-circle-check text-pink-500"></i>
            </div>
        </div>

        <input type="hidden" id="selected-courier-name">
        <input type="hidden" id="selected-shipping-cost" value="0">

        <button onclick="processOrder()" id="btn-order" class="w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-[22px] font-black text-lg shadow-lg shadow-pink-200 active:scale-95 transition-all mb-4">
            BAYAR SEKARANG ✨
        </button>
    </main>

<script>
    const BITES_API_KEY = "biteship_test.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoid2Vic2l0ZSBmaW5leCIsInVzZXJJZCI6IjY5YjUzYTFjZmExYTg5MmM2Y2MxOTYzNyIsImlhdCI6MTc3MzQ4NTUxNH0.uVIDJzaqz4PF8q6iOBdqHNf0RfYHfUSzKcPmdJoGlPk"; 
    const ORIGIN_ID = "IDNP10CL1081"; 

    let cartData = JSON.parse(sessionStorage.getItem('finexcart')) || [];
    let subtotalFinal = 0;
    let shippingCost = 0;
    let customerEmail = "";

    window.onload = async () => {
        renderCheckout();
        await loadCustomerData();
    };

    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            customerEmail = user.email;
            const { data } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (data) {
                document.getElementById('cust-name').value = data.full_name || "";
                document.getElementById('cust-phone').value = data.phone_number || "";
                document.getElementById('cust-address').value = data.address_shipping || "";
            }
        }
    }

    function renderCheckout() {
        if (cartData.length === 0) return window.location.href = "online-shop.html";
        const container = document.getElementById('checkout-list');
        let subtotalTanpaDiskon = 0;
        let totalDiskon = 0;
        subtotalFinal = 0;
        
        container.innerHTML = cartData.map(item => {
            const hargaNormal = item.harga_normal || item.harga;
            const subNormal = item.qty * hargaNormal;
            const subFinal = item.qty * item.harga;
            subtotalTanpaDiskon += subNormal;
            subtotalFinal += subFinal;
            totalDiskon += (subNormal - subFinal);

            return `
                <div class="flex justify-between items-start">
                    <div>
                        <p class="font-bold text-slate-700">${item.nama}</p>
                        <div class="flex items-center gap-2">
                            ${hargaNormal > item.harga ? `<span class="text-[10px] text-slate-300 line-through">Rp ${hargaNormal.toLocaleString()}</span>` : ''}
                            <span class="text-[11px] text-slate-400 font-bold">${item.qty} x Rp ${item.harga.toLocaleString()}</span>
                        </div>
                    </div>
                    <p class="font-bold text-slate-800">Rp ${subFinal.toLocaleString()}</p>
                </div>`;
        }).join('');

        document.getElementById('txt-subtotal').innerText = "Rp " + subtotalTanpaDiskon.toLocaleString();
        if (totalDiskon > 0) {
            document.getElementById('row-diskon').classList.remove('hidden');
            document.getElementById('txt-diskon').innerText = "- Rp " + totalDiskon.toLocaleString();
            document.getElementById('badge-hemat').classList.remove('hidden');
            document.getElementById('badge-hemat').innerText = "Hemat Rp " + totalDiskon.toLocaleString();
        }
        updateTotalDisplay();
    }

    function updateTotalDisplay() {
        const totalBayar = subtotalFinal + shippingCost;
        document.getElementById('txt-ongkir').innerText = "Rp " + shippingCost.toLocaleString();
        document.getElementById('txt-total').innerText = "Rp " + totalBayar.toLocaleString();
    }

    async function searchArea(query) {
        if (query.length < 3) return;
        try {
            const res = await fetch(`https://api.biteship.com/v1/maps/areas?countries=ID&input=${query}&type=single`, {
                headers: { 'Authorization': BITES_API_KEY }
            });
            const data = await res.json();
            if (data.areas && data.areas.length > 0) {
                const resultsBox = document.getElementById('area-results');
                resultsBox.innerHTML = data.areas.map(a => `
                    <div onclick="selectArea('${a.id}', '${a.name}')" class="p-4 hover:bg-pink-50 cursor-pointer border-b border-slate-50 font-bold text-slate-600">
                        ${a.name}
                    </div>`).join('');
                resultsBox.classList.remove('hidden');
            }
        } catch (err) { console.error("Gagal cari area:", err); }
    }

    function selectArea(id, name) {
        document.getElementById('destination-id').value = id;
        document.getElementById('destination-search').value = name;
        document.getElementById('area-results').classList.add('hidden');
    }

   async function checkShippingRates() {
    const destId = document.getElementById('destination-id').value;
    if (!destId) return alert("Pilih Kecamatan/Kota tujuan dulu! 🌸");
    
    const btn = document.getElementById('btn-cek-ongkir');
    btn.innerText = "MENGHITUNG...";

    // 1. Siapkan data barang dengan dimensi default (P:10, L:10, T:10)
    // Biteship butuh dimensi agar tidak error 404/400
    const items = cartData.map(i => ({
        name: i.nama,
        description: "Produk Kecantikan",
        value: i.harga,
        weight: i.berat || 200,
        quantity: i.qty,
        length: 10, 
        width: 10, 
        height: 10
    }));

    const payload = {
        origin_area_id: ORIGIN_ID,
        destination_area_id: destId,
        couriers: "jne,jnt,sicepat",
        items: items
    };

    console.log("Payload yang dikirim:", payload);

    try {
        const res = await fetch('https://api.biteship.com/v1/shippings/rates', {
            method: 'POST',
            headers: { 
                'Authorization': BITES_API_KEY, 
                'Content-Type': 'application/json' 
            },
            body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        
        if (!res.ok) {
            console.error("Biteship Error detail:", data);
            // Jika error 404, biasanya karena ID Area tidak ditemukan atau kurir belum aktif
            throw new Error(data.error || "Rute tidak ditemukan. Cek apakah kurir sudah di-enable di dashboard Biteship.");
        }

        if (data.results && data.results.length > 0) {
            renderShippingOptions(data.results);
        } else {
            alert("Kurir tidak tersedia untuk lokasi ini. Coba pilih kecamatan lain. 🌸");
        }

    } catch (err) {
        console.error("Detail Error:", err);
        alert("Gagal memuat ongkir: " + err.message);
    } finally {
        btn.innerText = "Cek Ongkos Kirim 🚚";
    }
}
    function renderShippingOptions(rates) {
        const container = document.getElementById('shipping-options');
        container.innerHTML = rates.map(r => `
            <div onclick="selectCourier('${r.courier_name} ${r.courier_service}', ${r.price})" class="p-4 border-2 rounded-2xl flex justify-between items-center cursor-pointer hover:border-pink-300 transition-all courier-box bg-white mb-2">
                <div>
                    <p class="text-[10px] font-black uppercase text-slate-400">${r.courier_name} - ${r.courier_service}</p>
                    <p class="text-xs font-bold text-slate-700">${r.duration}</p>
                </div>
                <p class="font-black text-slate-800 text-sm">Rp ${r.price.toLocaleString()}</p>
            </div>`).join('');
    }

    function selectCourier(name, price) {
        document.querySelectorAll('.courier-box').forEach(el => el.classList.remove('border-pink-500', 'bg-pink-50', 'active'));
        event.currentTarget.classList.add('border-pink-500', 'bg-pink-50', 'active');
        shippingCost = price;
        document.getElementById('selected-courier-name').value = name;
        document.getElementById('selected-shipping-cost').value = price;
        updateTotalDisplay();
    }

    async function processOrder() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const courier = document.getElementById('selected-courier-name').value;
        if (!name || !phone || !address || !courier) return alert("Lengkapi data pengiriman dan kurir! 🌸");

        const btn = document.getElementById('btn-order');
        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const { data: { user } } = await db.auth.getUser();
            const inv = `BLM-${Date.now().toString().slice(-6)}`;
            const finalAmount = subtotalFinal + shippingCost;

            const { data: midtrans, error: errFunc } = await db.functions.invoke('swift-function', {
                body: { order_id: inv, amount: finalAmount, customer_name: name, customer_email: customerEmail }
            });
            if (errFunc || !midtrans?.token) throw new Error("Gagal Midtrans.");

            const { data: trx, error: errTrx } = await db.from('transaksi_online').insert([{
                no_invoice: inv, customer_id: user.id, nama_penerima: name, wa_penerima: phone,
                alamat_kirim: `${address} (${document.getElementById('destination-search').value})`,
                kurir: courier, ongkos_kirim: shippingCost, grand_total: finalAmount, status_order: 'Pending', snap_token: midtrans.token
            }]).select().single();
            if (errTrx) throw errTrx;

            const details = cartData.map(item => ({
                transaksi_id: trx.id, produk_id: item.id, nama_barang: item.nama, qty: item.qty,
                harga_satuan: item.harga, subtotal_item: item.qty * item.harga
            }));
            await db.from('transaksi_online_detail').insert(details);

            window.snap.pay(midtrans.token, {
                onSuccess: () => { sessionStorage.removeItem('finexcart'); window.location.href = "online-shop.html"; },
                onPending: () => { sessionStorage.removeItem('finexcart'); window.location.href = "online-shop.html"; },
                onClose: () => { alert("Pesanan disimpan."); sessionStorage.removeItem('finexcart'); window.location.href = "online-shop.html"; }
            });
        } catch (e) { alert(e.message); btn.innerText = "BAYAR SEKARANG ✨"; btn.disabled = false; }
    }
</script>
</body>
</html>
