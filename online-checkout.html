<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Finex Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; }
        .input-field:focus { border-color: #ff85a2; ring: 2px; ring-color: #ffe5ec; }
    </style>
</head>
<body class="bg-slate-50 pb-10">

    <header class="bg-white shadow-sm sticky top-0 z-40 p-4 border-b border-pink-100">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <a href="shopp.html" class="text-pink-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800">Checkout Pesanan </h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        
        <div class="bg-white p-6 rounded-3xl shadow-sm mb-6 border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-box text-pink-400"></i> Produk Dipesan
            </h3>
            <div id="checkout-list" class="space-y-4">
                </div>
            <div class="mt-6 pt-4 border-t border-dashed border-slate-200">
                <div class="flex justify-between font-black text-xl text-[#f72585]">
                    <span>Total Bayar</span>
                    <span id="txt-total">Rp 0</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-map-marker-alt text-pink-400"></i> Data Pengiriman
            </h3>
            <div id="loading-profile" class="text-xs text-pink-400 mb-4 animate-pulse">Menyiapkan data profilmu...</div>
            
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase px-1">Nama Lengkap</label>
                    <input type="text" id="cust-name" class="input-field" placeholder="Memuat nama...">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase px-1">No. WhatsApp</label>
                    <input type="number" id="cust-phone" class="input-field" placeholder="Contoh: 62812xxx">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase px-1">Alamat Lengkap</label>
                    <textarea id="cust-address" rows="3" class="input-field" placeholder="Nama jalan, No rumah, Kec, Kota..."></textarea>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase px-1">Pilih Kurir</label>
                    <select id="courier" class="input-field">
                        <option value="JNT">J&T Express</option>
                        <option value="JNE">JNE Reguler</option>
                        <option value="SiCepat">SiCepat</option>
                        <option value="Ambil di Toko">Ambil di Toko (Free)</option>
                    </select>
                </div>
            </div>
        </div>

        <button onclick="sendOrderToWA()" class="w-full mt-8 bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            <i class="fab fa-whatsapp mr-2"></i> PESAN VIA WHATSAPP
        </button>

    </main>

<script>
    let cartData = JSON.parse(sessionStorage.getItem('finexcart')) || [];
    const MY_WA_NUMBER = "628xxxxxxxx"; // GANTI DENGAN NO WA TOKO ALLBERTO

    window.onload = async () => {
        renderCheckout();
        await loadCustomerData();
    };

    // Fungsi Ambil Data Profil dari Supabase
    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        
        if (user) {
            const { data, error } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            
            if (data) {
                document.getElementById('cust-name').value = data.full_name || "";
                document.getElementById('cust-phone').value = data.phone_number || "";
                document.getElementById('cust-address').value = data.address_shipping || "";
                document.getElementById('loading-profile').innerText = "Data profil berhasil diterapkan ✨";
            } else {
                document.getElementById('loading-profile').innerText = "Lengkapi data di bawah untuk pesanan pertama ya ";
            }
        } else {
            document.getElementById('loading-profile').innerText = "Anda masuk sebagai tamu.";
        }
    }

    function renderCheckout() {
        if (cartData.length === 0) {
            alert("Keranjang kosong!");
            window.location.href = "online-shop.html";
            return;
        }

        const container = document.getElementById('checkout-list');
        let total = 0;

        container.innerHTML = cartData.map(item => {
            const sub = item.qty * item.harga;
            total += sub;
            return `
                <div class="flex justify-between items-center">
                    <div>
                        <p class="font-bold text-slate-800 text-sm">${item.nama}</p>
                        <p class="text-xs text-slate-400">${item.qty} x Rp ${item.harga.toLocaleString()}</p>
                    </div>
                    <p class="font-bold text-slate-700">Rp ${sub.toLocaleString()}</p>
                </div>
            `;
        }).join('');

        document.getElementById('txt-total').innerText = "Rp " + total.toLocaleString();
    }

    function sendOrderToWA() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const courier = document.getElementById('courier').value;

        if (!name || !phone || !address) return alert("Mohon lengkapi data pengiriman ya Cantik! ");

        let itemsText = cartData.map(i => `- ${i.nama} (${i.qty}x)`).join('%0A');
        let totalVal = document.getElementById('txt-total').innerText;

        const message = `*HALOO BEAUTY BLOOM, SAYA MAU ORDER!*%0A%0A` +
                        `*Detail Pesanan:*%0A${itemsText}%0A%0A` +
                        `*Total:* ${totalVal}%0A` +
                        `----------------------------%0A` +
                        `*Data Pemesan:*%0A` +
                        `Nama: ${name}%0A` +
                        `WA: ${phone}%0A` +
                        `Alamat: ${address}%0A` +
                        `Kurir: ${courier}%0A%0A` +
                        `_Mohon segera diinfokan total ongkir dan no.rekening ya Kak!_`;

        const waLink = `https://wa.me/${MY_WA_NUMBER}?text=${message}`;
        
        sessionStorage.removeItem('finexcart');
        window.open(waLink, '_blank');
        window.location.href = "online-shop.html";
    }
</script>
</body>
</html>
