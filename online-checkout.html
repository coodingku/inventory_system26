<script>
    const BITES_API_KEY = "biteship_live.eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJuYW1lIjoid2Vic2l0ZSBmaW5leCIsInVzZXJJZCI6IjY5YjUzYTFjZmExYTg5MmM2Y2MxOTYzNyIsImlhdCI6MTc3MzQ5NTE2Mn0.lu-I0J6bMZsD38H7sk8LAEB6S_a88T-laIvZX3_NzAk"; 
    const ORIGIN_ID = "IDNP10CL1081"; 

    let cartData = JSON.parse(localStorage.getItem('finexcart')) || [];
    let subtotalFinal = 0;
    let shippingCost = 0;
    let diskonLoyalty = 0;
    let userData = null;

    window.onload = async () => { 
        await loadCustomerData(); 
        renderCheckout();

    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            const { data: profile } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (profile) {
                userData = profile;
                document.getElementById('cust-name').value = profile.full_name || "";
                document.getElementById('cust-phone').value = profile.phone_number || "";
                document.getElementById('cust-address').value = profile.address_shipping || "";
                document.getElementById('txt-saldo-display').innerText = "Rp " + (profile.saldo || 0).toLocaleString();
                
                // CEK LOYALTY OTOMATIS BERDASARKAN HISTORI
                await checkLoyaltyAutomatically(user.id);
            }
        }
    }

async function checkLoyaltyAutomatically(userId) {
    try {
        // 1. Ambil Aturan dari Database
        const { data: settings } = await db.from('app_settings').select('*');
        if (!settings) return;
        const rules = {};
        settings.forEach(s => { rules[s.key_name] = s.value_int; });

        const targetCount = rules.loyalty_target_count;
        const minNominal = rules.loyalty_min_nominal;
        const discountAmount = rules.loyalty_discount_amount;

        // 2. AMBIL SEMUA RIWAYAT (Selesai DAN Yang Sedang Berjalan)
        // Kita ambil semua yang statusnya BUKAN 'Dibatalkan'
        const { data: allHistory } = await db.from('transaksi_online')
            .select('grand_total, status_order')
            .eq('customer_id', userId)
            .neq('status_order', 'Dibatalkan');

        // 3. HITUNG YANG SUDAH SELESAI (Untuk syarat masuk siklus)
        const lunasOrders = allHistory.filter(trx => 
            trx.status_order === 'Selesai' && parseFloat(trx.grand_total) >= minNominal
        );
        const totalLunas = lunasOrders.length;

        // 4. HITUNG YANG SEDANG BERJALAN (Untuk blokir double claim)
        // Kita cek apakah ada pesanan yang statusnya belum selesai tapi sudah jalan
        const ongoingOrders = allHistory.filter(trx => 
            ['Pending', 'PROSES', 'Dikemas', 'Dikirim'].includes(trx.status_order)
        );
        const hasOngoing = ongoingOrders.length > 0;

        // 5. LOGIKA SIKLUS + PROTEKSI
        let currentSubtotal = cartData.reduce((sum, i) => sum + (i.qty * i.harga), 0);
        
        // SYARAT DISKON:
        // - Kelipatan target terpenuhi (totalLunas % targetCount === 0)
        // - TIDAK ADA pesanan lain yang sedang berjalan (hasOngoing === false)
        // - Subtotal cukup
        const isSiklusMatch = (totalLunas > 0 && totalLunas % targetCount === 0);

        if (isSiklusMatch && !hasOngoing && currentSubtotal >= minNominal) {
            diskonLoyalty = discountAmount;
            
            const rowEl = document.getElementById('row-diskon-khusus');
            if (rowEl) {
                rowEl.classList.remove('hidden');
                document.getElementById('txt-syarat-info').innerText = `Loyalty Reward Belanja ke-${totalLunas + 1} ✨`;
                document.getElementById('txt-diskon-member').innerText = "- Rp " + diskonLoyalty.toLocaleString();
            }
        } else {
            diskonLoyalty = 0;
            const rowEl = document.getElementById('row-diskon-khusus');
            if (rowEl) rowEl.classList.add('hidden');
            
            if (hasOngoing && isSiklusMatch) {
                console.log("Diskon ditahan: Selesaikan pesanan sebelumnya dulu! 🌸");
            }
        }

        updateTotalDisplay();
    } catch (err) {
        console.error("Loyalty Error:", err);
    }
}
    function selectPayment(method) {
        const total = subtotalFinal + shippingCost - diskonLoyalty;
        if (method === 'saldo' && userData.saldo < total) return alert("Saldo tidak cukup!");

        document.getElementById('selected-method').value = method;
        document.querySelectorAll('.payment-box').forEach(el => el.classList.remove('active', 'border-f72585'));
        document.querySelectorAll('.check-icon').forEach(el => el.classList.replace('text-pink-500', 'text-slate-100'));
        
        const activeBox = document.getElementById('pay-' + method);
        activeBox.classList.add('active', 'border-[#f72585]');
        activeBox.querySelector('.check-icon').classList.replace('text-slate-100', 'text-pink-500');

        const btn = document.getElementById('btn-order');
        btn.className = "w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-[22px] font-black text-lg shadow-lg active:scale-95 transition-all mb-4";
        btn.innerText = (method === 'saldo' ? "BAYAR PAKAI SALDO ✨" : (method === 'manual' ? "PESAN & KONFIRMASI WA ✨" : "BAYAR SEKARANG ✨"));
    }

    function renderCheckout() {
        if (cartData.length === 0) return window.location.href = "online-shop.html";
        const container = document.getElementById('checkout-list');
        subtotalFinal = 0;
        container.innerHTML = cartData.map(item => {
            const sub = item.qty * item.harga;
            subtotalFinal += sub;
            return `<div class="flex justify-between items-start mb-2"><div><p class="font-bold text-slate-700 uppercase text-[12px]">${item.nama || item.nama_barang}</p><p class="text-[11px] text-slate-400 font-bold">${item.qty} x Rp ${item.harga.toLocaleString()}</p></div><p class="font-bold text-slate-800">Rp ${sub.toLocaleString()}</p></div>`;
        }).join('');
        updateTotalDisplay();
    }

    function updateTotalDisplay() {
        const total = subtotalFinal + shippingCost - diskonLoyalty;
        document.getElementById('txt-subtotal').innerText = "Rp " + subtotalFinal.toLocaleString();
        document.getElementById('txt-ongkir').innerText = "Rp " + shippingCost.toLocaleString();
        document.getElementById('txt-total').innerText = "Rp " + (total < 0 ? 0 : total).toLocaleString();
    }

  async function searchArea(query) {
    const box = document.getElementById('area-results');
    if (query.length < 3) return box.classList.add('hidden');
    
    try {
        const res = await fetch(`https://api.biteship.com/v1/maps/areas?countries=ID&input=${query}&type=single`, { 
            headers: { 'Authorization': BITES_API_KEY.trim() } 
        });
        const data = await res.json();
        
        if (data.areas && data.areas.length > 0) {
            // KITA HANYA AMBIL .id NYA SAJA
            box.innerHTML = data.areas.map(a => `
                <div onclick="selectArea('${a.id}', '${a.name}')" 
                     class="p-4 hover:bg-pink-50 cursor-pointer border-b border-slate-50 font-bold text-slate-600 text-[11px]">
                    ${a.name}
                </div>
            `).join('');
            box.classList.remove('hidden');
        }
    } catch (e) { console.log("Gagal cari area"); }
}

function selectArea(id, name) {
    // Memastikan ID yang masuk tidak mengandung karakter aneh
    document.getElementById('destination-id').value = id; 
    document.getElementById('destination-search').value = name;
    document.getElementById('area-results').classList.add('hidden');
    
    console.log("ID TUJUAN TERPILIH:", id); // Cek di console, harusnya pendek (sekitar 12-15 karakter)
}

    const btn = document.getElementById('btn-cek-ongkir');

    btn.disabled = true;

    try {
        // Biteship Items harus bersih
        const itemsClean = cartData.map(i => ({

        }));

        const payload = {

        console.log("Payload yang dikirim:", payload);

        // COBA ENDPOINT INI: Tanpa /v1/ di depan jika masih 404,

       const res = await fetch('https://api.biteship.com/v1/shippings/rates', {

    function selectCourier(name, price) {
        document.querySelectorAll('.courier-box').forEach(el => el.classList.remove('border-pink-500', 'bg-pink-50', 'active'));
        event.currentTarget.classList.add('border-pink-500', 'bg-pink-50', 'active');
        shippingCost = price;
        document.getElementById('selected-courier-name').value = name;
        document.getElementById('selected-shipping-cost').value = price;
        updateTotalDisplay();
    }

async function processOrder() {
    const method = document.getElementById('selected-method').value;
    if (!method) return alert("Pilih metode pembayaran! 🌸");
    
    const totalBayar = subtotalFinal + shippingCost - diskonLoyalty;
    const name = document.getElementById('cust-name').value;
    const phone = document.getElementById('cust-phone').value;
    const address = document.getElementById('cust-address').value;
    const courier = document.getElementById('selected-courier-name').value || "Manual";

    if (!name || !address) return alert("Lengkapi Alamat!");

    const btn = document.getElementById('btn-order');
    btn.innerText = "Processing..."; btn.disabled = true;

    try {
        const inv = `BLM-${Date.now().toString().slice(-6)}`;
        
        // Logika Kurir: Jika saldo, beri tanda khusus untuk Admin
        const kurirDatabase = (method === 'saldo') ? 'Saldo Akun' : courier;
        let statusOrder = (method === 'saldo' ? 'Dikemas' : 'Pending');

        // --- 1. PROSES PEMBAYARAN SALDO ---
        if (method === 'saldo') {
            // Potong Saldo di tabel customers
            const { error: errUpdateSaldo } = await db.from('customers')
                .update({ saldo: userData.saldo - totalBayar })
                .eq('id', userData.id);
            
            if (errUpdateSaldo) throw new Error("Gagal memotong saldo.");

            // CATAT SEBAGAI 'PEMBAYARAN' DI RIWAYAT (Bukan Penarikan)
            await db.from('topup_history').insert([{
                no_invoice: inv,
                customer_id: userData.id,
                nominal: totalBayar,
                status: 'PEMBAYARAN' // Ini kuncinya agar tidak tertukar dengan WD atau Refund
            }]);
        }

        // --- 2. SIMPAN TRANSAKSI UTAMA ---
        const { data: trx, error: errTrx } = await db.from('transaksi_online').insert([{
            no_invoice: inv, 
            customer_id: userData.id, 
            nama_penerima: name, 
            wa_penerima: phone,
            alamat_kirim: address, 
            kurir: kurirDatabase, 
            ongkos_kirim: shippingCost,
            grand_total: totalBayar, 
            status_order: statusOrder
        }]).select().single();

        if (errTrx) throw errTrx;

        // --- 3. SIMPAN DETAIL PRODUK ---
        const details = cartData.map(item => ({ 
            transaksi_id: trx.id, 
            produk_id: item.id, 
            nama_barang: item.nama || item.nama_barang, 
            qty: item.qty, 
            harga_satuan: item.harga, 
            subtotal_item: item.qty * item.harga 
        }));
        await db.from('transaksi_online_detail').insert(details);

        // --- 4. PENYELESAIAN ---
        localStorage.removeItem('finexcart');

        if (method === 'saldo') {
            alert("Pembayaran Berhasil! Pesanan sedang dikemas. 🌸");
            window.location.href = "online-shop.html";
        } 
        else if (method === 'va') {
            const { data: midtrans } = await db.functions.invoke('smart-endpoint', { 
                body: { action: 'generate_token', order_id: inv, amount: totalBayar, customer_name: name, customer_email: userData.email } 
            });
            await db.from('transaksi_online').update({ snap_token: midtrans.token }).eq('id', trx.id);
            window.snap.pay(midtrans.token, { onSuccess: () => { window.location.href = "online-shop.html"; } });
        } 
        else {
            const waMsg = `Halo Admin! Pesanan *${inv}* (Rp ${totalBayar.toLocaleString()}). Mohon info rek transfer 🌸`;
            window.open(`https://wa.me/6281239739396?text=${encodeURIComponent(waMsg)}`, '_blank');
            window.location.href = "online-shop.html";
        }

    } catch (e) { 
        alert("Gagal: " + e.message); 
        btn.disabled = false; 
        btn.innerText = "BAYAR SEKARANG ✨";
    }
}
