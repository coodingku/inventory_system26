<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout | Finex Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="Mid-client-SxwBHyWfI2h4Py-b"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #fff0f3; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; background: white; }
        .input-field:focus { border-color: #ff85a2; ring: 2px; ring-color: #ffe5ec; }
        .payment-option { border: 2px solid #f1f5f9; cursor: pointer; transition: 0.3s; background: white; border-radius: 20px; }
        .payment-option.active { border-color: #f72585; background: #fff0f3; }
        .check-icon { display: none; }
        .payment-option.active .check-icon { display: block; }
    </style>
</head>
<body class="bg-[#fff0f3] pb-10">

    <header class="bg-white/80 backdrop-blur-md shadow-sm sticky top-0 z-40 p-4 border-b border-pink-100">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <a href="online-shop.html" class="text-pink-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800 tracking-tight">Checkout Pesanan 🌸</h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        <div class="bg-white p-6 rounded-[30px] shadow-sm mb-6 border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-pink-400"></i> Produk Dipesan
            </h3>
            <div id="checkout-list" class="space-y-4 text-sm"></div>
            <div class="mt-6 pt-4 border-t border-dashed border-slate-200 text-right">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                <h2 id="txt-total" class="text-2xl font-black text-[#f72585]">Rp 0</h2>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-truck text-pink-400"></i> Informasi Pengiriman
            </h3>
            <div id="loading-profile" class="text-[10px] text-pink-400 mb-4 animate-pulse font-black uppercase">Memuat profilmu...</div>
            <div class="space-y-4">
                <input type="text" id="cust-name" class="input-field" placeholder="Nama Penerima">
                <input type="number" id="cust-phone" class="input-field" placeholder="No. WhatsApp (628...)">
                <textarea id="cust-address" rows="3" class="input-field" placeholder="Alamat Lengkap & Patokan Rumah"></textarea>
                <select id="courier" class="input-field font-bold text-slate-600">
                    <option value="JNT">J&T Express</option>
                    <option value="JNE">JNE Reguler</option>
                    <option value="SiCepat">SiCepat</option>
                    <option value="Ambil di Toko">Ambil di Toko (Free)</option>
                </select>
            </div>
        </div>

        <div class="bg-white p-6 rounded-[30px] shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-credit-card text-pink-400"></i> Pilih Pembayaran
            </h3>
            <div class="space-y-3">
                <div id="pay-va" class="payment-option p-4 flex justify-between items-center active">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center">
                            <i class="fas fa-bolt"></i>
                        </div>
                        <div>
                            <p class="font-bold text-slate-700 text-sm">Pembayaran Otomatis</p>
                            <p class="text-[10px] text-slate-400">VA Bank, QRIS, & E-Wallet</p>
                        </div>
                    </div>
                    <i class="fas fa-check-circle text-pink-500" style="display:block"></i>
                </div>
            </div>
        </div>

        <button onclick="processOrder()" id="btn-order" class="w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-[22px] font-black text-lg shadow-lg shadow-pink-200 active:scale-95 transition-all mb-4">
            BAYAR SEKARANG ✨
        </button>
    </main>

<script>
    let cartData = JSON.parse(sessionStorage.getItem('finexcart')) || [];
    let grandTotal = 0;
    let customerEmail = "";

    window.onload = async () => {
        renderCheckout();
        await loadCustomerData();
    };

    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            customerEmail = user.email;
            const { data } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (data) {
                document.getElementById('cust-name').value = data.full_name || "";
                document.getElementById('cust-phone').value = data.phone_number || "";
                document.getElementById('cust-address').value = data.address_shipping || "";
                document.getElementById('loading-profile').innerText = "Data pengiriman terisi otomatis ✨";
            }
        }
    }

    function renderCheckout() {
        if (cartData.length === 0) return window.location.href = "online-shop.html";
        const container = document.getElementById('checkout-list');
        grandTotal = 0;
        container.innerHTML = cartData.map(item => {
            const sub = item.qty * item.harga;
            grandTotal += sub;
            return `<div class="flex justify-between items-center"><div><b>${item.nama}</b><br><small class="text-slate-400">${item.qty} x ${item.harga.toLocaleString()}</small></div><b>Rp ${sub.toLocaleString()}</b></div>`;
        }).join('');
        document.getElementById('txt-total').innerText = "Rp " + grandTotal.toLocaleString();
    }

    async function processOrder() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const courier = document.getElementById('courier').value;
        const btn = document.getElementById('btn-order');

        if (!name || !phone || !address) return alert("Mohon lengkapi data pengiriman! 🌸");

        btn.innerText = "Membuka Gerai Pembayaran...";
        btn.disabled = true;

        try {
            const { data: { user } } = await db.auth.getUser();
            const inv = `BLM-${Date.now().toString().slice(-6)}`;

            // --- PERBAIKAN DI SINI: Menggunakan Slug 'swift-function' ---
            const { data: midtrans, error: errFunc } = await db.functions.invoke('swift-function', {
                body: { 
                    order_id: inv,
                    amount: grandTotal,
                    customer_name: name,
                    customer_email: customerEmail || "customer@beautybloom.com"
                }
            });

            if (errFunc) throw new Error("Sistem sedang sibuk. Pastikan 'Enforce JWT' sudah OFF. 🌸");
            if (!midtrans || !midtrans.token) throw new Error("Gagal mengambil kode pembayaran. Periksa Server Key. 🌸");

            // Simpan Transaksi
            const { data: trx, error: errTrx } = await db.from('transaksi_online').insert([{
                no_invoice: inv,
                customer_id: user.id,
                nama_penerima: name,
                wa_penerima: phone,
                alamat_kirim: address,
                kurir: courier,
                metode_bayar: 'Midtrans Otomatis',
                grand_total: grandTotal,
                status_order: 'Pending',
                snap_token: midtrans.token
            }]).select().single();

            if (errTrx) throw errTrx;

            // Simpan Detail
            const details = cartData.map(item => ({
                transaksi_id: trx.id,
                produk_id: item.id,
                nama_barang: item.nama,
                qty: item.qty,
                harga_satuan: item.harga,
                subtotal_item: item.qty * item.harga
            }));
            await db.from('transaksi_online_detail').insert(details);

            // Buka Snap Pop-up
            window.snap.pay(midtrans.token, {
                onSuccess: function(result) {
                    sessionStorage.removeItem('finexcart');
                    window.location.href = "online-shop.html";
                },
                onPending: function(result) {
                    sessionStorage.removeItem('finexcart');
                    window.location.href = "online-shop.html";
                },
                onClose: function() {
                    alert("Pesanan disimpan. Jangan lupa bayar ya Kak! 🌸");
                    sessionStorage.removeItem('finexcart');
                    window.location.href = "online-shop.html";
                }
            });

        } catch (e) {
            console.error("Final Error:", e);
            alert(e.message);
            btn.innerText = "BAYAR SEKARANG ✨";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
