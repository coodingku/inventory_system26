<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Checkout | Finex Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #fff0f3; }
        .input-field { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #e2e8f0; outline: none; transition: 0.3s; background: white; }
        .input-field:focus { border-color: #ff85a2; ring: 2px; ring-color: #ffe5ec; }
        .payment-option { border: 2px solid #f1f5f9; cursor: pointer; transition: 0.3s; background: white; }
        .payment-option.active { border-color: #f72585; background: #fff0f3; }
        .check-icon { display: none; }
        .payment-option.active .check-icon { display: block; }
    </style>
</head>
<body class="bg-[#fff0f3] pb-10">

    <header class="bg-white shadow-sm sticky top-0 z-40 p-4 border-b border-pink-100">
        <div class="max-w-2xl mx-auto flex items-center gap-4">
            <a href="online-shop.html" class="text-pink-500 text-xl"><i class="fas fa-arrow-left"></i></a>
            <h1 class="text-xl font-bold text-slate-800">Selesaikan Pesanan 🌸</h1>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-4 mt-6">
        
        <div class="bg-white p-6 rounded-3xl shadow-sm mb-6 border border-pink-50">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-shopping-bag text-pink-400"></i> Produk Dipesan
            </h3>
            <div id="checkout-list" class="space-y-4 text-sm"></div>
            <div class="mt-6 pt-4 border-t border-dashed border-slate-200 text-right">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Total Bayar</p>
                <h2 id="txt-total" class="text-2xl font-black text-[#f72585]">Rp 0</h2>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-truck text-pink-400"></i> Alamat Pengiriman
            </h3>
            <div id="loading-profile" class="text-[10px] text-pink-400 mb-4 animate-pulse font-black uppercase">Memuat profil...</div>
            <div class="space-y-4">
                <input type="text" id="cust-name" class="input-field" placeholder="Nama Lengkap Penerima">
                <input type="number" id="cust-phone" class="input-field" placeholder="No. WA (628...)">
                <textarea id="cust-address" rows="3" class="input-field" placeholder="Alamat Lengkap & Patokan"></textarea>
                <select id="courier" class="input-field font-bold text-slate-600">
                    <option value="JNT">J&T Express</option>
                    <option value="JNE">JNE Reguler</option>
                    <option value="SiCepat">SiCepat</option>
                    <option value="Ambil di Toko">Ambil di Toko (Free)</option>
                </select>
            </div>
        </div>

        <div class="bg-white p-6 rounded-3xl shadow-sm border border-pink-50 mb-6">
            <h3 class="font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                <i class="fas fa-credit-card text-pink-400"></i> Metode Pembayaran
            </h3>
            <div class="space-y-3">
                <div onclick="selectPayment('TF')" id="pay-tf" class="payment-option p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-3"><i class="fas fa-university text-slate-400"></i><p class="font-bold text-slate-700 text-sm">Transfer Manual</p></div>
                    <i class="fas fa-check-circle text-pink-500 check-icon"></i>
                </div>
                <div onclick="selectPayment('VA')" id="pay-va" class="payment-option p-4 rounded-2xl flex justify-between items-center">
                    <div class="flex items-center gap-3"><i class="fas fa-bolt text-slate-400"></i><p class="font-bold text-slate-700 text-sm">Virtual Account</p></div>
                    <i class="fas fa-check-circle text-pink-500 check-icon"></i>
                </div>
            </div>

            <div id="bank-info" class="hidden mt-4 p-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                <div class="flex justify-between items-center"><b class="text-slate-700 text-xs uppercase">BCA - Beauty Bloom</b><button onclick="copyRek()" class="text-pink-500 text-[10px] font-bold border border-pink-200 px-2 py-1 rounded-lg">SALIN</button></div>
                <p id="norek" class="text-xl font-black text-slate-800 mt-1">123-456-7890</p>
            </div>
        </div>

        <button onclick="processOrder()" id="btn-order" class="w-full bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white py-5 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">
            KONFIRMASI & PESAN ✨
        </button>

    </main>

<script>
    let cartData = JSON.parse(sessionStorage.getItem('finexcart')) || [];
    const MY_WA_NUMBER = "628xxxxxxxx"; // GANTI DENGAN NO WA ANDA
    let selectedPayMethod = "";
    let grandTotal = 0;

    window.onload = async () => {
        renderCheckout();
        await loadCustomerData();
    };

    async function loadCustomerData() {
        const { data: { user } } = await db.auth.getUser();
        if (user) {
            const { data } = await db.from('customers').select('*').eq('id', user.id).maybeSingle();
            if (data) {
                document.getElementById('cust-name').value = data.full_name || "";
                document.getElementById('cust-phone').value = data.phone_number || "";
                document.getElementById('cust-address').value = data.address_shipping || "";
                document.getElementById('loading-profile').innerText = "Alamat otomatis terisi ✨";
            } else {
                document.getElementById('loading-profile').innerText = "Data baru akan tersimpan di profilmu 🌸";
            }
        }
    }

    function renderCheckout() {
        if (cartData.length === 0) return window.location.href = "online-shop.html";
        const container = document.getElementById('checkout-list');
        grandTotal = 0;
        container.innerHTML = cartData.map(item => {
            const sub = item.qty * item.harga;
            grandTotal += sub;
            return `<div class="flex justify-between items-center"><div><b>${item.nama}</b><br><small class="text-slate-400">${item.qty} x ${item.harga.toLocaleString()}</small></div><b>Rp ${sub.toLocaleString()}</b></div>`;
        }).join('');
        document.getElementById('txt-total').innerText = "Rp " + grandTotal.toLocaleString();
    }

    function selectPayment(type) {
        selectedPayMethod = type === 'TF' ? 'Transfer Bank' : 'Virtual Account';
        document.querySelectorAll('.payment-option').forEach(c => c.classList.remove('active'));
        document.getElementById(type === 'TF' ? 'pay-tf' : 'pay-va').classList.add('active');
        document.getElementById('bank-info').classList.remove('hidden');
    }

    function copyRek() { navigator.clipboard.writeText(document.getElementById('norek').innerText); alert("Norek disalin! 🌸"); }

    async function processOrder() {
        const name = document.getElementById('cust-name').value;
        const phone = document.getElementById('cust-phone').value;
        const address = document.getElementById('cust-address').value;
        const courier = document.getElementById('courier').value;
        const btn = document.getElementById('btn-order');

        if (!name || !phone || !address) return alert("Lengkapi data pengiriman! 🌸");
        if (!selectedPayMethod) return alert("Pilih pembayaran dulu! 🌸");

        btn.innerText = "Memproses Pesanan...";
        btn.disabled = true;

        const { data: { user } } = await db.auth.getUser();
        const inv = `BLM-${Date.now().toString().slice(-6)}`;

        try {
            // 1. Simpan Transaksi Utama
            const { data: trx, error: errTrx } = await db.from('transaksi_online').insert([{
                no_invoice: inv, customer_id: user.id, nama_penerima: name,
                wa_penerima: phone, alamat_kirim: address, kurir: courier,
                metode_bayar: selectedPayMethod, grand_total: grandTotal, status_order: 'Pending'
            }]).select().single();

            if (errTrx) throw errTrx;

            // 2. Simpan Detail Item
            for (const item of cartData) {
                await db.from('transaksi_online_detail').insert([{
                    transaksi_id: trx.id, produk_id: item.id, nama_barang: item.nama,
                    qty: item.qty, harga_satuan: item.harga, subtotal_item: item.qty * item.harga
                }]);
            }

            // 3. Buat Log Aktivitas Pertama
            await db.from('transaksi_online_log').insert([{
                transaksi_id: trx.id, status: 'Pesanan Dibuat', keterangan: 'Pesanan telah diterima oleh sistem Beauty Bloom.'
            }]);

            // 4. Kirim WA
            let itemsText = cartData.map(i => `- ${i.nama} (${i.qty}x)`).join('%0A');
            const message = `*ORDER ONLINE BEAUTY BLOOM*🌸%0AInv: ${inv}%0A%0A*Pesanan:*%0A${itemsText}%0A%0ATotal: Rp ${grandTotal.toLocaleString()}%0AMetode: ${selectedPayMethod}%0AAlamat: ${address}`;
            
            window.open(`https://wa.me/${MY_WA_NUMBER}?text=${message}`, '_blank');
            sessionStorage.removeItem('finexcart');
            window.location.href = "online-shop.html";

        } catch (e) {
            alert("Error: " + e.message);
            btn.innerText = "KONFIRMASI & PESAN ✨";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
