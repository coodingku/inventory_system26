<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Konfirmasi Withdraw 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script> <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .card-wd { background: white; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: 0.3s; }
    </style>
</head>
<body class="p-6">

    <header class="mb-8">
        <h1 class="text-2xl font-black text-slate-800">Persetujuan Tarik Dana 💸</h1>
        <p class="text-slate-500 text-sm">Kelola permintaan withdraw customer Beauty Bloom</p>
    </header>

    <div id="wdList" class="space-y-4">
        <p class="text-center py-10 text-slate-400 italic">Memuat permintaan... ✨</p>
    </div>

<script>
    window.onload = () => loadWithdrawRequests();

    async function loadWithdrawRequests() {
        const { data, error } = await db
            .from('withdraw_requests')
            .select('*, customers(full_name, saldo)')
            .eq('status', 'PENDING')
            .order('created_at', { ascending: false });

        const container = document.getElementById('wdList');
        
        if (error) {
            container.innerHTML = `<p class="text-red-500 text-center">Error: ${error.message}</p>`;
            return;
        }

        if (data.length === 0) {
            container.innerHTML = `<p class="text-center py-10 text-slate-400 italic">Tidak ada permintaan pending 🌸</p>`;
            return;
        }

        container.innerHTML = data.map(wd => `
            <div class="card-wd p-6 border border-slate-100">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <p class="text-[10px] font-bold text-pink-500 uppercase tracking-widest">${wd.no_invoice}</p>
                        <h3 class="font-bold text-lg text-slate-800">${wd.customers.full_name}</h3>
                        <p class="text-xs text-slate-400">${new Date(wd.created_at).toLocaleString()}</p>
                    </div>
                    <div class="text-right">
                        <p class="text-xs text-slate-400 uppercase">Nominal</p>
                        <p class="text-xl font-black text-slate-900">Rp ${wd.nominal.toLocaleString()}</p>
                    </div>
                </div>

                <div class="bg-slate-50 rounded-xl p-4 mb-4 text-sm">
                    <p class="text-slate-500 text-xs mb-1">Tujuan Transfer:</p>
                    <p class="font-bold text-slate-700">${wd.bank_name} - ${wd.account_number}</p>
                    <p class="text-slate-600 text-xs">A/n ${wd.account_name}</p>
                </div>

                <div class="flex gap-3">
                    <button onclick="approveWithdraw('${wd.id}', '${wd.customer_id}', ${wd.nominal})" 
                            class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold text-sm shadow-lg shadow-green-100 hover:bg-green-600 active:scale-95 transition-all">
                        APPROVE & POTONG SALDO
                    </button>
                    <button onclick="rejectWithdraw('${wd.id}')" 
                            class="px-5 bg-slate-100 text-slate-400 py-3 rounded-xl font-bold text-sm hover:bg-red-50 hover:text-red-500 transition-all">
                        TOLAK
                    </button>
                </div>
            </div>
        `).join('');
    }

    async function approveWithdraw(wdId, customerId, nominal) {
        if (!confirm("Sudah transfer uangnya? Klik OK untuk memotong saldo customer.")) return;

        // 1. Ambil saldo terbaru customer
        const { data: user } = await db.from('customers').select('saldo').eq('id', customerId).single();
        
        if (user.saldo < nominal) {
            alert("Gagal! Saldo customer tiba-tiba tidak cukup.");
            return;
        }

        const saldoBaru = user.saldo - nominal;

        // 2. Proses Update (Potong Saldo & Ubah Status WD)
        const { error: errUpdate } = await db.from('customers').update({ saldo: saldoBaru }).eq('id', customerId);
        const { error: errWd } = await db.from('withdraw_requests').update({ status: 'SUCCESS' }).eq('id', wdId);

        if (!errUpdate && !errWd) {
            alert("Berhasil! Saldo terpotong dan status diperbarui. ✨");
            loadWithdrawRequests();
        } else {
            alert("Terjadi kesalahan sistem.");
        }
    }

    async function rejectWithdraw(wdId) {
        if (!confirm("Tolak permintaan ini?")) return;
        const { error } = await db.from('withdraw_requests').update({ status: 'REJECTED' }).eq('id', wdId);
        if (!error) {
            alert("Permintaan ditolak.");
            loadWithdrawRequests();
        }
    }
</script>
</body>
</html>
