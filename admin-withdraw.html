<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Withdraw Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
        .sidebar-link { transition: all 0.3s ease; border-radius: 16px; margin-bottom: 4px; }
        .sidebar-link:hover { background: #fff1f2; color: #f72585; }
        .sidebar-link.active { background: #f72585; color: white; box-shadow: 0 10px 15px -3px rgba(247, 37, 133, 0.3); }
        .card-wd { transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .card-wd:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="flex">

    <aside class="w-64 bg-white h-screen sticky top-0 border-r border-slate-100 flex flex-col p-6 hidden md:flex">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Finex Admin 🌸</h1>
            <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">Withdraw System</p>
        </div>

        <nav class="flex-1 sidebar-nav overflow-y-auto">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-chart-pie w-5"></i> Dashboard
            </a>
            <a href="admin-online.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-shopping-basket w-5"></i> Pesanan Online
            </a>
            <a href="admin-withdraw.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 font-bold text-sm">
                <i class="fas fa-money-bill-transfer w-5"></i> Penarikan Saldo
            </a>
            <a href="customers-list.html" class="sidebar-link flex items-center gap-3 px-4 py-3 text-slate-500 font-bold text-sm">
                <i class="fas fa-users w-5"></i> Data Customer
            </a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-10 max-w-6xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Persetujuan Tarik Dana 💸</h2>
                <p class="text-slate-500 text-sm">Kelola saldo keluar dengan sistem keamanan admin.</p>
            </div>
            <div class="flex gap-2">
                <button id="btnAudio" onclick="enableAudio()" class="bg-amber-100 text-amber-600 px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm border border-amber-200">
                    <i class="fas fa-volume-mute"></i> Aktifkan Suara
                </button>
            </div>
        </header>

        <div id="wdList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <p class="col-span-full text-center py-20 text-slate-400 italic">Memuat data penarikan... ✨</p>
        </div>
    </main>

<script>
    let isVoiceActive = false;

    window.onload = async () => {
        loadWithdrawRequests();
        subscribeRealtime();
    };

    // 1. AKTIFKAN AUDIO (Wajib diklik 1x)
    function enableAudio() {
        isVoiceActive = true;
        const msg = new SpeechSynthesisUtterance("Notifikasi penarikan aktif");
        msg.lang = "id-ID";
        window.speechSynthesis.speak(msg);
        const btn = document.getElementById('btnAudio');
        btn.innerHTML = '<i class="fas fa-volume-up"></i> Suara Aktif';
        btn.className = "bg-green-500 text-white px-4 py-2 rounded-xl font-bold text-xs flex items-center gap-2 shadow-sm";
    }

    // 2. FUNGSI SUARA MANUSIA MENYEBUT NAMA
    function playVoiceNotification(name) {
        if (!isVoiceActive) return;
        const text = `Ada pesan masuk, penarikan kembali saldo di akun atas nama ${name}`;
        const message = new SpeechSynthesisUtterance(text);
        message.lang = "id-ID";
        message.rate = 0.9;
        window.speechSynthesis.speak(message);
    }

    // 3. REALTIME MONITORING
    function subscribeRealtime() {
        db.channel('withdraw_realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'withdraw_requests' }, payload => {
            loadWithdrawRequests();
            // Ambil nama dari payload atau fetch ulang
            fetchUserName(payload.new.customer_id);
        })
        .subscribe();
    }

    async function fetchUserName(id) {
        const { data } = await db.from('customers').select('full_name').eq('id', id).single();
        if (data) playVoiceNotification(data.full_name);
    }

    // 4. LOAD DATA
    async function loadWithdrawRequests() {
        const { data, error } = await db
            .from('withdraw_requests')
            .select('*, customers(full_name, saldo)')
            .eq('status', 'PENDING')
            .order('created_at', { ascending: false });

        const container = document.getElementById('wdList');
        if (data && data.length > 0) {
            container.innerHTML = data.map(wd => `
                <div class="card-wd bg-white p-6 rounded-[30px] shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <p class="text-[9px] font-black text-pink-400 uppercase tracking-widest">${wd.no_invoice}</p>
                            <h3 class="text-lg font-black text-slate-800">${wd.customers.full_name}</h3>
                            <p class="text-[10px] text-slate-400 font-bold">${new Date(wd.created_at).toLocaleString('id-ID')}</p>
                        </div>
                        <div class="bg-pink-50 px-4 py-2 rounded-2xl">
                            <p class="text-[10px] text-pink-400 font-bold uppercase">Nominal</p>
                            <p class="text-lg font-black text-pink-500">Rp ${wd.nominal.toLocaleString()}</p>
                        </div>
                    </div>

                    <div class="bg-slate-50 rounded-2xl p-4 mb-5 border border-slate-100">
                        <p class="text-[10px] font-black text-slate-400 uppercase mb-2">Tujuan Transfer</p>
                        <p class="text-sm font-bold text-slate-700">${wd.bank_name} - ${wd.account_number}</p>
                        <p class="text-xs text-slate-500">A/n ${wd.account_name}</p>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="approveWithdraw('${wd.id}', '${wd.customer_id}', ${wd.nominal})" 
                            class="flex-1 bg-slate-900 text-white py-3 rounded-2xl font-black text-[10px] uppercase tracking-widest hover:bg-slate-800 transition-all">
                            APPROVE & POTONG SALDO
                        </button>
                        <button onclick="rejectWithdraw('${wd.id}')" 
                            class="px-4 py-3 bg-slate-100 text-slate-400 rounded-2xl font-black text-[10px] uppercase hover:bg-red-50 hover:text-red-500 transition-all">
                            TOLAK
                        </button>
                    </div>
                </div>
            `).join('');
        } else {
            container.innerHTML = `<div class="col-span-full text-center py-20 bg-white rounded-[40px] border border-dashed border-slate-200 text-slate-300 italic">Belum ada permintaan penarikan 🌸</div>`;
        }
    }

    async function approveWithdraw(wdId, customerId, nominal) {
        if (!confirm("Konfirmasi: Anda sudah transfer dana secara manual ke customer?")) return;

        const { data: user } = await db.from('customers').select('saldo').eq('id', customerId).single();
        if (user.saldo < nominal) return alert("Saldo customer tidak mencukupi!");

        const saldoBaru = user.saldo - nominal;
        const { error: err1 } = await db.from('customers').update({ saldo: saldoBaru }).eq('id', customerId);
        const { error: err2 } = await db.from('withdraw_requests').update({ status: 'SUCCESS' }).eq('id', wdId);

        if (!err1 && !err2) {
            alert("Berhasil! Saldo telah dipotong.");
            loadWithdrawRequests();
        }
    }

    async function rejectWithdraw(wdId) {
        if (confirm("Tolak permintaan ini?")) {
            await db.from('withdraw_requests').update({ status: 'REJECTED' }).eq('id', wdId);
            loadWithdrawRequests();
        }
    }
</script>
</body>
</html>
