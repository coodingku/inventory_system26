<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome | Finex Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-init.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #fff0f3;
            background-image: radial-gradient(at 0% 0%, hsla(343,100%,92%,1) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, hsla(340,100%,95%,1) 0, transparent 50%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 133, 162, 0.2);
            border-radius: 40px;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(255, 133, 162, 0.25);
            text-align: center;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-google {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            transition: all 0.3s ease;
        }
        .btn-google:hover { background: #f9fafb; border-color: #d1d5db; transform: translateY(-2px); }

        .btn-primary {
            background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%);
            box-shadow: 0 10px 20px rgba(247, 37, 133, 0.2);
        }
        .btn-primary:hover { transform: translateY(-2px); opacity: 0.9; }

        .flower-icon {
            font-size: 50px;
            color: #ff85a2;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 5px 10px rgba(255, 133, 162, 0.3));
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="flower-icon">
            <i class="fa-solid fa-spa"></i>
        </div>
        
        <h1 class="text-2xl font-black text-slate-800 mb-2">Beauty Bloom</h1>
        <p class="text-sm text-slate-500 mb-10">Rahasia cantikmu dimulai dari sini ✨</p>

        <button onclick="loginGoogle()" class="w-full btn-google py-4 rounded-2xl font-bold flex items-center justify-center gap-3 mb-4 shadow-sm">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
            Masuk dengan Google
        </button>

        <div class="flex items-center gap-4 my-6">
            <div class="h-[1px] bg-slate-200 flex-1"></div>
            <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Atau</span>
            <div class="h-[1px] bg-slate-200 flex-1"></div>
        </div>

        <div class="space-y-4">
            <input type="email" id="email" placeholder="Email Anda" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-pink-300 text-sm">
            <input type="password" id="password" placeholder="Password" class="w-full p-4 bg-slate-50 border-none rounded-2xl outline-none focus:ring-2 focus:ring-pink-300 text-sm">
            
            <button onclick="loginEmail()" class="w-full btn-primary text-white py-4 rounded-2xl font-black tracking-widest text-sm shadow-lg active:scale-95 transition-all">
                MASUK SEKARANG
            </button>
        </div>

        <p class="mt-8 text-xs text-slate-500">
            Belum punya akun? 
            <a href="register-customer.html" class="text-[#f72585] font-bold hover:underline">Daftar Akun</a>
        </p>

        <div class="mt-10 opacity-20">
            <p class="text-[8px] font-bold uppercase tracking-[4px]">Powered by Finex POS</p>
        </div>
    </div>

<script>
    // 1. LOGIN DENGAN GOOGLE
    async function loginGoogle() {
        const { data, error } = await db.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin + '/online-shop.html'
            }
        });
        if (error) alert("Gagal login Google: " + error.message);
    }

    // 2. LOGIN DENGAN EMAIL & PASSWORD
    async function loginEmail() {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (!email || !password) return alert("Isi email dan password ya!");

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            alert("Email atau password salah 🌸");
        } else {
            // Simpan session & lanjut ke toko
            localStorage.setItem('customer_session', JSON.stringify(data.session));
            window.location.href = 'online-shop.html';
        }
    }

    // Cek jika sudah login, langsung lempar ke toko
    window.onload = async () => {
        const { data: { session } } = await db.auth.getSession();
        if (session) {
            window.location.href = 'online-shop.html';
        }
    }
</script>
</body>
</html>
