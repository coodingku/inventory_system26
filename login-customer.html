<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun | Beauty Bloom 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: #fff0f3; font-family: 'Plus Jakarta Sans', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .reg-card { background: white; border-radius: 35px; padding: 40px 30px; width: 95%; max-width: 450px; shadow: 0 25px 50px -12px rgba(255, 133, 162, 0.2); border: 1px solid #ffe5ec; }
        .input-bloom { background: #fffafa; border: 1px solid #ffe5ec; transition: 0.3s; }
        .input-bloom:focus { border-color: #f72585; box-shadow: 0 0 0 4px rgba(247, 37, 133, 0.1); outline: none; }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-800">Daftar Akun 🌸</h1>
            <p class="text-xs text-slate-400 font-bold uppercase tracking-widest mt-2">Gabung Beauty Bloom Member</p>
        </div>

        <form id="regForm" class="space-y-4">
            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Nama Lengkap</label>
                <input type="text" id="reg-nama" required placeholder="Contoh: Bunga Citra" class="input-bloom w-full p-4 rounded-2xl text-sm mt-1">
            </div>

            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Nomor WhatsApp</label>
                <input type="number" id="reg-wa" required placeholder="628123456789" class="input-bloom w-full p-4 rounded-2xl text-sm mt-1">
            </div>

            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Email</label>
                <input type="email" id="reg-email" required placeholder="nama@email.com" class="input-bloom w-full p-4 rounded-2xl text-sm mt-1">
            </div>

            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Password</label>
                <input type="password" id="reg-pass" required placeholder="Minimal 6 karakter" class="input-bloom w-full p-4 rounded-2xl text-sm mt-1">
            </div>

            <button type="submit" id="btnDaftar" class="w-full bg-[#f72585] text-white py-4 rounded-2xl font-black tracking-widest shadow-lg mt-4 active:scale-95 transition-all">
                DAFTAR & KIRIM OTP ✨
            </button>
        </form>

        <p class="text-center mt-6 text-xs text-slate-400 font-semibold">
            Sudah punya akun? <a href="login.html" class="text-pink-500 font-bold hover:underline">Masuk di sini</a>
        </p>
    </div>

    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnDaftar');
            const nama = document.getElementById('reg-nama').value;
            const wa = document.getElementById('reg-wa').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;

            btn.disabled = true;
            btn.innerText = "MEMPROSES...";

            try {
                // 1. DAFTARKAN KE SUPABASE AUTH
                const { data: authData, error: authError } = await db.auth.signUp({
                    email: email,
                    password: pass
                });

                if (authError) throw authError;

                // 2. GENERATE KODE OTP ACAK (6 Digit)
                const otpCode = Math.floor(100000 + Math.random() * 900000);

                // 3. SIMPAN DATA KE TABEL CUSTOMERS
                const { error: dbError } = await db.from('customers').insert([{
                    id: authData.user.id,
                    full_name: nama,
                    phone_number: wa,
                    email: email,
                    otp_code: otpCode, // Simpan OTP untuk verifikasi nanti
                    is_verified: false
                }]);

                if (dbError) throw dbError;

                // 4. KIRIM KODE OTP KE WHATSAPP (Via WhatsApp Link Redirect)
                // Ini cara termudah: User diarahkan ke WA untuk "mendapatkan" kodenya
                const pesan = `Halo ${nama}! 🌸\n\nTerima kasih telah mendaftar di Beauty Bloom.\n\nKode Verifikasi (OTP) kamu adalah: *${otpCode}*\n\nSilakan masukkan kode ini di halaman pendaftaran untuk mengaktifkan akun kamu ya!`;
                
                const waLink = `https://wa.me/${wa}?text=${encodeURIComponent(pesan)}`;
                
                alert("Pendaftaran berhasil! Klik OK untuk menerima kode OTP via WhatsApp. 🌸");
                
                // Simpan email di localStorage untuk halaman verifikasi
                localStorage.setItem('pending_email', email);
                
                window.open(waLink, '_blank');
                window.location.href = 'verify-otp.html';

            } catch (err) {
                alert("Gagal Daftar: " + err.message);
                btn.disabled = false;
                btn.innerText = "DAFTAR & KIRIM OTP ✨";
            }
        };
    </script>
</body>
</html>
