<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty | Online Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-init.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

        .product-card { background: white; border-radius: 24px; overflow: hidden; transition: all 0.3s ease; border: 1px solid #f1f5f9; }
        .product-card:active { transform: scale(0.95); }

        .img-container { aspect-ratio: 1 / 1; overflow: hidden; background: #f1f5f9; cursor: pointer; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @keyframes pulse-cart {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .cart-animate { animation: pulse-cart 0.3s ease-in-out; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; background: white;
            display: flex; justify-content: space-around; padding: 12px 0 25px 0;
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05); border-radius: 24px 24px 0 0; z-index: 100;
        }

        /* BOTTOM SHEET DETAIL */
        .detail-modal {
            position: fixed; bottom: -100%; left: 0; right: 0; background: white;
            z-index: 1000; border-radius: 32px 32px 0 0;
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }
        .detail-modal.active { bottom: 0; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .drag-handle { width: 50px; height: 5px; background: #e2e8f0; border-radius: 10px; margin: 15px auto; }
    </style>
</head>
<body class="pb-28">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Selamat Datang</p>
            <h1 class="text-xl font-extrabold text-slate-800">Finex Beauty ✨</h1>
        </div>
        <button class="relative p-2 bg-white rounded-full shadow-sm border">
            <i class="fa-regular fa-bell text-slate-600"></i>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
    </header>

    <section class="px-6 mt-4">
        <div class="relative group">
            <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" 
                   class="w-full pl-12 pr-4 py-4 bg-white rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-400 outline-none transition-all" 
                   placeholder="Cari skincare favoritmu...">
        </div>

        <div class="flex gap-3 mt-6 overflow-x-auto no-scrollbar">
            <button class="px-6 py-2 bg-blue-600 text-white rounded-full text-sm font-bold shadow-lg shadow-blue-200">Semua</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Skincare</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Makeup</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Serum</button>
        </div>
    </section>

    <section class="px-6 mt-8">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-700 rounded-[32px] p-6 text-white relative overflow-hidden shadow-xl shadow-blue-100">
            <div class="relative z-10">
                <h2 class="text-lg font-extrabold italic">Diskon Akhir Pekan!</h2>
                <p class="text-xs opacity-80 mt-1">Gunakan kode: <span class="font-bold">CANTIK2026</span></p>
                <button class="mt-4 px-4 py-2 bg-white text-blue-600 rounded-xl text-[10px] font-black uppercase tracking-wider">Klaim Voucher</button>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>
    </section>

    <main class="px-6 mt-8">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-extrabold text-slate-800">Koleksi Produk</h3>
            <a href="#" class="text-xs font-bold text-blue-600">Lihat Semua</a>
        </div>
        <div id="onlineDisplay" class="grid grid-cols-2 gap-4">
            <div class="animate-pulse bg-white rounded-3xl h-60"></div>
            <div class="animate-pulse bg-white rounded-3xl h-60"></div>
        </div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeDetail()"></div>
    <div id="productDetailModal" class="detail-modal">
        <div class="drag-handle"></div>
        <div class="px-6 pb-10">
            <div class="aspect-square rounded-3xl mb-4 overflow-hidden bg-slate-100 h-64 mx-auto">
                <img id="detail-img" src="" class="w-full h-full object-cover">
            </div>
            <div class="flex justify-between items-start mb-2">
                <h2 id="detail-name" class="text-xl font-extrabold text-slate-800 flex-1"></h2>
                <p id="detail-price" class="text-xl font-black text-blue-600 ml-4"></p>
            </div>
            <p id="detail-cat" class="text-[10px] font-bold text-blue-500 uppercase tracking-widest mb-4"></p>
            <h3 class="font-bold text-slate-800 text-sm mb-2">Deskripsi Produk</h3>
            <p id="detail-desc" class="text-slate-500 text-sm leading-relaxed mb-8">Produk kecantikan premium.</p>
            <div class="flex gap-4">
                <button onclick="closeDetail()" class="flex-1 py-4 bg-slate-100 rounded-2xl font-bold text-slate-500">Tutup</button>
                <button id="btn-add-modal" class="flex-[2] py-4 bg-blue-600 text-white rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95 transition-all">
                    TAMBAH KERANJANG
                </button>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="flex flex-col items-center text-blue-600">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Beranda</span>
        </a>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-400 relative">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
            <span class="text-[10px] font-bold mt-1">Pesanan</span>
        </button>
        <a href="#" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-heart text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Favorit</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-user-circle text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Profil</span>
        </a>
    </nav>

<script>
    let shopCart = [];

    window.onload = loadOnlineMenu;

    async function loadOnlineMenu() {
        const q = document.getElementById('search').value;
        let query = db.from('produk').select('*').gt('stok_sekarang', 0);
        if (q) query = query.ilike('nama_barang', `%${q}%`);

        const { data, error } = await query.order('nama_barang');
        const container = document.getElementById('onlineDisplay');

        if (data.length === 0) {
            container.innerHTML = `<div class="col-span-2 text-center py-20 text-slate-400">Produk tidak ditemukan</div>`;
            return;
        }

        container.innerHTML = data.map(p => `
            <div class="product-card shadow-sm">
                <div class="img-container" onclick="openDetail('${p.id}', '${p.nama_barang}', ${p.harga_jual}, '${p.foto_url}', '${p.deskripsi || 'Produk kecantikan terbaik untuk Anda.'}', '${p.kategori}')">
                    <img src="${p.foto_url || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                </div>
                <div class="p-3">
                    <h4 class="font-bold text-slate-800 text-[13px] leading-tight h-8 overflow-hidden">${p.nama_barang}</h4>
                    <div class="flex justify-between items-center mt-3">
                        <p class="font-extrabold text-blue-600 text-sm">Rp ${p.harga_jual.toLocaleString()}</p>
                        <button onclick="addToOnlineCart('${p.id}', '${p.nama_barang}', ${p.harga_jual})" 
                                class="bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center transition-all active:bg-blue-600">
                            <i class="fas fa-plus text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>`).join('');
    }

    function openDetail(id, nama, harga, img, desc, cat) {
        document.getElementById('detail-name').innerText = nama;
        document.getElementById('detail-price').innerText = "Rp " + harga.toLocaleString();
        document.getElementById('detail-img').src = img || 'https://via.placeholder.com/300';
        document.getElementById('detail-desc').innerText = desc;
        document.getElementById('detail-cat').innerText = cat || 'Kecantikan';
        
        document.getElementById('btn-add-modal').onclick = function() {
            addToOnlineCart(id, nama, harga);
            closeDetail();
        };

        document.getElementById('productDetailModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeDetail() {
        document.getElementById('productDetailModal').classList.remove('active');
        document.getElementById('modalOverlay').classList.remove('active');
    }

    function addToOnlineCart(id, nama, harga) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga, qty: 1 });
        
        const badge = document.getElementById('cart-count');
        badge.innerText = shopCart.reduce((sum, item) => sum + item.qty, 0);
        
        badge.classList.remove('cart-animate');
        void badge.offsetWidth; 
        badge.classList.add('cart-animate');
    }

    function goToCheckout() {
        if (shopCart.length === 0) return alert("Pilih produk dulu kak!");
        sessionStorage.setItem('finexcart', JSON.stringify(shopCart));
        window.location.href = "online-checkout.html";
    }
</script>
</body>
</html>
