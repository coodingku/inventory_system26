<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty | Online Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-init.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        
        /* Glassmorphism Effect untuk Header */
        .glass-header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Card Produk Premium */
        .product-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid #f1f5f9;
        }
        
        .product-card:active {
            transform: scale(0.95);
        }

        .img-container {
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #f1f5f9;
        }

        /* Sembunyikan Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* Animasi Badge Keranjang */
        @keyframes pulse-cart {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .cart-animate { animation: pulse-cart 0.3s ease-in-out; }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 0 25px 0; /* Padding bawah lebih besar untuk iPhone modern */
            box-shadow: 0 -10px 20px rgba(0,0,0,0.05);
            border-radius: 24px 24px 0 0;
            z-index: 100;
        }
    </style>
</head>
<body class="pb-28">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p class="text-[10px] font-bold text-blue-600 uppercase tracking-widest">Selamat Datang</p>
            <h1 class="text-xl font-extrabold text-slate-800">Finex Beauty ✨</h1>
        </div>
        <button class="relative p-2 bg-white rounded-full shadow-sm border">
            <i class="fa-regular fa-bell text-slate-600"></i>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full border-2 border-white"></span>
        </button>
    </header>

    <section class="px-6 mt-4">
        <div class="relative group">
            <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" 
                   class="w-full pl-12 pr-4 py-4 bg-white rounded-2xl border-none shadow-sm focus:ring-2 focus:ring-blue-400 outline-none transition-all" 
                   placeholder="Cari skincare favoritmu...">
        </div>

        <div class="flex gap-3 mt-6 overflow-x-auto no-scrollbar">
            <button class="px-6 py-2 bg-blue-600 text-white rounded-full text-sm font-bold shadow-lg shadow-blue-200">Semua</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Skincare</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Makeup</button>
            <button class="px-6 py-2 bg-white text-slate-500 rounded-full text-sm font-semibold border">Serum</button>
        </div>
    </section>

    <section class="px-6 mt-8">
        <div class="bg-gradient-to-br from-blue-500 to-indigo-700 rounded-[32px] p-6 text-white relative overflow-hidden shadow-xl shadow-blue-100">
            <div class="relative z-10">
                <h2 class="text-lg font-extrabold italic">Diskon Akhir Pekan!</h2>
                <p class="text-xs opacity-80 mt-1">Gunakan kode: <span class="font-bold">CANTIK2026</span></p>
                <button class="mt-4 px-4 py-2 bg-white text-blue-600 rounded-xl text-[10px] font-black uppercase tracking-wider">Klaim Voucher</button>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>
    </section>

    <main class="px-6 mt-8">
        <div class="flex justify-between items-center mb-4">
            <h3 class="font-extrabold text-slate-800">Rekomendasi Untukmu</h3>
            <a href="#" class="text-xs font-bold text-blue-600">Lihat Semua</a>
        </div>

        <div id="onlineDisplay" class="grid grid-cols-2 gap-4">
            <div class="animate-pulse bg-white rounded-3xl h-60"></div>
            <div class="animate-pulse bg-white rounded-3xl h-60"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="flex flex-col items-center text-blue-600">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Beranda</span>
        </a>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-400 relative">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-3 bg-red-500 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
            <span class="text-[10px] font-bold mt-1">Pesanan</span>
        </button>
        <a href="#" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-heart text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Favorit</span>
        </a>
        <a href="#" class="flex flex-col items-center text-slate-400">
            <i class="fas fa-user-circle text-xl"></i>
            <span class="text-[10px] font-bold mt-1">Profil</span>
        </a>
    </nav>

<script>
    let shopCart = [];

    window.onload = loadOnlineMenu;

    async function loadOnlineMenu() {
        const q = document.getElementById('search').value;
        let query = db.from('produk').select('*').gt('stok_sekarang', 0);
        if (q) query = query.ilike('nama_barang', `%${q}%`);

        const { data, error } = await query.order('nama_barang');
        const container = document.getElementById('onlineDisplay');

        if (data.length === 0) {
            container.innerHTML = `<div class="col-span-2 text-center py-20 text-slate-400">Produk tidak ditemukan</div>`;
            return;
        }

        container.innerHTML = data.map(p => `
            <div class="product-card shadow-sm">
                <div class="img-container">
                    <img src="${p.foto_url || 'https://via.placeholder.com/300'}" 
                         class="w-full h-full object-cover" 
                         onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                </div>
                <div class="p-3">
                    <h4 class="font-bold text-slate-800 text-[13px] leading-tight h-8 overflow-hidden">${p.nama_barang}</h4>
                    <div class="flex justify-between items-center mt-3">
                        <p class="font-extrabold text-blue-600 text-sm">Rp ${p.harga_jual.toLocaleString()}</p>
                        <button onclick="addToOnlineCart('${p.id}', '${p.nama_barang}', ${p.harga_jual})" 
                                class="bg-slate-900 text-white w-8 h-8 rounded-full flex items-center justify-center transition-all active:bg-blue-600">
                            <i class="fas fa-plus text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>`).join('');
    }

    function addToOnlineCart(id, nama, harga) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga, qty: 1 });
        
        // Update UI
        const badge = document.getElementById('cart-count');
        badge.innerText = shopCart.reduce((sum, item) => sum + item.qty, 0);
        
        // Animasi Pulse pada Badge
        badge.classList.remove('cart-animate');
        void badge.offsetWidth; // Trigger reflow
        badge.classList.add('cart-animate');
    }

    function goToCheckout() {
        if (shopCart.length === 0) return alert("Pilih produk dulu kak!");
        sessionStorage.setItem('finexcart', JSON.stringify(shopCart));
        window.location.href = "online-checkout.html";
    }
</script>
</body>
</html>
