<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty Bloom | Shop</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-init.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #fff0f3; font-family: 'Segoe UI', sans-serif; padding-bottom: 100px; }
        .product-card { background: white; border-radius: 25px; overflow: hidden; border: 1px solid #ffe5ec; transition: 0.3s; }
        .img-box { aspect-ratio: 1/1; background: #fef1f2; overflow: hidden; }
        /* Floating Cart Button */
        .btn-floating { position: fixed; bottom: 30px; right: 25px; width: 75px; height: 75px; background: #f72585; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 25px rgba(247, 37, 133, 0.4); z-index: 1000; border: 4px solid white; transition: 0.3s; }
        .badge { position: absolute; top: -5px; right: -5px; background: #ff4d6d; color: white; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 50%; border: 2px solid white; }
        /* Pop-up Keranjang */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 450px; border-radius: 30px; padding: 25px; max-height: 85vh; overflow-y: auto; box-shadow: 0 25px 50px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <header class="sticky top-0 bg-white/80 backdrop-blur-md p-4 flex justify-between items-center z-50">
        <h2 class="text-xl font-black text-pink-500">Beauty Bloom 🌸</h2>
        <button class="text-slate-400 text-xl"><i class="fa-regular fa-bell"></i></button>
    </header>

    <main class="px-5 mt-4">
        <input type="text" id="search" onkeyup="loadMenu()" placeholder="Cari skincare favoritmu..." class="w-full p-4 rounded-2xl border-none shadow-sm mb-6 bg-white outline-none focus:ring-2 focus:ring-pink-300">
        
        <div id="onlineDisplay" class="grid grid-cols-2 gap-4">
            </div>
    </main>

    <div class="btn-floating" onclick="toggleCartModal()">
        <i class="fa-solid fa-basket-shopping"></i>
        <span id="cart-count" class="badge">0</span>
    </div>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-5 border-b pb-3">
                <h2 class="text-xl font-black text-slate-800">Rincian Pesanan</h2>
                <button onclick="toggleCartModal()" class="text-slate-300 text-2xl">&times;</button>
            </div>
            
            <div id="cartItems" class="space-y-4 mb-6">
                </div>

            <div class="bg-pink-50 p-5 rounded-2xl space-y-2 border border-pink-100">
                <div class="flex justify-between text-sm text-pink-600"><span>Subtotal:</span><span id="m-sub">Rp 0</span></div>
                <div class="flex justify-between text-sm text-red-500"><span>Potongan:</span><span id="m-disc">Rp 0</span></div>
                <div class="flex justify-between text-sm text-pink-600"><span>PPN:</span><span id="m-tax">Rp 0</span></div>
                <div class="flex justify-between text-xl font-black text-slate-800 pt-3 border-t border-pink-200">
                    <span>TOTAL:</span><span id="m-total" class="text-pink-500">Rp 0</span>
                </div>
            </div>

            <button onclick="window.location.href='online-checkout.html'" class="w-full mt-6 bg-[#f72585] text-white py-4 rounded-2xl font-black shadow-lg shadow-pink-200 active:scale-95 transition-all">PROSES BAYAR 🛍️</button>
        </div>
    </div>

    <script>
        let cart = [];
        let taxRate = 0.11; // Default PPN 11%

        window.onload = async () => { loadMenu(); };

        async function loadMenu() {
            const q = document.getElementById('search').value;
            let query = db.from('produk').select('*').gt('stok_sekarang', 0);
            if (q) query = query.ilike('nama_barang', `%${q}%`);
            else query = query.limit(4);

            const { data } = await query.order('nama_barang');
            document.getElementById('onlineDisplay').innerHTML = (data || []).map(p => `
                <div class="product-card">
                    <div class="img-box"><img src="${p.foto_url || 'https://via.placeholder.com/300'}" class="w-full h-full object-cover"></div>
                    <div class="p-3">
                        <h4 class="font-bold text-slate-700 text-xs truncate">${p.nama_barang}</h4>
                        <div class="flex justify-between items-center mt-3">
                            <p class="text-pink-500 font-black text-sm">Rp ${p.harga_jual.toLocaleString()}</p>
                            <button onclick="addToCart('${p.id}', '${p.nama_barang}', ${p.harga_jual})" class="bg-pink-50 text-pink-500 w-8 h-8 rounded-lg flex items-center justify-center active:bg-pink-500 active:text-white transition-all"><i class="fa-solid fa-plus text-[10px]"></i></button>
                        </div>
                    </div>
                </div>`).join('');
        }

        function addToCart(id, nama, harga) {
            const idx = cart.findIndex(c => c.id === id);
            if (idx > -1) cart[idx].qty++;
            else cart.push({ id, nama_barang: nama, harga, qty: 1, discountItem: 0 });
            calculateTotal();
        }

        function calculateTotal() {
            let sub = 0;
            document.getElementById('cart-count').innerText = cart.reduce((s, i) => s + i.qty, 0);
            
            document.getElementById('cartItems').innerHTML = cart.map((item, i) => {
                const totalItem = item.qty * item.harga;
                sub += totalItem;
                return `
                <div class="flex justify-between items-center">
                    <div><b class="text-sm text-slate-800">${item.nama_barang}</b><br><small class="text-slate-400">${item.qty} x Rp ${item.harga.toLocaleString()}</small></div>
                    <div class="text-right text-sm font-bold text-slate-800">Rp ${totalItem.toLocaleString()} <span onclick="cart.splice(${i},1);calculateTotal();" class="text-red-400 ml-2 font-black cursor-pointer">&times;</span></div>
                </div>`;
            }).join('');

            const tax = sub * taxRate;
            const total = sub + tax;
            document.getElementById('m-sub').innerText = "Rp " + sub.toLocaleString();
            document.getElementById('m-tax').innerText = "Rp " + tax.toLocaleString();
            document.getElementById('m-total').innerText = "Rp " + total.toLocaleString();
            sessionStorage.setItem('finexcart', JSON.stringify(cart));
        }

        function toggleCartModal() {
            const m = document.getElementById('cartModal');
            m.style.display = (m.style.display === 'flex') ? 'none' : 'flex';
        }
    </script>
</body>
</html>
