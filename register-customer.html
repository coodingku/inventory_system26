<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daftar Akun | Beauty Bloom</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { 
            background: #fff0f3; 
            background-image: radial-gradient(at 0% 0%, #ffe5ec 0, transparent 50%), radial-gradient(at 50% 0%, #fff0f3 0, transparent 50%); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            margin: 0; 
        }
        .register-card { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(15px); 
            border-radius: 35px; 
            padding: 40px 30px; 
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 25px 50px -12px rgba(255, 133, 162, 0.25); 
            text-align: center; 
            border: 1px solid rgba(255, 255, 255, 0.4); 
        }
        .btn-pink { 
            background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); 
            color: white; 
            transition: all 0.3s; 
        }
        .btn-pink:hover { transform: translateY(-2px); opacity: 0.9; }
        .input-bloom {
            background: #fffafa;
            border: 1px solid #ffe5ec;
            transition: 0.3s;
        }
        .input-bloom:focus {
            background: white;
            border-color: #ff85a2;
            box-shadow: 0 0 0 4px rgba(255, 133, 162, 0.1);
        }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-pink-50 rounded-full mb-6 text-pink-500 text-3xl">
            <i class="fa-solid fa-user-plus"></i>
        </div>
        
        <h1 class="text-2xl font-black text-slate-800 mb-1">Daftar Akun Baru</h1>
        <p class="text-sm text-slate-400 mb-8 font-bold uppercase tracking-wider">Beauty Bloom Community</p>

        <div class="space-y-4 text-left">
            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Nama Lengkap</label>
                <input type="text" id="fullname" placeholder="Contoh: Bunga Lestari" 
                    class="input-bloom w-full p-4 rounded-2xl outline-none text-slate-700 text-sm">
            </div>

            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Alamat Email</label>
                <input type="email" id="email" placeholder="email@contoh.com" 
                    class="input-bloom w-full p-4 rounded-2xl outline-none text-slate-700 text-sm">
            </div>
            
            <div>
                <label class="text-[10px] font-bold text-pink-400 ml-2 uppercase">Password</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" 
                    class="input-bloom w-full p-4 rounded-2xl outline-none text-slate-700 text-sm">
            </div>
        </div>

        <button onclick="handleRegister()" id="btnRegister" class="w-full btn-pink py-4 rounded-2xl font-black tracking-widest shadow-lg mt-8 active:scale-95 transition-all">
            DAFTAR SEKARANG
        </button>

        <p class="mt-8 text-xs text-slate-400 font-semibold">
            Sudah punya akun? 
            <a href="login-customer.html" class="text-pink-500 font-bold hover:underline">Masuk di sini</a>
        </p>
    </div>

    <script>
      async function handleRegister() {
    const fullname = document.getElementById('fullname').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btnRegister');

    if (!fullname || !email || !password) {
        return alert("Tolong lengkapi semua data ya Cantik! 🌸");
    }

    if (password.length < 6) {
        return alert("Password minimal 6 karakter ya!");
    }

    btn.innerText = "Mendaftarkan...";
    btn.disabled = true;

    try {
        // 1. DAFTARKAN KE AUTH (Sistem Login)
        const { data: authData, error: authError } = await db.auth.signUp({
            email: email,
            password: password,
            options: {
                data: { full_name: fullname }
            }
        });

        if (authError) throw authError;

        // 2. SIMPAN KE TABEL DATABASE (Agar muncul di halaman Admin)
        // Kita simpan ke tabel 'users' (sesuai permintaan kamu sebelumnya)
        const { error: dbError } = await db.from('users').insert([{
            id: authData.user.id, // Menghubungkan UID Auth dengan Tabel
            full_name: fullname,
            email: email,
            created_at: new Date()
        }]);

        if (dbError) {
            console.error("Gagal simpan ke tabel database:", dbError.message);
            // Tetap lanjut karena akun Auth sudah berhasil dibuat
        }

        alert("Pendaftaran Berhasil! 🌸\nData kamu sudah tersimpan. Silakan login.");
        window.location.href = 'login-customer.html';

    } catch (error) {
        alert("Pendaftaran Gagal: " + error.message);
        btn.innerText = "DAFTAR SEKARANG";
        btn.disabled = false;
    }
}
    </script>
</body>
</html>
