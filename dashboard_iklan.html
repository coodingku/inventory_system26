<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Official Store 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; margin: 0; scroll-behavior: smooth; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .glass-nav { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(247, 37, 133, 0.1); }
        
        /* Slider Styles */
        .slider-container { position: relative; width: 100%; height: 100%; overflow: hidden; border-radius: 35px; }
        .slide-item { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: none; }
        .slide-item.active { opacity: 1; display: block; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .dot-ad { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: all 0.3s; }
        .dot-ad.active { background: white; width: 20px; border-radius: 10px; }

        .category-icon { transition: all 0.2s ease; cursor: pointer; }
        .category-icon:active { transform: scale(0.9); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .product-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="pb-32">

    <nav class="glass-nav sticky top-0 z-50 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-black text-[#f72585] tracking-tighter">BeautyBloom</h1>
        </div>
        <div class="flex items-center gap-3">
            <button onclick="window.location.href='login-customer.html'" class="text-[10px] font-black text-slate-600 px-4 py-2 rounded-full border border-slate-200">MASUK</button>
            <button onclick="window.location.href='login-customer.html'" class="text-[10px] font-black bg-[#f72585] text-white px-5 py-2 rounded-full shadow-lg shadow-pink-200">DAFTAR</button>
        </div>
    </nav>

    <section class="p-4 max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
        <div class="md:col-span-2 relative h-56 md:h-80 bg-slate-200 rounded-[35px] overflow-hidden shadow-xl shadow-pink-100">
            <div id="promo-slider" class="slider-container">
                <div class="slide-item active flex items-center justify-center bg-gradient-to-br from-[#ff85a2] to-[#f72585] text-white">
                    <div class="text-center">
                        <i class="fas fa-circle-notch animate-spin text-3xl mb-2"></i>
                        <p class="text-[10px] font-bold uppercase tracking-widest">Memuat Promo...</p>
                    </div>
                </div>
            </div>
            <div id="promo-dots" class="absolute bottom-5 left-10 flex gap-2 z-20"></div>
        </div>

        <div class="flex flex-col gap-4">
            <div class="h-1/2 bg-sky-400 rounded-[30px] p-6 text-white relative overflow-hidden shadow-lg">
                <h3 class="font-black text-lg leading-tight">Holiday <br> Sale! 🌴</h3>
                <p class="text-[10px] opacity-80 mt-1 uppercase font-bold">Diskon s/d 60%</p>
                <img src="https://cdn-icons-png.flaticon.com/512/3063/3063822.png" class="absolute -right-2 bottom-0 w-20 opacity-40">
            </div>
            <div class="h-1/2 bg-orange-400 rounded-[30px] p-6 text-white relative overflow-hidden shadow-lg">
                <h3 class="font-black text-lg leading-tight">New <br> Arrivals 👗</h3>
                <p class="text-[10px] opacity-80 mt-1 uppercase font-bold">Koleksi Terbaru</p>
                <img src="https://cdn-icons-png.flaticon.com/512/3159/3159614.png" class="absolute -right-2 bottom-0 w-20 opacity-40">
            </div>
        </div>
    </section>

    <section class="max-w-6xl mx-auto px-4 mt-10">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h3 class="text-xl font-black text-slate-800 tracking-tight italic uppercase">Koleksi Pilihan 🌸</h3>
                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Produk Fashion & Beauty Terbaru</p>
            </div>
            <button onclick="window.location.href='online-shop.html'" class="text-[10px] font-black text-pink-500 border-b-2 border-pink-100 pb-1">LIHAT SEMUA</button>
        </div>

        <div id="productGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <div class="col-span-full text-center py-20 text-slate-400 text-[10px] font-black animate-pulse uppercase tracking-widest">
                Sedang Menyiapkan Katalog... ✨
            </div>
        </div>
    </section>

    <div id="floatingCart" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-md hidden z-[100]">
        <div class="bg-slate-900/95 backdrop-blur-xl p-4 rounded-[30px] shadow-2xl flex justify-between items-center border border-white/10">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-[#f72585] rounded-2xl flex items-center justify-center text-white">
                    <i class="fas fa-shopping-basket text-lg"></i>
                </div>
                <div>
                    <p id="cartCount" class="text-[9px] text-pink-400 font-black uppercase tracking-widest">0 ITEM</p>
                    <p id="cartTotal" class="text-white font-black text-sm uppercase">Rp 0</p>
                </div>
            </div>
            <button onclick="checkLoginBeforeCheckout()" class="bg-[#f72585] text-white px-7 py-3.5 rounded-2xl font-black text-[10px] uppercase shadow-lg active:scale-95 transition-all tracking-wider">
                Checkout 🌸
            </button>
        </div>
    </div>

<script>
    // 1. Inisialisasi Data dari Storage
    let cart = JSON.parse(localStorage.getItem('finexcart')) || [];
    let currentSlide = 0;

    // 2. Fungsi Update Tampilan Cart (Didefinisikan di awal agar bisa dipanggil instan)
    function updateCartBar() {
        const bar = document.getElementById('floatingCart');
        const countEl = document.getElementById('cartCount');
        const totalEl = document.getElementById('cartTotal');

        if (!bar || !countEl || !totalEl) return;

        if (cart && cart.length > 0) {
            bar.classList.remove('hidden');
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            const totalPrice = cart.reduce((s, i) => s + (i.qty * i.harga), 0);
            countEl.innerText = totalQty + " ITEM BERHASIL DIPILIH";
            totalEl.innerText = "Rp " + totalPrice.toLocaleString();
        } else {
            bar.classList.add('hidden');
        }
    }

    // 3. JALANKAN LANGSUNG SAAT SCRIPT DIMUAT (PENTING AGAR TIDAK HILANG SAAT REFRESH)
    // Gunakan timeout sedikit agar DOM ter-render sempurna
    setTimeout(updateCartBar, 50);

    window.onload = () => {
        fetchProducts();
        loadDynamicAds();
        updateCartBar(); 
    };

    async function loadDynamicAds() {
        const slider = document.getElementById('promo-slider');
        const dotsContainer = document.getElementById('promo-dots');
        const { data: setting } = await db.from('app_settings').select('value_text, is_active').eq('key_name', 'dashboard_banners').single();

        if (!setting || !setting.is_active || !setting.value_text) {
            slider.innerHTML = `<div class="slide-item active"><img src="https://via.placeholder.com/800x400?text=Beauty+Bloom+Promo"></div>`;
            return;
        }

        try {
            const adImages = JSON.parse(setting.value_text);
            slider.innerHTML = adImages.map((imgUrl, i) => `<div class="slide-item ${i === 0 ? 'active' : ''}"><img src="${imgUrl}"></div>`).join('');
            dotsContainer.innerHTML = adImages.map((_, i) => `<div class="dot-ad ${i === 0 ? 'active' : ''}"></div>`).join('');

            if (adImages.length > 1) {
                setInterval(() => {
                    const slides = document.querySelectorAll('.slide-item');
                    const dots = document.querySelectorAll('.dot-ad');
                    if (slides.length === 0) return;
                    slides[currentSlide].classList.remove('active');
                    dots[currentSlide].classList.remove('active');
                    currentSlide = (currentSlide + 1) % slides.length;
                    slides[currentSlide].classList.add('active');
                    dots[currentSlide].classList.add('active');
                }, 5000);
            }
        } catch (e) { console.error(e); }
    }

    async function fetchProducts() {
        const { data, error } = await db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true).order('created_at', { ascending: false });
        if (!error) renderProducts(data);
    }

    function renderProducts(list) {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = list.map(p => `
            <div class="product-card bg-white rounded-[32px] p-3 shadow-sm border border-pink-50 flex flex-col h-full group">
                <div class="w-full aspect-[4/5] bg-slate-50 rounded-[26px] mb-3 overflow-hidden relative">
                    <img src="${p.image_url || 'https://via.placeholder.com/300x400'}" class="w-full h-full object-cover">
                    ${p.is_diskon ? '<div class="absolute top-3 left-3 bg-[#f72585] text-white text-[8px] font-black px-2.5 py-1 rounded-lg uppercase">PROMO</div>' : ''}
                </div>
                <div class="flex-grow px-1">
                    <h4 class="font-bold text-slate-700 text-[11px] leading-tight uppercase mb-1 line-clamp-2">${p.nama_barang}</h4>
                    <p class="text-[#f72585] font-black text-sm italic">Rp ${p.harga_jual.toLocaleString()}</p>
                </div>
                <button onclick="addToCart('${p.id}', '${p.nama_barang}', ${p.harga_jual})" class="mt-4 w-full bg-slate-50 hover:bg-pink-100 text-pink-500 py-3 rounded-2xl text-[9px] font-black uppercase transition-all tracking-widest border border-pink-50">
                    + Keranjang
                </button>
            </div>
        `).join('');
    }

    function addToCart(id, nama, harga) {
        const idx = cart.findIndex(i => i.id === id);
        if (idx > -1) cart[idx].qty++;
        else cart.push({ id, nama, harga, qty: 1 });
        
        localStorage.setItem('finexcart', JSON.stringify(cart));
        updateCartBar();
        
        const btn = event.currentTarget;
        btn.innerHTML = "BERHASIL ✨";
        setTimeout(() => btn.innerText = "+ Keranjang", 800);
    }

    async function checkLoginBeforeCheckout() {
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
            alert("Hai cantik! Silahkan Login atau Daftar Akun dulu ya.. 🌸");
            window.location.href = "login-customer.html";
        } else {
            window.location.href = "online-shop.html"; 
        }
    }
</script>
</body>
</html>
