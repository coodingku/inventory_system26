<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Catalog 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255, 133, 162, 0.1); }
        .badge-diskon { position: absolute; top: 12px; left: 12px; background: var(--deep-pink); color: white; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; z-index: 10; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .detail-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .detail-modal.active { bottom: 0; }
    </style>
</head>
<body class="pb-32">

    <header class="p-6 max-w-2xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-black text-[#f72585]">Beauty Bloom 🌸</h1>
            <button onclick="window.location.href='login-customer.html'" class="text-pink-400"><i class="fas fa-user-circle text-2xl"></i></button>
        </div>

        <div class="bg-gradient-to-br from-[#ff85a2] to-[#f72585] rounded-[30px] p-6 text-white shadow-xl relative overflow-hidden">
            <div class="relative z-10">
                <span class="bg-white/20 text-[10px] font-black px-3 py-1 rounded-full uppercase">Member Promo</span>
                <h2 class="text-2xl font-black mt-2 leading-tight">Lihat Katalog <br> Dapatkan Diskon!</h2>
                <p class="text-[11px] opacity-90 mt-2">Daftar sekarang untuk nikmati kemudahan bayar pakai saldo.</p>
            </div>
            <i class="fas fa-heart absolute -right-4 -bottom-4 text-8xl opacity-10"></i>
        </div>
    </header>

    <div class="px-6 max-w-2xl mx-auto mb-6">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-4 text-pink-300"></i>
            <input type="text" id="searchInput" onkeyup="loadCatalog()" class="w-full pl-12 pr-4 py-4 bg-white rounded-3xl border-none shadow-sm outline-none focus:ring-2 focus:ring-pink-200" placeholder="Cari skincare favoritmu...">
        </div>
    </div>

    <main class="px-6 max-w-2xl mx-auto">
        <div id="catalogDisplay" class="grid grid-cols-2 gap-5">
            <div class="col-span-2 text-center py-20 text-pink-300 font-bold animate-pulse text-xs uppercase tracking-widest">Memuat Produk Cantik...</div>
        </div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeDetail()"></div>
    <div id="productDetailModal" class="detail-modal px-6 pb-10">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div id="detailContent" class="text-center">
            </div>
    </div>

    <div id="floatingCart" class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md hidden z-50">
        <div class="bg-slate-900/95 backdrop-blur-md p-4 rounded-[28px] shadow-2xl flex justify-between items-center border border-white/10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-pink-500 rounded-2xl flex items-center justify-center text-white"><i class="fas fa-shopping-bag text-sm"></i></div>
                <div>
                    <p id="cartCountLabel" class="text-[9px] text-pink-400 font-black uppercase tracking-widest">0 Item</p>
                    <p id="cartTotalLabel" class="text-white font-black text-sm">Rp 0</p>
                </div>
            </div>
            <button onclick="handleCheckoutRedirect()" class="bg-[#f72585] text-white px-6 py-3 rounded-2xl font-black text-[10px] tracking-widest uppercase shadow-lg">Checkout 🌸</button>
        </div>
    </div>

<script>
    let shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];

    window.onload = () => {
        loadCatalog();
        updateCartUI();
    };

    // LOGIKA HARGA (Sama persis dengan Online Shop Anda)
    function getActivePrice(p) {
        let basePrice = (p.harga_online > 0) ? p.harga_online : p.harga_jual;
        if (!p.is_diskon) return { price: basePrice, isDiscount: false, normal: basePrice };
        const skrg = new Date().getTime();
        const tglM = p.diskon_mulai ? new Date(p.diskon_mulai).getTime() : null;
        const tglA = p.diskon_akhir ? new Date(p.diskon_akhir).getTime() : null;
        const active = p.is_diskon && (!tglM || skrg >= tglM) && (!tglA || skrg <= tglA);
        return { price: active ? basePrice - (p.nominal_diskon || 0) : basePrice, isDiscount: active, normal: basePrice };
    }

    async function loadCatalog() {
        const q = document.getElementById('searchInput').value;
        // Hanya ambil yang stok > 0 dan tampil_online = true sesuai instruksi Admin
        let query = db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true);
        if (q) query = query.ilike('nama_barang', `%${q}%`);
        
        const { data } = await query.order('nama_barang');
        const display = document.getElementById('catalogDisplay');
        if (!data) return;

        display.innerHTML = data.map(p => {
            const pr = getActivePrice(p);
            return `
            <div class="product-card" onclick="openQuickView('${p.id}')">
                ${pr.isDiscount ? `<div class="badge-diskon">PROMO ✨</div>` : ''}
                <div class="aspect-square bg-white overflow-hidden">
                    <img src="${p.image_url || 'https://placehold.co/300'}" class="w-full h-full object-cover">
                </div>
                <div class="p-4 text-center">
                    <h4 class="font-bold text-slate-700 text-[11px] truncate uppercase">${p.nama_barang}</h4>
                    <div class="mt-1">
                        <p class="text-[9px] text-slate-400 ${pr.isDiscount ? 'line-through' : ''}">Rp ${pr.normal.toLocaleString()}</p>
                        <p class="font-black text-[#ff85a2] text-sm">Rp ${pr.price.toLocaleString()}</p>
                    </div>
                    <button onclick="event.stopPropagation(); addSimpleCart('${p.id}', '${p.nama_barang}', ${pr.price}, ${pr.normal})" class="w-full mt-3 bg-pink-50 text-pink-500 py-2 rounded-xl text-[10px] font-black uppercase">Tambah ✨</button>
                </div>
            </div>`;
        }).join('');
    }

    function addSimpleCart(id, nama, hargaFinal, hargaNormal) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga: hargaFinal, harga_normal: hargaNormal, qty: 1 });
        
        localStorage.setItem('finexcart', JSON.stringify(shopCart));
        updateCartUI();
    }

    function updateCartUI() {
        const bar = document.getElementById('floatingCart');
        if (shopCart.length > 0) {
            bar.classList.remove('hidden');
            const count = shopCart.reduce((s, i) => s + i.qty, 0);
            const total = shopCart.reduce((s, i) => s + (i.qty * i.harga), 0);
            document.getElementById('cartCountLabel').innerText = count + " ITEM";
            document.getElementById('cartTotalLabel').innerText = "Rp " + total.toLocaleString();
        } else {
            bar.classList.add('hidden');
        }
    }

    async function handleCheckoutRedirect() {
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
            alert("Satu langkah lagi! Login atau Daftar dulu ya cantik.. 🌸");
            window.location.href = "login-customer.html";
        } else {
            window.location.href = "online-shop.html"; // Atau langsung ke checkout
        }
    }

    async function openQuickView(id) {
        const { data: p } = await db.from('produk').select('*').eq('id', id).single();
        if (!p) return;
        const pr = getActivePrice(p);
        
        document.getElementById('detailContent').innerHTML = `
            <img src="${p.image_url}" class="w-48 h-48 mx-auto rounded-3xl object-cover shadow-lg mb-4">
            <h2 class="text-xl font-black text-slate-800">${p.nama_barang}</h2>
            <p class="text-pink-500 font-black text-lg">Rp ${pr.price.toLocaleString()}</p>
            <p class="text-slate-400 text-xs italic my-4 px-6">${p.keterangan || 'Rahasia cantikmu dimulai dari sini.'}</p>
            <button onclick="addSimpleCart('${p.id}', '${p.nama_barang}', ${pr.price}, ${pr.normal}); closeDetail()" class="w-full py-4 bg-slate-900 text-white rounded-2xl font-black uppercase text-[10px] tracking-widest shadow-lg">Masukkan Bag 🛍️</button>
        `;
        document.getElementById('productDetailModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeDetail() {
        document.getElementById('productDetailModal').classList.remove('active');
        document.getElementById('modalOverlay').classList.remove('active');
    }
</script>
</body>
</html>
