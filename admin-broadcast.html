<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Promo - Beauty Bloom ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-gradient-to-r from-pink-500 to-rose-400 p-6 text-white text-center">
            <h1 class="text-2xl font-bold">Update Promo Web 📣</h1>
            <p class="text-pink-100 text-sm">Muncul di lonceng notifikasi customer</p>
        </div>

        <div class="p-6 space-y-4">
            <div>
                <label class="block text-gray-600 text-sm font-semibold mb-1">Pesan Promo</label>
                <textarea id="promoPesan" rows="4" 
                    class="w-full p-4 border-2 border-gray-100 rounded-2xl focus:border-pink-300 outline-none transition-all resize-none"
                    placeholder="Contoh: Diskon 20% untuk semua produk hari ini saja! 🌸"></textarea>
            </div>

            <button onclick="updatePromo()" id="btnKirim"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 rounded-2xl transition-all transform active:scale-95 shadow-lg shadow-pink-200">
                <i class="fas fa-paper-plane mr-2"></i> Update Promo Sekarang
            </button>
            
            <p class="text-center text-xs text-gray-400">Pesan ini akan otomatis menggantikan promo sebelumnya.</p>
        </div>
    </div>

    <script>
        // --- KONFIGURASI SUPABASE ---
        const SUPABASE_URL = "https://uojhjskgugghwxtdsfvm.supabase.co";
        const SUPABASE_KEY = "MASUKKAN_ANON_KEY_ANDA"; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function updatePromo() {
            const pesan = document.getElementById('promoPesan').value;
            const btn = document.getElementById('btnKirim');

            if (!pesan) return alert("Isi pesan promonya dulu ya! 🌸");

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengirim...';

            try {
                const { error } = await db
                    .from('app_settings')
                    .update({ 
                        value_text: pesan,
                        updated_at: new Date() // Trigger agar deteksi notifikasi di customer jalan
                    })
                    .eq('key_name', 'promo_announcement');

                if (error) throw error;

                alert("Promo berhasil diupdate! ✨ Semua customer akan melihat titik merah di lonceng.");
                document.getElementById('promoPesan').value = "";
            } catch (err) {
                alert("Gagal: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Update Promo Sekarang';
            }
        }
    </script>
</body>
</html>
