<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirim Promo - Beauty Bloom ✨</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script> 
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-white rounded-[2rem] shadow-2xl overflow-hidden border border-white">
        <div class="bg-gradient-to-br from-pink-500 to-rose-400 p-8 text-white text-center">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center mx-auto mb-3">
                <i class="fas fa-bullhorn text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold">Broadcast Promo</h1>
            <p class="text-pink-100 text-sm">Update pengumuman di lonceng customer</p>
        </div>

        <div class="p-8 space-y-6">
            <div>
                <label class="block text-gray-500 text-xs font-bold uppercase tracking-wider mb-2 ml-1">Pesan Pengumuman</label>
                <textarea id="promoPesan" rows="5" 
                    class="w-full p-4 bg-gray-50 border-2 border-gray-50 rounded-2xl focus:border-pink-300 focus:bg-white outline-none transition-all resize-none text-gray-700 shadow-inner"
                    placeholder="Contoh: Promo Beauty Bloom! Diskon member 20% untuk semua treatment hari ini! 🌸"></textarea>
            </div>

            <button onclick="updatePromo()" id="btnKirim"
                class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold py-4 rounded-2xl transition-all transform active:scale-95 shadow-lg shadow-pink-200 flex justify-center items-center gap-2">
                <i class="fas fa-paper-plane"></i> 
                <span>Update Promo Sekarang</span>
            </button>
            
            <p class="text-center text-[10px] text-gray-400 leading-relaxed px-4">
                Pesan ini akan langsung muncul sebagai titik merah pada ikon lonceng di sisi Customer (Index).
            </p>
        </div>
    </div>

    <script>
        // Kita tidak perlu inisialisasi db lagi karena sudah ada di supabase-online.js
        // Pastikan variabel di supabase-online.js bernama 'db' atau 'supabaseClient'

        async function updatePromo() {
            const pesan = document.getElementById('promoPesan').value;
            const btn = document.getElementById('btnKirim');

            if (!pesan.trim()) {
                return alert("Tuliskan pesan promonya dulu ya, Admin! 🌸");
            }

            // Animasi Loading
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sedang Memproses...';

            try {
                // Mengupdate tabel app_settings pada row promo_announcement
                const { error } = await db
                    .from('app_settings')
                    .update({ 
                        value_text: pesan,
                        is_active: true,
                        // Menambahkan timestamp agar sisi customer mendeteksi adanya perubahan data baru
                        updated_at: new Date().toISOString() 
                    })
                    .eq('key_name', 'promo_announcement');

                if (error) throw error;

                alert("Berhasil! ✨ Promo telah diperbarui dan notifikasi customer aktif.");
                document.getElementById('promoPesan').value = "";
                
            } catch (err) {
                console.error(err);
                alert("Gagal mengupdate promo: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i> Update Promo Sekarang';
            }
        }
    </script>
</body>
</html>
