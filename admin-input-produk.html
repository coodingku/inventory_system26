<div class="form-group">
    <label>Foto Produk</label>
    <div style="display: flex; gap: 10px; align-items: center;">
        <input type="file" id="prod-foto" accept="image/*" onchange="previewImage(event)" style="flex: 1;">
        <img id="img-preview" src="" style="width: 50px; height: 50px; border-radius: 8px; object-fit: cover; display: none; border: 1px solid #ddd;">
    </div>
    <input type="hidden" id="prod-url-lama"> </div>

<script>
    // --- TAMBAHAN FUNGSI UPLOAD GAMBAR ---

    // 1. Preview Gambar saat dipilih
    function previewImage(event) {
        const reader = new FileReader();
        const preview = document.getElementById('img-preview');
        reader.onload = () => {
            preview.src = reader.result;
            preview.style.display = 'block';
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    // 2. Fungsi Utama Upload ke Storage
    async function uploadFotoProduk(file) {
        const fileExt = file.name.split('.').pop();
        const fileName = `${Date.now()}.${fileExt}`;
        const filePath = `produk/${fileName}`;

        // Upload ke bucket 'produk_images' (Pastikan bucket ini sudah dibuat & Public)
        const { error: uploadError } = await db.storage
            .from('produk_images')
            .upload(filePath, file);

        if (uploadError) throw uploadError;

        // Ambil URL Publik
        const { data } = db.storage.from('produk_images').getPublicUrl(filePath);
        return data.publicUrl;
    }

    // --- UPDATE FUNGSI SIMPAN (ONSUBMIT) ---
    document.getElementById('productForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('prod-id').value;
        const fileInput = document.getElementById('prod-foto');
        const btnSimpan = e.target.querySelector('button[type="submit"]');
        
        btnSimpan.innerText = "Memproses...";
        btnSimpan.disabled = true;

        try {
            let finalImageUrl = document.getElementById('prod-url-lama').value;

            // Jika ada file baru yang dipilih, upload dulu
            if (fileInput.files.length > 0) {
                finalImageUrl = await uploadFotoProduk(fileInput.files[0]);
            }

            const payload = {
                kode_barang: document.getElementById('prod-kode').value,
                nama_barang: document.getElementById('prod-nama').value,
                kategori_id: document.getElementById('prod-kategori').value,
                gudang_id: document.getElementById('prod-gudang').value,
                harga_beli: parseFloat(document.getElementById('prod-beli').value) || 0,
                harga_jual: parseFloat(document.getElementById('prod-harga').value) || 0,
                stok_sekarang: parseInt(document.getElementById('prod-stok').value) || 0,
                stok_gudang: parseInt(document.getElementById('prod-stok').value) || 0,
                image_url: finalImageUrl // Masukkan URL gambar ke kolom ini
            };

            const res = id ? 
                await db.from('produk').update(payload).eq('id', id) : 
                await db.from('produk').insert([payload]);

            if (!res.error) {
                alert("Berhasil simpan produk! ✨");
                closeModal();
                fetchProduk();
            } else {
                throw res.error;
            }
        } catch (err) {
            alert("Gagal: " + err.message);
        } finally {
            btnSimpan.innerText = "Simpan Data";
            btnSimpan.disabled = false;
        }
    };

    // --- UPDATE RENDER TABLE (Agar muncul gambar kecil di list) ---
    function renderTable(data) {
        const tbody = document.getElementById('product-list');
        tbody.innerHTML = data.map(p => `
            <tr>
                <td><small>${p.kode_barang || '-'}</small></td>
                <td>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img src="${p.image_url || 'https://via.placeholder.com/40'}" style="width:40px; height:40px; border-radius:5px; object-fit:cover;">
                        <b>${p.nama_barang}</b>
                    </div>
                </td>
                <td><small>${p.kategori?.nama_kategori || '-'} | ${p.gudang?.nama_gudang || '-'}</small></td>
                <td>Rp ${(p.harga_beli || 0).toLocaleString()}</td>
                <td style="color:var(--success); font-weight:bold;">Rp ${(p.harga_jual || 0).toLocaleString()}</td>
                <td><span class="badge-stock ${p.stok_sekarang < 10 ? 'stock-low' : 'stock-ok'}">${p.stok_sekarang || 0}</span></td>
                <td>
                    <button onclick="editProduk('${p.id}')" style="color:var(--accent); border:none; background:none; cursor:pointer; font-weight:bold;">Edit</button> |
                    <button onclick="hapusProduk('${p.id}')" style="color:var(--danger); border:none; background:none; cursor:pointer; font-weight:bold;">Hapus</button>
                </td>
            </tr>`).join('');
    }

    // --- UPDATE FUNGSI EDIT (Agar gambar lama muncul di modal) ---
    function editProduk(id) {
        const p = masterData.find(x => x.id === id);
        document.getElementById('prod-id').value = p.id;
        document.getElementById('prod-kode').value = p.kode_barang || '';
        document.getElementById('prod-nama').value = p.nama_barang;
        document.getElementById('prod-kategori').value = p.kategori_id;
        document.getElementById('prod-gudang').value = p.gudang_id;
        document.getElementById('prod-beli').value = p.harga_beli || 0;
        document.getElementById('prod-harga').value = p.harga_jual || 0;
        document.getElementById('prod-stok').value = p.stok_sekarang || 0;
        
        // Tampilkan foto lama di preview
        document.getElementById('prod-url-lama').value = p.image_url || '';
        const preview = document.getElementById('img-preview');
        if (p.image_url) {
            preview.src = p.image_url;
            preview.style.display = 'block';
        } else {
            preview.style.display = 'none';
        }

        document.getElementById('modalTitle').innerText = "Edit Produk";
        document.getElementById('productModal').style.display = 'flex';
    }
</script>
