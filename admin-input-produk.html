<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk | Finex Admin 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; margin: 0; }
        .sidebar-link { transition: all 0.3s ease; border-radius: 16px; margin-bottom: 4px; color: #64748b; }
        .sidebar-link:hover { background: #fff1f2; color: #f72585; }
        .sidebar-link.active { background: #f72585; color: white; box-shadow: 0 10px 15px -3px rgba(247, 37, 133, 0.3); }
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e2e8f0; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #f72585; }
        input:checked + .slider:before { transform: translateX(18px); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 32px; width: 95%; max-width: 500px; padding: 32px; max-height: 90vh; overflow-y: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 bg-white h-screen sticky top-0 border-r border-slate-100 flex flex-col p-6 hidden md:flex">
        <div class="mb-10 px-2">
            <h1 class="text-xl font-black text-slate-800 tracking-tight">Finex Admin 🌸</h1>
            <p class="text-[10px] font-bold text-pink-400 uppercase tracking-widest">Beauty Bloom POS</p>
        </div>
        <nav class="flex-1 overflow-y-auto no-scrollbar">
            <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 px-2 tracking-widest">Main Menu</p>
            <a href="dashboard.html" class="sidebar-link flex items-center gap-3 px-4 py-3 font-bold text-sm"><i class="fas fa-chart-pie w-5"></i> Dashboard</a>
            <a href="produk.html" class="sidebar-link active flex items-center gap-3 px-4 py-3 font-bold text-sm"><i class="fas fa-boxes w-5"></i> Katalog Produk</a>
            <a href="admin-online.html" class="sidebar-link flex items-center gap-3 px-4 py-3 font-bold text-sm"><i class="fas fa-shopping-basket w-5"></i> Pesanan Online</a>
            <a href="customers-list.html" class="sidebar-link flex items-center gap-3 px-4 py-3 font-bold text-sm"><i class="fas fa-users w-5"></i> Data Customer</a>
        </nav>
    </aside>

    <main class="flex-1 p-4 md:p-10 max-w-6xl">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Manajemen Produk 📦</h2>
                <p class="text-slate-500 text-sm">Kelola katalog produk, harga online, dan promo.</p>
            </div>
            <button onclick="openModal()" class="bg-[#f72585] text-white px-6 py-3 rounded-2xl font-bold text-sm shadow-lg shadow-pink-100 flex items-center gap-2">
                <i class="fas fa-plus"></i> Produk Baru
            </button>
        </header>

        <div class="flex flex-wrap gap-4 mb-6">
            <div class="relative flex-1 min-w-[300px]">
                <i class="fas fa-search absolute left-4 top-3.5 text-slate-300"></i>
                <input type="text" id="searchBar" onkeyup="filterProduk()" placeholder="Cari nama produk..." class="w-full pl-12 pr-4 py-3 bg-white border border-slate-100 rounded-2xl outline-none focus:ring-2 focus:ring-pink-200 text-sm">
            </div>
            <button onclick="exportExcel()" class="bg-white border border-slate-200 text-slate-600 px-5 py-3 rounded-2xl font-bold text-sm hover:bg-slate-50 transition-all flex items-center gap-2">
                <i class="fas fa-file-export"></i> Export Excel
            </button>
        </div>

        <div class="bg-white rounded-[40px] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="mainTable">
                    <thead class="bg-slate-50/50">
                        <tr>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest">Produk & Detail</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Toko (Offline)</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-pink-500 text-center">Website (Online)</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Tampil Online</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-center">Promo</th>
                            <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-widest text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="product-list" class="divide-y divide-slate-50"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div id="productModal" class="modal">
        <div class="modal-content no-scrollbar">
            <h3 id="modalTitle" class="text-xl font-black text-slate-800 mb-6 tracking-tight">Informasi Produk ✨</h3>
            <form id="productForm" class="space-y-4">
                <input type="hidden" id="prod-id">
                <input type="hidden" id="prod-url-lama">
                <div class="flex flex-col items-center mb-4">
                    <div class="w-24 h-24 bg-slate-50 rounded-3xl border-2 border-dashed border-slate-200 flex items-center justify-center overflow-hidden relative group">
                        <img id="img-preview" class="w-full h-full object-cover hidden">
                        <i id="img-icon" class="fas fa-camera text-slate-300 text-xl"></i>
                        <input type="file" id="prod-foto" accept="image/*" onchange="previewImage(event)" class="absolute inset-0 opacity-0 cursor-pointer">
                    </div>
                </div>
                <input type="text" id="prod-nama" required placeholder="Nama Produk" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-sm">
                <textarea id="prod-keterangan" rows="2" placeholder="Keterangan / Ukuran Produk" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-sm no-scrollbar"></textarea>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="prod-harga" placeholder="Harga Toko" class="w-full p-4 bg-slate-50 rounded-2xl outline-none border-none text-sm font-bold">
                    <input type="number" id="prod-harga-online" placeholder="Harga Online" class="w-full p-4 bg-pink-50/50 rounded-2xl outline-none border-none text-sm font-bold text-pink-600">
                </div>
                <div class="p-4 bg-slate-50 rounded-[24px] space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold text-slate-600">Aktifkan Promo Online</span>
                        <label class="switch"><input type="checkbox" id="prod-is-diskon"><span class="slider"></span></label>
                    </div>
                    <input type="number" id="prod-nominal-diskon" placeholder="Potongan Harga (Rp)" class="w-full p-3 bg-white rounded-xl outline-none text-xs border border-slate-100">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="datetime-local" id="prod-diskon-mulai" class="w-full p-2 bg-white rounded-lg text-[10px] border border-slate-100">
                        <input type="datetime-local" id="prod-diskon-akhir" class="w-full p-2 bg-white rounded-lg text-[10px] border border-slate-100">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="prod-stok" placeholder="Stok" class="p-4 bg-slate-50 rounded-2xl outline-none border-none text-sm">
                    <select id="prod-kategori" class="p-4 bg-slate-50 rounded-2xl outline-none border-none text-sm text-slate-500"></select>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="flex-1 py-4 font-bold text-slate-400 bg-slate-50 rounded-2xl">Batal</button>
                    <button type="submit" id="btnSimpan" class="flex-[2] py-4 font-bold text-white bg-[#f72585] rounded-2xl shadow-lg shadow-pink-100 uppercase text-xs">Simpan</button>
                </div>
            </form>
        </div>
    </div>

<script>
    let masterData = [];

    window.onload = async () => {
        await Promise.all([fetchProduk(), loadDropdowns()]);
    };

    async function loadDropdowns() {
        const { data } = await db.from('kategori').select('id, nama_kategori');
        document.getElementById('prod-kategori').innerHTML = data.map(k => `<option value="${k.id}">${k.nama_kategori}</option>`).join('');
    }

    async function fetchProduk() {
        const { data, error } = await db.from('produk').select('*').order('nama_barang');
        if (error) return console.error(error);
        masterData = data || [];
        renderTable(masterData);
    }

    function renderTable(data) {
        const tbody = document.getElementById('product-list');
        tbody.innerHTML = data.map(p => `
            <tr class="hover:bg-slate-50/50 transition-all text-sm">
                <td class="px-8 py-5">
                    <div class="flex items-center gap-4">
                        <img src="${p.image_url || 'https://placehold.co/100'}" class="w-10 h-10 rounded-xl object-cover border border-slate-100">
                        <div>
                            <p class="font-bold text-slate-800">${p.nama_barang}</p>
                            <p class="text-[9px] text-slate-400 font-medium">${p.keterangan || 'Tanpa keterangan'}</p>
                        </div>
                    </div>
                </td>
                <td class="px-8 py-5 text-center text-slate-500 font-medium">Rp ${(p.harga_jual || 0).toLocaleString()}</td>
                <td class="px-8 py-5 text-center text-pink-600 font-black">
                    ${p.harga_online > 0 ? 'Rp ' + p.harga_online.toLocaleString() : '<span class="text-slate-300 font-normal italic text-[10px]">Ikut Toko</span>'}
                </td>
                <td class="px-8 py-5 text-center">
                    <label class="switch">
                        <input type="checkbox" ${p.tampil_online ? 'checked' : ''} onchange="toggleOnlineStatus('${p.id}', this.checked)">
                        <span class="slider"></span>
                    </label>
                </td>
                <td class="px-8 py-5 text-center">
                    ${p.is_diskon ? '<span class="px-2 py-1 bg-green-50 text-green-500 rounded text-[10px] font-bold">PROMO 🔥</span>' : '<span class="text-slate-200 text-[10px]">Normal</span>'}
                </td>
                <td class="px-8 py-5 text-right">
                    <div class="flex justify-end gap-2">
                        <button onclick="editProduk('${p.id}')" class="w-8 h-8 bg-slate-50 text-slate-400 hover:text-pink-500 rounded-lg"><i class="fas fa-edit text-[10px]"></i></button>
                        <button onclick="hapusProduk('${p.id}')" class="w-8 h-8 bg-slate-50 text-slate-400 hover:text-red-500 rounded-lg"><i class="fas fa-trash text-[10px]"></i></button>
                    </div>
                </td>
            </tr>`).join('');
    }

    // FUNGSI FILTER PRODUK
    function filterProduk() {
        const q = document.getElementById('searchBar').value.toLowerCase();
        const filtered = masterData.filter(p => p.nama_barang.toLowerCase().includes(q));
        renderTable(filtered);
    }

    // FUNGSI EXPORT EXCEL
    function exportExcel() {
        const wb = XLSX.utils.book_new();
        const wsData = masterData.map(p => ({
            "Nama Barang": p.nama_barang,
            "Keterangan": p.keterangan,
            "Harga Toko": p.harga_jual,
            "Harga Online": p.harga_online,
            "Stok": p.stok_sekarang,
            "Tampil Online": p.tampil_online ? 'Ya' : 'Tidak',
            "Promo Aktif": p.is_diskon ? 'Ya' : 'Tidak'
        }));
        const ws = XLSX.utils.json_to_sheet(wsData);
        XLSX.utils.book_append_sheet(wb, ws, "Produk");
        XLSX.writeFile(wb, "Katalog_Produk_Finex.xlsx");
    }

    async function toggleOnlineStatus(id, status) {
        await db.from('produk').update({ tampil_online: status }).eq('id', id);
        fetchProduk();
    }

    function editProduk(id) {
        const p = masterData.find(x => x.id === id);
        if (!p) return;
        document.getElementById('prod-id').value = p.id;
        document.getElementById('prod-nama').value = p.nama_barang;
        document.getElementById('prod-keterangan').value = p.keterangan || '';
        document.getElementById('prod-harga').value = p.harga_jual;
        document.getElementById('prod-harga-online').value = p.harga_online || 0;
        document.getElementById('prod-is-diskon').checked = p.is_diskon;
        document.getElementById('prod-nominal-diskon').value = p.nominal_diskon || 0;
        if (p.diskon_mulai) document.getElementById('prod-diskon-mulai').value = p.diskon_mulai.slice(0, 16);
        if (p.diskon_akhir) document.getElementById('prod-diskon-akhir').value = p.diskon_akhir.slice(0, 16);
        document.getElementById('prod-stok').value = p.stok_sekarang;
        document.getElementById('prod-kategori').value = p.kategori_id;
        document.getElementById('prod-url-lama').value = p.image_url || '';
        const preview = document.getElementById('img-preview');
        if (p.image_url) { preview.src = p.image_url; preview.classList.remove('hidden'); document.getElementById('img-icon').classList.add('hidden'); }
        document.getElementById('productModal').style.display = 'flex';
    }

    document.getElementById('productForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btnSimpan');
        btn.disabled = true;
        const id = document.getElementById('prod-id').value;
        const payload = {
            nama_barang: document.getElementById('prod-nama').value,
            keterangan: document.getElementById('prod-keterangan').value,
            harga_jual: parseFloat(document.getElementById('prod-harga').value) || 0,
            harga_online: parseFloat(document.getElementById('prod-harga-online').value) || 0,
            is_diskon: document.getElementById('prod-is-diskon').checked,
            nominal_diskon: parseFloat(document.getElementById('prod-nominal-diskon').value) || 0,
            diskon_mulai: document.getElementById('prod-diskon-mulai').value || null,
            diskon_akhir: document.getElementById('prod-diskon-akhir').value || null,
            stok_sekarang: parseInt(document.getElementById('prod-stok').value) || 0,
            kategori_id: document.getElementById('prod-kategori').value
        };
        const res = id ? await db.from('produk').update(payload).eq('id', id) : await db.from('produk').insert([payload]);
        if (!res.error) { closeModal(); fetchProduk(); }
        btn.disabled = false;
    };

    function openModal() {
        document.getElementById('productForm').reset();
        document.getElementById('prod-id').value = '';
        document.getElementById('img-preview').classList.add('hidden');
        document.getElementById('img-icon').classList.remove('hidden');
        document.getElementById('productModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('productModal').style.display = 'none'; }
    function previewImage(event) {
        const reader = new FileReader();
        reader.onload = () => { 
            document.getElementById('img-preview').src = reader.result; 
            document.getElementById('img-preview').classList.remove('hidden');
            document.getElementById('img-icon').classList.add('hidden');
        }
        reader.readAsDataURL(event.target.files[0]);
    }
    async function hapusProduk(id) {
        if (confirm("Hapus produk ini?")) {
            await db.from('produk').delete().eq('id', id);
            fetchProduk();
        }
    }
</script>
</body>
</html>
