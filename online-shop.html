<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Online Shop 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-XXXXX"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; --accent-peach: #ffb3c1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); margin: 0; overflow-x: hidden; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 133, 162, 0.1); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255, 133, 162, 0.1); box-shadow: 0 4px 15px rgba(0,0,0,0.02); position: relative; }
        .product-card:active { transform: scale(0.96); }
        .img-container { aspect-ratio: 1 / 1; overflow: hidden; background: #fffafa; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .detail-modal, .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .detail-modal.active, .activity-modal.active { bottom: 0; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 15px 0 30px 0; box-shadow: 0 -10px 30px rgba(255, 133, 162, 0.15); border-radius: 35px 35px 0 0; z-index: 100; border-top: 1px solid #ff85a210; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; transition: all 0.2s; color: #cbd5e1; }
        .nav-item.active { color: var(--deep-pink); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .badge-diskon { position: absolute; top: 12px; left: 12px; background: var(--deep-pink); color: white; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; z-index: 10; }
        #image-slider { display: flex; overflow-x: auto; snap-snap-type: x mandatory; scroll-behavior: smooth; }
    </style>
</head>
<body class="pb-32 no-scrollbar">

    <header class="glass-header sticky top-0 z-50 px-6 py-5 text-center">
        <p id="welcome-msg" class="text-[9px] font-black text-[#ff4d6d] uppercase tracking-[0.2em] italic mb-1">Halo, Cantik! ✨</p>
        <h1 class="text-xl font-black text-slate-800 tracking-tight">Beauty Bloom Shop 🌸</h1>
    </header>

    <main class="px-6 mt-8">
        <div class="relative mb-8">
            <i class="fas fa-search absolute left-5 top-1/2 -translate-y-1/2 text-pink-300"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" class="w-full pl-12 pr-6 py-4 bg-white rounded-[22px] border-none shadow-sm outline-none focus:ring-2 focus:ring-pink-200 transition-all" placeholder="Cari skin care favoritmu...">
        </div>
        <div id="onlineDisplay" class="grid grid-cols-2 gap-4"></div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="cartModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Bag Belanja 🛍️</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400"></i></button>
        </div>
        <div id="cartList" class="space-y-4 mb-8"></div>
        <div class="pt-6 border-t border-dashed border-pink-100">
            <div class="flex justify-between mb-6">
                <span class="font-bold text-slate-400">Total Pembayaran:</span>
                <span id="cart-total-modal" class="font-black text-pink-500 text-xl">Rp 0</span>
            </div>
            <button onclick="goToCheckout('PROSES')" class="w-full py-5 bg-slate-900 text-white rounded-[22px] font-black shadow-lg uppercase text-[10px] tracking-widest active:scale-95 transition-all">Lanjut Checkout 🌸</button>
        </div>
    </div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-black text-slate-800">Lacak Pesanan 🚚</h2>
                <button onclick="openProfile()" class="text-[10px] font-black text-pink-500 uppercase underline">Profil Saya</button>
            </div>
            <div id="activityList" class="space-y-4 max-h-[50vh] overflow-y-auto no-scrollbar pt-2"></div>
            <button onclick="openHistory()" class="w-full mt-4 py-4 bg-pink-50 text-pink-500 font-black rounded-2xl text-[10px] uppercase tracking-widest">Lihat Riwayat Selesai</button>
        </div>
    </div>

    <div id="productDetailModal" class="detail-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-12 text-center">
            <div id="image-slider" class="snap-x snap-mandatory no-scrollbar rounded-[35px] border-4 border-white shadow-xl bg-pink-50 h-72 mb-6"></div>
            <h2 id="detail-name" class="text-2xl font-black text-slate-800"></h2>
            <p id="detail-price" class="text-xl font-black text-[#f72585] mt-1"></p>
            <p id="detail-desc" class="text-slate-400 text-xs my-6 px-4 py-3 bg-slate-50 rounded-2xl italic"></p>
            <button id="btn-add-modal" class="w-full py-5 bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white rounded-[22px] font-black shadow-lg uppercase tracking-widest text-[11px]">TAMBAH KE BAG ✨</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index_online.html" class="nav-item">
            <i class="fas fa-house-chimney text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Beranda</span>
        </a>
        <button onclick="openActivity()" class="nav-item">
            <i class="fas fa-receipt text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Pesanan</span>
        </button>
        <button onclick="goToCheckout('VIEW')" class="nav-item relative">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span id="cart-count" class="absolute -top-1 -right-2 bg-[#f72585] text-white text-[9px] font-black px-1.5 py-0.5 rounded-full border-2 border-white">0</span>
            <span class="text-[8px] font-black mt-1 uppercase">Bag</span>
        </button>
        <button onclick="window.location.href='online-checkout.html'" class="nav-item">
            <i class="fas fa-credit-card text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Checkout</span>
        </button>
    </nav>

    <script>
        let shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];
        let userData = null;

        window.onload = async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            loadCustomerData(session.user.id);
            loadOnlineMenu();
            updateCartDisplay();
        };

        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
            }
        }

        async function loadOnlineMenu() {
            const q = document.getElementById('search').value;
            let query = db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true);
            if (q) query = query.ilike('nama_barang', `%${q}%`);
            const { data } = await query.order('nama_barang');
            const display = document.getElementById('onlineDisplay');
            if (!data) return;
            
            display.innerHTML = data.map(p => {
                const pr = getActivePrice(p);
                return `
                <div class="product-card" onclick="openDetail('${p.id}', '${p.nama_barang}', ${pr.price}, ${pr.normal}, '${p.image_url}', '${p.keterangan || ''}', '${p.image_url_2}', '${p.image_url_3}')">
                    ${pr.isDiscount ? `<div class="badge-diskon">PROMO ✨</div>` : ''}
                    <div class="img-container"><img src="${p.image_url || 'https://placehold.co/300'}"></div>
                    <div class="p-4">
                        <h4 class="font-bold text-slate-700 text-[10px] truncate uppercase">${p.nama_barang}</h4>
                        <p class="font-black text-[#ff85a2] text-xs mt-1">Rp ${pr.price.toLocaleString()}</p>
                    </div>
                </div>`;
            }).join('');
        }

        function getActivePrice(p) {
            let basePrice = (p.harga_online > 0) ? p.harga_online : p.harga_jual;
            const skrg = new Date().getTime();
            const active = p.is_diskon && (!p.diskon_akhir || skrg <= new Date(p.diskon_akhir).getTime());
            return { price: active ? basePrice - (p.nominal_diskon || 0) : basePrice, isDiscount: active, normal: basePrice };
        }

        function openDetail(id, nama, harga, hargaNormal, img, desc, img2, img3) {
            const slider = document.getElementById('image-slider');
            const images = [img, img2, img3].filter(url => url && url !== 'null' && url !== '');
            slider.innerHTML = images.map(url => `<div class="min-w-full h-full snap-center flex-shrink-0"><img src="${url}" class="w-full h-full object-cover"></div>`).join('');
            
            document.getElementById('detail-name').innerText = nama;
            document.getElementById('detail-price').innerText = "Rp " + harga.toLocaleString();
            document.getElementById('detail-desc').innerText = desc || 'Produk kecantikan terbaik untukmu.';
            document.getElementById('btn-add-modal').onclick = () => { addToOnlineCart(id, nama, harga, hargaNormal); closeAllModals(); };
            
            document.getElementById('productDetailModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function addToOnlineCart(id, nama, hargaFinal, hargaNormal) {
            const idx = shopCart.findIndex(c => c.id === id);
            if (idx > -1) shopCart[idx].qty++;
            else shopCart.push({ id, nama, harga: hargaFinal, harga_normal: hargaNormal, qty: 1 });
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const count = shopCart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
            localStorage.setItem('finexcart', JSON.stringify(shopCart));
        }

        function goToCheckout(mode = 'VIEW') {
            if (shopCart.length === 0 && mode === 'PROSES') return alert("Pilih produk dulu! 🌸");
            if (mode === 'PROSES') return window.location.href = "online-checkout.html";
            
            renderCart();
            document.getElementById('cartModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function renderCart() {
            const container = document.getElementById('cartList');
            let total = 0;
            container.innerHTML = shopCart.map((item, index) => {
                total += (item.harga * item.qty);
                return `<div class="flex items-center gap-4 bg-slate-50 p-4 rounded-[22px]">
                    <div class="flex-1"><h4 class="font-bold text-slate-800 text-[10px] uppercase">${item.nama}</h4><p class="text-pink-500 font-black text-xs">Rp ${item.harga.toLocaleString()}</p></div>
                    <div class="flex items-center gap-3 bg-white px-3 py-1 rounded-xl shadow-sm">
                        <button onclick="updateQty(${index}, -1)" class="text-pink-400 font-bold">-</button>
                        <span class="text-xs font-black">${item.qty}</span>
                        <button onclick="updateQty(${index}, 1)" class="text-pink-400 font-bold">+</button>
                    </div>
                </div>`;
            }).join('') || '<p class="text-center text-slate-300 py-10 italic text-xs uppercase font-bold">Bag Kosong 🌸</p>';
            document.getElementById('cart-total-modal').innerText = "Rp " + total.toLocaleString();
        }

        function updateQty(index, change) {
            shopCart[index].qty += change;
            if (shopCart[index].qty <= 0) shopCart.splice(index, 1);
            updateCartDisplay();
            renderCart();
        }

        function openActivity() {
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
            // Logika load data pesanan aktif bisa ditaruh di sini
        }

        function closeAllModals() {
            document.querySelectorAll('.side-modal, .activity-modal, .detail-modal').forEach(m => m.classList.remove('active'));
            document.getElementById('modalOverlay').classList.remove('active');
        }
    </script>
</body>
</html>
