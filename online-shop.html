<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty Bloom | Online Shop 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="YOUR_CLIENT_KEY"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; --accent-peach: #ffb3c1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); margin: 0; }
        .glass-header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 133, 162, 0.2); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255, 133, 162, 0.1); box-shadow: 0 4px 15px rgba(255, 133, 162, 0.05); }
        .product-card:active { transform: scale(0.96); }
        .img-container { aspect-ratio: 1 / 1; overflow: hidden; background: #fffafa; cursor: pointer; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .detail-modal, .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 -15px 35px rgba(0,0,0,0.1); }
        .detail-modal.active, .activity-modal.active { bottom: 0; }
        .profile-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.9); width: 90%; max-width: 400px; background: white; border-radius: 35px; z-index: 2000; display: none; opacity: 0; transition: all 0.3s ease; padding: 30px; }
        .profile-modal.active { display: block; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-pending { background: #fee2e2; color: #ef4444; }
        .status-dibatalkan { background: #f1f5f9; color: #64748b; }
        .status-dikemas { background: #fff7ed; color: #ea580c; }
        .input-bloom { width: 100%; padding: 12px 15px; background: var(--soft-pink); border-radius: 15px; font-size: 14px; outline: none; border: 1px solid transparent; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px 0; box-shadow: 0 -10px 25px rgba(255, 133, 162, 0.1); border-radius: 30px 30px 0 0; z-index: 100; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p id="welcome-msg" class="text-[10px] font-bold text-[#ff4d6d] uppercase tracking-widest italic">Halo, Cantik! ✨</p>
            <h1 class="text-xl font-extrabold text-slate-800">Beauty Bloom 🌸</h1>
        </div>
        <button onclick="openProfile()" class="w-10 h-10 bg-pink-50 rounded-full border border-pink-100 text-pink-500 flex items-center justify-center shadow-sm active:scale-90 transition-all">
            <i class="fa-solid fa-user"></i>
        </button>
    </header>

    <section class="px-6 mt-6">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-4 text-pink-300"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" class="w-full pl-12 pr-4 py-4 bg-white rounded-3xl border-none shadow-sm focus:ring-2 focus:ring-pink-300 outline-none" placeholder="Cari perawatan cantikmu...">
        </div>
    </section>

    <main class="px-6 mt-8">
        <div id="onlineDisplay" class="grid grid-cols-2 gap-5"></div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center">Lacak Pesanan 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
            <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">Tutup</button>
        </div>
    </div>

    <div id="trxDetailModal" class="detail-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <div class="text-center mb-6">
                <h3 class="text-lg font-black text-slate-800">Rincian Belanja 🛍️</h3>
                <p id="v-invoice" class="text-[10px] font-bold text-pink-400 uppercase tracking-widest"></p>
            </div>
            <div id="v-items" class="space-y-3 mb-6 max-h-60 overflow-y-auto no-scrollbar pr-2"></div>
            <div class="bg-pink-50 rounded-2xl p-4 mb-6">
                <div class="flex justify-between text-xs mb-1">
                    <span class="text-slate-400">Status:</span>
                    <span id="v-status" class="font-bold text-pink-500 italic uppercase"></span>
                </div>
                <div class="flex justify-between text-sm pt-2 border-t border-pink-100">
                    <span class="font-bold text-slate-700">Total Bayar:</span>
                    <span id="v-total" class="font-black text-pink-500"></span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="confirmToAdmin()" class="flex-1 py-4 bg-[#25D366] text-white rounded-2xl font-bold text-xs shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
                    <i class="fab fa-whatsapp"></i> KONFIRMASI WA
                </button>
                <button onclick="closeTrxDetail()" class="px-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl text-xs">TUTUP</button>
            </div>
        </div>
    </div>

    <div id="profileModal" class="profile-modal">
        <div class="text-center mb-6">
            <i class="fa-solid fa-circle-user text-5xl text-pink-200"></i>
            <h2 class="text-xl font-black mt-2 text-slate-800">Akun Saya</h2>
        </div>

        <div class="bg-gradient-to-br from-pink-50 to-white p-6 rounded-[30px] text-center mb-6 border border-pink-100 shadow-sm">
            <p class="text-[10px] font-black text-pink-400 uppercase tracking-[2px] mb-1">Saldo Beauty Bloom</p>
            <h3 id="p-saldo" class="text-2xl font-black text-slate-800 mb-4">Rp 0</h3>
            <button onclick="requestTopUp()" class="bg-white border-2 border-pink-200 text-pink-500 px-6 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest hover:bg-pink-500 hover:text-white transition-all">
                <i class="fa-solid fa-plus-circle mr-1"></i> Isi Saldo
            </button>
        </div>

        <div class="space-y-3">
            <input type="text" id="p-name" class="input-bloom" placeholder="Nama Lengkap">
            <input type="text" id="p-email" class="input-bloom opacity-50" readonly>
            <input type="number" id="p-phone" class="input-bloom" placeholder="628xxx">
            <textarea id="p-address" class="input-bloom h-20 resize-none" placeholder="Alamat Pengiriman"></textarea>
        </div>
        <button onclick="saveProfile()" id="btnSaveProfile" class="w-full py-4 bg-[#f72585] text-white rounded-2xl font-bold mt-6 shadow-lg">SIMPAN PERUBAHAN</button>
        <button onclick="logoutCustomer()" class="w-full mt-6 text-[10px] text-slate-300 font-bold uppercase tracking-widest text-center">Logout Akun</button>
    </div>

    <nav class="bottom-nav">
        <a href="online-shop.html" class="flex flex-col items-center text-[#ff85a2]">
            <i class="fas fa-home text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Beranda</span>
        </a>
        <button onclick="openActivity()" class="flex flex-col items-center text-slate-300">
            <i class="fas fa-receipt text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Pesanan</span>
        </button>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-300 relative">
            <i class="fas fa-shopping-bag text-2xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-3 bg-[#f72585] text-white text-[10px] font-black px-2 py-0.5 rounded-full border-2 border-white shadow-sm">0</span>
            <span class="text-[9px] font-black mt-1 uppercase">Keranjang</span>
        </button>
    </nav>

<script>
    let shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];
    let activeTrx = null;

    window.onload = async () => {
        const { data: { session } } = await db.auth.getSession();
        if (!session) {
            window.location.replace('login-customer.html');
        } else {
            updateCartDisplay();
            loadCustomerData(session.user.id);
            loadOnlineMenu();
        }
    };

    async function loadCustomerData(userId) {
        const { data: profile } = await db.from('customers').select('*').eq('id', userId).single();
        if (profile) {
            const firstName = profile.full_name.split(' ')[0];
            document.getElementById('welcome-msg').innerText = `Halo, ${firstName}! ✨`;
            if(document.getElementById('p-saldo')) {
                document.getElementById('p-saldo').innerText = "Rp " + (profile.saldo || 0).toLocaleString();
            }
        }
    }

    // TOP UP OTOMATIS (MINTA TOKEN KE EDGE FUNCTION)
    async function requestTopUp() {
        const nominal = prompt("Masukkan jumlah Top Up (Min. Rp 10.000):", "50000");
        if (!nominal || isNaN(nominal) || nominal < 10000) return alert("Minimal Rp 10.000 ya!");

        const { data: { user } } = await db.auth.getUser();
        const { data: profile } = await db.from('customers').select('*').eq('id', user.id).single();
        const invoice = "TOPUP-" + Date.now();

        // Catat ke riwayat
        const { error } = await db.from('topup_history').insert([{
            no_invoice: invoice, customer_id: user.id, nominal: parseInt(nominal), status: 'PENDING'
        }]);
        if (error) return alert("Gagal membuat request.");

        try {
            // PANGGIL EDGE FUNCTION TOPUP
            const response = await fetch("https://YOUR_PROJECT_ID.supabase.co/functions/v1/midtrans-topup", {
                method: 'POST',
                body: JSON.stringify({
                    order_id: invoice,
                    amount: parseInt(nominal),
                    customer_name: profile.full_name,
                    customer_email: user.email
                })
            });
            const snapData = await response.json();
            
            if (snapData.token) {
                window.snap.pay(snapData.token, {
                    onSuccess: () => { alert("Top Up Berhasil! 🌸"); location.reload(); },
                    onPending: () => { alert("Selesaikan pembayaranmu ya!"); },
                    onError: () => { alert("Top Up Gagal. ❌"); }
                });
            }
        } catch (err) { alert("Sistem sibuk, coba lagi nanti."); }
    }

    async function loadOnlineMenu() {
        const q = document.getElementById('search').value;
        let query = db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true);
        if (q) query = query.ilike('nama_barang', `%${q}%`);
        const { data } = await query.order('nama_barang');
        const display = document.getElementById('onlineDisplay');
        if (!data || data.length === 0) {
            display.innerHTML = `<div class="col-span-2 py-20 text-center text-slate-400 italic">Produk belum tersedia 🌸</div>`;
            return;
        }
        display.innerHTML = data.map(p => {
            const finalPrice = getActivePrice(p);
            return `
            <div class="product-card">
                <div class="img-container" onclick="openDetail('${p.id}', '${p.nama_barang}', ${finalPrice}, ${p.harga_jual}, '${p.image_url}', '${p.keterangan || ''}')">
                    <img src="${p.image_url || 'https://placehold.co/300'}" onerror="this.src='https://placehold.co/300?text=Beauty+Bloom'">
                </div>
                <div class="p-4 bg-white text-center">
                    <h4 class="font-bold text-slate-700 text-[11px] truncate uppercase">${p.nama_barang}</h4>
                    <p class="font-black text-[#ff85a2] text-sm mt-2">Rp ${finalPrice.toLocaleString()}</p>
                    <button onclick="addToOnlineCart('${p.id}', '${p.nama_barang}', ${finalPrice}, ${p.harga_jual})" class="mt-3 bg-pink-50 text-[#ff85a2] px-4 py-2 rounded-xl text-[10px] font-bold active:bg-pink-500 active:text-white transition-all w-full">TAMBAH ✨</button>
                </div>
            </div>`}).join('');
    }

    function getActivePrice(p) {
        let basePrice = (p.harga_online > 0) ? p.harga_online : p.harga_jual;
        if (!p.is_diskon) return basePrice;
        const skrg = new Date().getTime();
        const tglM = p.diskon_mulai ? new Date(p.diskon_mulai).getTime() : null;
        const tglA = p.diskon_akhir ? new Date(p.diskon_akhir).getTime() : null;
        if (p.is_diskon && (!tglM || skrg >= tglM) && (!tglA || skrg <= tglA)) return basePrice - (p.nominal_diskon || 0);
        return basePrice;
    }

    function addToOnlineCart(id, nama, hargaFinal, hargaNormal) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga: hargaFinal, harga_normal: hargaNormal, qty: 1 });
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const count = shopCart.reduce((total, item) => total + item.qty, 0);
        document.getElementById('cart-count').innerText = count;
        localStorage.setItem('finexcart', JSON.stringify(shopCart));
        sessionStorage.setItem('finexcart', JSON.stringify(shopCart));
    }

    async function openActivity() {
        const { data: { user } } = await db.auth.getUser();
        // Auto-cancel 24 jam
        const b = new Date(); b.setHours(b.getHours() - 24);
        await db.from('transaksi_online').update({ status_order: 'Dibatalkan' }).eq('customer_id', user.id).eq('status_order', 'Pending').lt('created_at', b.toISOString());

        const { data } = await db.from('transaksi_online').select('*').eq('customer_id', user.id).order('created_at', { ascending: false });
        const container = document.getElementById('activityList');

        if (data && data.length > 0) {
            container.innerHTML = data.map(trx => {
                const s = (trx.status_order || 'pending').toLowerCase();
                const str = JSON.stringify(trx).replace(/'/g, "&apos;");
                const canCancel = (s === 'pending') ? `<button onclick="cancelOrder('${trx.id}', '${trx.no_invoice}')" class="text-[9px] font-bold text-red-400 border border-red-100 px-3 py-2 rounded-xl">Batal</button>` : '';
                return `
                <div class="bg-white border border-pink-50 p-5 rounded-[25px] mb-4 text-xs shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                        <div><p class="font-black text-pink-300 uppercase">${trx.no_invoice}</p><p class="text-[10px] text-slate-400">${new Date(trx.created_at).toLocaleString()}</p></div>
                        <span class="status-badge status-${s}">${trx.status_order}</span>
                    </div>
                    <div class="flex justify-between items-end border-t border-dashed border-pink-100 pt-3 mt-1">
                        <p class="font-black text-slate-800">Rp ${parseFloat(trx.grand_total).toLocaleString()}</p>
                        <div class="flex gap-2">${canCancel}<button onclick='viewDetailTrx(${str})' class="bg-slate-900 text-white text-[9px] font-black px-4 py-2 rounded-xl uppercase">Detail</button></div>
                    </div>
                </div>`;
            }).join('');
        } else { container.innerHTML = `<p class="text-center text-slate-300 py-10 italic">Belum ada pesanan 🌸</p>`; }
        document.getElementById('activityModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function cancelOrder(id, inv) {
        if (confirm(`Batal pesanan ${inv}?`)) {
            await db.from('transaksi_online').update({ status_order: 'Dibatalkan' }).eq('id', id);
            openActivity();
        }
    }

    function viewDetailTrx(trx) {
        activeTrx = trx;
        document.getElementById('v-invoice').innerText = trx.no_invoice;
        document.getElementById('v-status').innerText = trx.status_order;
        document.getElementById('v-total').innerText = "Rp " + parseFloat(trx.grand_total).toLocaleString();
        const items = JSON.parse(trx.items || "[]");
        document.getElementById('v-items').innerHTML = items.map(it => `
            <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                <div class="flex-1 text-[11px] font-bold text-slate-700">${it.nama || it.name} (${it.qty || it.quantity}x)</div>
                <p class="font-bold text-slate-800 text-[11px]">Rp ${((it.qty||it.quantity)*(it.harga||it.price)).toLocaleString()}</p>
            </div>`).join('');
        document.getElementById('trxDetailModal').classList.add('active');
    }

    function confirmToAdmin() {
        if(!activeTrx) return;
        const text = `Halo Admin! 🌸%0AKonfirmasi pesanan: *${activeTrx.no_invoice}*%0AStatus: *${activeTrx.status_order}*%0ATotal: *Rp ${parseFloat(activeTrx.grand_total).toLocaleString()}*`;
        window.open(`https://wa.me/6281234567890?text=${text}`, '_blank');
    }

    async function openProfile() {
        const { data: { user } } = await db.auth.getUser();
        const { data } = await db.from('customers').select('*').eq('id', user.id).single();
        if(data) {
            document.getElementById('p-name').value = data.full_name;
            document.getElementById('p-email').value = user.email;
            document.getElementById('p-phone').value = data.phone_number;
            document.getElementById('p-address').value = data.address_shipping;
            document.getElementById('p-saldo').innerText = "Rp " + (data.saldo || 0).toLocaleString();
        }
        document.getElementById('profileModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function saveProfile() {
        const { data: { user } } = await db.auth.getUser();
        await db.from('customers').upsert({
            id: user.id, full_name: document.getElementById('p-name').value, phone_number: document.getElementById('p-phone').value,
            address_shipping: document.getElementById('p-address').value, email: user.email, updated_at: new Date()
        });
        alert("Profil Diperbarui! ✨"); closeAllModals(); loadCustomerData(user.id);
    }

    function closeAllModals() { document.querySelectorAll('.detail-modal, .activity-modal, .profile-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }
    function closeTrxDetail() { document.getElementById('trxDetailModal').classList.remove('active'); }
    function goToCheckout() {
        if (shopCart.length === 0) return alert("Pilih produk dulu! 🌸");
        sessionStorage.setItem('finexcart', JSON.stringify(shopCart));
        window.location.href = "online-checkout.html";
    }
    async function logoutCustomer() { if(confirm("Keluar?")) { await db.auth.signOut(); window.location.replace('login-customer.html'); } }
</script>
</body>
</html>
