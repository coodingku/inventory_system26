<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty Bloom | Online Shop 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-XXXXX"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; --accent-peach: #ffb3c1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); margin: 0; }
        .glass-header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 133, 162, 0.2); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255, 133, 162, 0.1); box-shadow: 0 4px 15px rgba(255, 133, 162, 0.05); cursor: pointer; position: relative; }
        .product-card:active { transform: scale(0.96); }
        .img-container { aspect-ratio: 1 / 1; overflow: hidden; background: #fffafa; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; border-radius: 40px 0 0 40px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .side-modal.active { right: 0; }
        .detail-modal, .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 -15px 35px rgba(0,0,0,0.1); }
        .detail-modal.active, .activity-modal.active { bottom: 0; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-pending { background: #fee2e2; color: #ef4444; }
        .status-success { background: #dcfce7; color: #16a34a; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px 0; box-shadow: 0 -10px 25px rgba(255, 133, 162, 0.1); border-radius: 30px 30px 0 0; z-index: 100; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .badge-diskon { position: absolute; top: 12px; left: 12px; background: var(--deep-pink); color: white; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; z-index: 10; }
    </style>
</head>
<body class="pb-28 no-scrollbar">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p id="welcome-msg" class="text-[10px] font-bold text-[#ff4d6d] uppercase tracking-widest italic">Halo, Cantik! ✨</p>
            <h1 class="text-xl font-extrabold text-slate-800">Beauty Bloom 🌸</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleWallet()" class="w-10 h-10 bg-white rounded-full border border-pink-100 text-pink-500 flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-wallet"></i>
            </button>
            <button onclick="openProfile()" class="w-10 h-10 bg-pink-50 rounded-full border border-pink-100 text-pink-500 flex items-center justify-center shadow-sm">
                <i class="fa-solid fa-user text-sm"></i>
            </button>
        </div>
    </header>

    <section class="px-6 mt-6">
        <div class="relative">
            <i class="fas fa-search absolute left-5 top-4 text-pink-300"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" class="w-full pl-12 pr-4 py-4 bg-white rounded-3xl border-none shadow-sm outline-none focus:ring-2 focus:ring-pink-300" placeholder="Cari perawatan cantikmu...">
        </div>
    </section>

    <main class="px-6 mt-8">
        <div id="onlineDisplay" class="grid grid-cols-2 gap-5"></div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="walletModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Dompet Cantik ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="bg-gradient-to-br from-[#ff85a2] to-[#f72585] p-8 rounded-[35px] text-white shadow-xl mb-8">
            <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Saldo Kamu</p>
            <h3 id="w-saldo" class="text-3xl font-black mt-2">Rp 0</h3>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-10">
            <button onclick="requestTopUp()" class="flex flex-col items-center justify-center p-5 bg-pink-50 rounded-3xl border border-pink-100">
                <i class="fa-solid fa-arrow-up text-pink-500 mb-2"></i>
                <span class="text-[10px] font-black uppercase">Isi Saldo</span>
            </button>
            <button onclick="requestWithdraw()" class="flex flex-col items-center justify-center p-5 bg-slate-50 rounded-3xl border border-slate-100">
                <i class="fa-solid fa-money-bill-transfer text-slate-400 mb-2"></i>
                <span class="text-[10px] font-black uppercase">Tarik Dana</span>
            </button>
        </div>
        <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Riwayat Saldo</h4>
        <div id="walletHistory" class="space-y-3 overflow-y-auto max-h-[40vh] no-scrollbar"></div>
    </div>

    <div id="productDetailModal" class="detail-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10 text-center">
            <div class="aspect-square rounded-[30px] mb-6 overflow-hidden bg-pink-50 h-64 mx-auto border-4 border-white shadow-lg">
                <img id="detail-img" src="" class="w-full h-full object-cover">
            </div>
            <h2 id="detail-name" class="text-2xl font-black text-slate-800"></h2>
            <p id="detail-price" class="text-xl font-black text-[#f72585] mt-2"></p>
            <p id="detail-desc" class="text-slate-400 text-sm my-6 px-4 bg-pink-50/50 py-3 rounded-2xl italic"></p>
            <button id="btn-add-modal" class="w-full py-5 bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white rounded-[22px] font-black shadow-lg">TAMBAH KERANJANG ✨</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="online-shop.html" class="flex flex-col items-center text-[#ff85a2]">
            <i class="fas fa-home text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Beranda</span>
        </a>
        <button onclick="openActivity()" class="flex flex-col items-center text-slate-300">
            <i class="fas fa-receipt text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Pesanan</span>
        </button>
        <button onclick="toggleWallet()" class="flex flex-col items-center text-slate-300">
            <i class="fas fa-wallet text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Saldo</span>
        </button>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-300 relative">
            <i class="fas fa-shopping-bag text-2xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-3 bg-[#f72585] text-white text-[10px] font-black px-2 py-0.5 rounded-full border-2 border-white shadow-sm">0</span>
            <span class="text-[9px] font-black mt-1 uppercase">Bag</span>
        </button>
    </nav>

<script>
    let shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];
    let userData = null;

    window.onload = async () => {
        const { data: { session } } = await db.auth.getSession();
        if (!session) return window.location.replace('login-customer.html');
        loadCustomerData(session.user.id);
        loadOnlineMenu();
        updateCartDisplay();
    };

    async function loadCustomerData(userId) {
        const { data } = await db.from('customers').select('*').eq('id', userId).single();
        if (data) {
            userData = data;
            document.getElementById('welcome-msg').innerText = `Halo, ${data.full_name.split(' ')[0]}! ✨`;
            document.getElementById('w-saldo').innerText = "Rp " + (data.saldo || 0).toLocaleString();
            loadWalletHistory(userId);
        }
    }

    function getActivePrice(p) {
        let basePrice = (p.harga_online > 0) ? p.harga_online : p.harga_jual;
        if (!p.is_diskon) return { price: basePrice, isDiscount: false, normal: basePrice };
        const skrg = new Date().getTime();
        const tglM = p.diskon_mulai ? new Date(p.diskon_mulai).getTime() : null;
        const tglA = p.diskon_akhir ? new Date(p.diskon_akhir).getTime() : null;
        const active = p.is_diskon && (!tglM || skrg >= tglM) && (!tglA || skrg <= tglA);
        return {
            price: active ? basePrice - (p.nominal_diskon || 0) : basePrice,
            isDiscount: active,
            normal: basePrice
        };
    }

    async function loadOnlineMenu() {
        const q = document.getElementById('search').value;
        let query = db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true);
        if (q) query = query.ilike('nama_barang', `%${q}%`);
        const { data } = await query.order('nama_barang');
        const display = document.getElementById('onlineDisplay');
        
        if (!data || data.length === 0) {
            display.innerHTML = `<div class="col-span-2 py-20 text-center text-slate-400">Produk belum tersedia 🌸</div>`;
            return;
        }

        display.innerHTML = data.map(p => {
            const pricing = getActivePrice(p);
            const imgUrl = p.image_url || 'https://placehold.co/300?text=Beauty+Bloom';
            
            return `
            <div class="product-card" onclick="openDetail('${p.id}', '${p.nama_barang}', ${pricing.price}, ${pricing.normal}, '${imgUrl}', '${p.keterangan || ''}')">
                ${pricing.isDiscount ? `<div class="badge-diskon">PROMO ✨</div>` : ''}
                <div class="img-container">
                    <img src="${imgUrl}" onerror="this.src='https://placehold.co/300'">
                </div>
                <div class="p-4 bg-white">
                    <h4 class="font-bold text-slate-700 text-[11px] truncate uppercase">${p.nama_barang}</h4>
                    <div class="mt-2">
                        ${pricing.isDiscount ? `<p class="text-[9px] text-slate-300 line-through">Rp ${pricing.normal.toLocaleString()}</p>` : ''}
                        <p class="font-black text-[#ff85a2] text-sm">Rp ${pricing.price.toLocaleString()}</p>
                    </div>
                    <button onclick="event.stopPropagation(); addToOnlineCart('${p.id}', '${p.nama_barang}', ${pricing.price}, ${pricing.normal})" class="w-full mt-3 bg-pink-50 text-pink-500 py-2 rounded-xl text-[10px] font-black active:bg-pink-500 active:text-white transition-all">
                        TAMBAH ✨
                    </button>
                </div>
            </div>`;
        }).join('');
    }

    function openDetail(id, nama, harga, hargaNormal, img, desc) {
        document.getElementById('detail-name').innerText = nama;
        document.getElementById('detail-price').innerText = "Rp " + harga.toLocaleString();
        document.getElementById('detail-img').src = img;
        document.getElementById('detail-desc').innerText = desc || 'Rahasia kecantikan yang menunggumu.';
        document.getElementById('btn-add-modal').onclick = () => { addToOnlineCart(id, nama, harga, hargaNormal); closeAllModals(); };
        document.getElementById('productDetailModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    function addToOnlineCart(id, nama, hargaFinal, hargaNormal) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga: hargaFinal, harga_normal: hargaNormal, qty: 1 });
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const count = shopCart.reduce((total, item) => total + item.qty, 0);
        document.getElementById('cart-count').innerText = count;
        localStorage.setItem('finexcart', JSON.stringify(shopCart));
    }

    function toggleWallet() {
        document.getElementById('walletModal').classList.toggle('active');
        document.getElementById('modalOverlay').classList.toggle('active');
    }

    async function requestTopUp() {
        const nominal = prompt("Nominal Top Up (Min Rp 10.000):", "50000");
        if (!nominal || isNaN(nominal) || nominal < 10000) return alert("Minimal Rp 10.000 ya!");

        const invoice = "TOPUP-" + Date.now();
        await db.from('topup_history').insert([{ no_invoice: invoice, customer_id: userData.id, nominal: parseInt(nominal), status: 'PENDING' }]);

        try {
            const res = await fetch("https://uojhjskgughhwxtdsfvm.supabase.co/functions/v1/smart-endpoint", {
                method: 'POST',
                body: JSON.stringify({ order_id: invoice, amount: parseInt(nominal), customer_name: userData.full_name, customer_email: userData.email })
            });
            const snapData = await res.json();
            if (snapData.token) {
                window.snap.pay(snapData.token, { onSuccess: () => { location.reload(); } });
            }
        } catch (e) { alert("Sistem sibuk."); }
    }

    function requestWithdraw() {
        const amount = prompt(`Berapa saldo ditarik? (Max: Rp ${userData.saldo.toLocaleString()})`, userData.saldo);
        if (!amount || amount > userData.saldo) return alert("Saldo tidak cukup.");
        const text = `Halo Admin! 🌸%0ASaya ingin *TARIK SALDO*%0ANama: *${userData.full_name}*%0ANominal: *Rp ${parseInt(amount).toLocaleString()}*`;
        window.open(`https://wa.me/6281234567890?text=${text}`, '_blank');
    }

    async function loadWalletHistory(userId) {
        const { data } = await db.from('topup_history').select('*').eq('customer_id', userId).order('created_at', {ascending: false}).limit(5);
        const container = document.getElementById('walletHistory');
        if (data && data.length > 0) {
            container.innerHTML = data.map(h => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl text-[10px] mb-2">
                    <div><p class="font-bold text-slate-800">${h.no_invoice}</p><p class="text-slate-400">${new Date(h.created_at).toLocaleDateString()}</p></div>
                    <div class="text-right">
                        <p class="font-black ${h.status === 'SUCCESS' ? 'text-green-500' : 'text-orange-400'}">Rp ${h.nominal.toLocaleString()}</p>
                        <p class="uppercase font-bold opacity-30">${h.status}</p>
                    </div>
                </div>`).join('');
        }
    }

    function closeAllModals() { document.querySelectorAll('.side-modal, .activity-modal, .profile-modal, .modal-overlay, .detail-modal').forEach(el => el.classList.remove('active')); }
    function goToCheckout() { if (shopCart.length > 0) window.location.href = "online-checkout.html"; else alert("Pilih produk dulu! 🌸"); }
</script>
</body>
</html>
