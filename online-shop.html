<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty Bloom | Online Shop 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-XXXXX"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; --accent-peach: #ffb3c1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); margin: 0; overflow-x: hidden; }
        .glass-header { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 133, 162, 0.2); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s ease; border: 1px solid rgba(255, 133, 162, 0.1); box-shadow: 0 4px 15px rgba(255, 133, 162, 0.05); cursor: pointer; position: relative; }
        .product-card:active { transform: scale(0.96); }
        .img-container { aspect-ratio: 1 / 1; overflow: hidden; background: #fffafa; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; border-radius: 40px 0 0 40px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .side-modal.active { right: 0; }
        .detail-modal, .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 -15px 35px rgba(0,0,0,0.1); }
        .detail-modal.active, .activity-modal.active { bottom: 0; }
        .status-badge { padding: 4px 12px; border-radius: 12px; font-size: 10px; font-weight: 800; text-transform: uppercase; }
        .status-pending { background: #fee2e2; color: #ef4444; }
        .status-settlement { background: #dcfce7; color: #16a34a; }
        .status-dibatalkan { background: #f1f5f9; color: #64748b; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px 0; box-shadow: 0 -10px 25px rgba(255, 133, 162, 0.1); border-radius: 30px 30px 0 0; z-index: 100; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .badge-diskon { position: absolute; top: 12px; left: 12px; background: var(--deep-pink); color: white; padding: 4px 10px; border-radius: 10px; font-size: 9px; font-weight: 900; z-index: 10; }
    </style>
</head>
<body class="pb-28 no-scrollbar">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p id="welcome-msg" class="text-[10px] font-bold text-[#ff4d6d] uppercase tracking-widest italic">Halo, Cantik! ✨</p>
            <h1 class="text-xl font-extrabold text-slate-800">Beauty Bloom 🌸</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleWallet()" class="w-10 h-10 bg-white rounded-full border border-pink-100 text-pink-500 flex items-center justify-center shadow-sm"><i class="fa-solid fa-wallet"></i></button>
            <button onclick="openProfile()" class="w-10 h-10 bg-pink-50 rounded-full border border-pink-100 text-pink-500 flex items-center justify-center shadow-sm"><i class="fa-solid fa-user text-sm"></i></button>
        </div>
    </header>

    <main class="px-6 mt-8">
        <div class="relative mb-6">
            <i class="fas fa-search absolute left-5 top-4 text-pink-300"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" class="w-full pl-12 pr-4 py-4 bg-white rounded-3xl border-none shadow-sm outline-none focus:ring-2 focus:ring-pink-300" placeholder="Cari perawatan cantikmu...">
        </div>
        <div id="onlineDisplay" class="grid grid-cols-2 gap-5"></div>
    </main>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="cartModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Bag Belanja 🛍️</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div id="cartList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pr-2"></div>
        <div class="mt-8 pt-6 border-t border-dashed border-pink-100">
            <div class="flex justify-between mb-6">
                <span class="font-bold text-slate-400">Total:</span>
                <span id="cart-total-modal" class="font-black text-pink-500 text-xl">Rp 0</span>
            </div>
            <button onclick="goToCheckout('PROSES')" class="w-full py-5 bg-slate-900 text-white rounded-[22px] font-black shadow-lg uppercase text-[10px] tracking-widest">Lanjut Checkout 🌸</button>
        </div>
    </div>

    <div id="profileModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Profil Saya ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-pink-100 rounded-full mx-auto mb-4 flex items-center justify-center border-4 border-white shadow-sm">
                <i class="fa-solid fa-user text-2xl text-pink-400"></i>
            </div>
            <h3 id="p-name" class="font-black text-slate-800 italic">Nama Pengguna</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">email@bloom.com</p>
        </div>
        <button onclick="logoutCustomer()" class="w-full py-4 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] tracking-widest uppercase">Keluar Akun</button>
    </div>

    <div id="walletModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Dompet Cantik ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="bg-gradient-to-br from-[#ff85a2] to-[#f72585] p-8 rounded-[35px] text-white shadow-xl mb-8">
            <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Saldo Kamu</p>
            <h3 id="w-saldo" class="text-3xl font-black mt-2">Rp 0</h3>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-10">
            <button onclick="requestTopUp()" class="flex flex-col items-center justify-center p-5 bg-pink-50 rounded-3xl border border-pink-100"><i class="fa-solid fa-arrow-up text-pink-500 mb-2"></i><span class="text-[10px] font-black uppercase">Isi Saldo</span></button>
            <button onclick="requestWithdraw()" class="flex flex-col items-center justify-center p-5 bg-slate-50 rounded-3xl border border-slate-100"><i class="fa-solid fa-money-bill-transfer text-slate-400 mb-2"></i><span class="text-[10px] font-black uppercase">Tarik Dana</span></button>
        </div>
        <h4 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Mutasi Saldo</h4>
        <div id="walletHistory" class="space-y-3 overflow-y-auto max-h-[40vh] no-scrollbar"></div>
    </div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center">Lacak Pesanan 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
            <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl">Tutup</button>
        </div>
    </div>

    <div id="trxDetailModal" class="detail-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <div class="text-center mb-6">
                <h3 class="text-lg font-black text-slate-800">Rincian Belanja 🛍️</h3>
                <p id="v-invoice" class="text-[10px] font-bold text-pink-400 uppercase tracking-widest"></p>
            </div>
            <div id="v-items" class="space-y-3 mb-6 max-h-60 overflow-y-auto no-scrollbar pr-2"></div>
            <div class="bg-pink-50 rounded-2xl p-4 mb-6 text-sm">
                <div class="flex justify-between mb-1 text-xs"><span class="text-slate-400">Status:</span><span id="v-status" class="font-bold text-pink-500 italic uppercase"></span></div>
                <div class="flex justify-between pt-2 border-t border-pink-100"><span class="font-bold text-slate-700">Total:</span><span id="v-total" class="font-black text-pink-500"></span></div>
            </div>
            <div class="flex gap-3">
                <button onclick="confirmToAdmin()" class="flex-1 py-4 bg-[#25D366] text-white rounded-2xl font-bold text-xs shadow-lg flex items-center justify-center gap-2"><i class="fab fa-whatsapp"></i> KONFIRMASI WA</button>
                <button onclick="closeAllModals()" class="px-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl text-xs">TUTUP</button>
            </div>
        </div>
    </div>

    <div id="productDetailModal" class="detail-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10 text-center">
            <div class="aspect-square rounded-[30px] mb-6 overflow-hidden bg-pink-50 h-64 mx-auto border-4 border-white shadow-lg"><img id="detail-img" src="" class="w-full h-full object-cover"></div>
            <h2 id="detail-name" class="text-2xl font-black text-slate-800"></h2>
            <p id="detail-price" class="text-xl font-black text-[#f72585] mt-2"></p>
            <p id="detail-desc" class="text-slate-400 text-sm my-6 px-4 bg-pink-50/50 py-3 rounded-2xl italic"></p>
            <button id="btn-add-modal" class="w-full py-5 bg-gradient-to-r from-[#ff85a2] to-[#f72585] text-white rounded-[22px] font-black shadow-lg">TAMBAH KERANJANG ✨</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="online-shop.html" class="flex flex-col items-center text-[#ff85a2]"><i class="fas fa-home text-2xl"></i><span class="text-[9px] font-black mt-1 uppercase">Beranda</span></a>
        <button onclick="openActivity()" class="flex flex-col items-center text-slate-300"><i class="fas fa-receipt text-2xl"></i><span class="text-[9px] font-black mt-1 uppercase">Pesanan</span></button>
        <button onclick="toggleWallet()" class="flex flex-col items-center text-slate-300"><i class="fas fa-wallet text-2xl"></i><span class="text-[9px] font-black mt-1 uppercase">Saldo</span></button>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-300 relative"><i class="fas fa-shopping-bag text-2xl"></i><span id="cart-count" class="absolute -top-2 -right-3 bg-[#f72585] text-white text-[10px] font-black px-2 py-0.5 rounded-full border-2 border-white shadow-sm">0</span><span class="text-[9px] font-black mt-1 uppercase">Bag</span></button>
    </nav>

<script>
    let shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];
    let userData = null;
    let activeTrx = null;

    window.onload = async () => {
        const { data: { session } } = await db.auth.getSession();
        if (!session) return window.location.replace('login-customer.html');
        loadCustomerData(session.user.id);
        loadOnlineMenu();
        updateCartDisplay();
    };

    async function loadCustomerData(userId) {
        const { data } = await db.from('customers').select('*').eq('id', userId).single();
        if (data) {
            userData = data;
            document.getElementById('welcome-msg').innerText = `Halo, ${data.full_name.split(' ')[0]}! ✨`;
            document.getElementById('w-saldo').innerText = "Rp " + (data.saldo || 0).toLocaleString();
            loadWalletHistory(userId);
        }
    }

    // LOGIKA PRODUK & HARGA
    function getActivePrice(p) {
        let basePrice = (p.harga_online > 0) ? p.harga_online : p.harga_jual;
        if (!p.is_diskon) return { price: basePrice, isDiscount: false, normal: basePrice };
        const skrg = new Date().getTime();
        const tglM = p.diskon_mulai ? new Date(p.diskon_mulai).getTime() : null;
        const tglA = p.diskon_akhir ? new Date(p.diskon_akhir).getTime() : null;
        const active = p.is_diskon && (!tglM || skrg >= tglM) && (!tglA || skrg <= tglA);
        return { price: active ? basePrice - (p.nominal_diskon || 0) : basePrice, isDiscount: active, normal: basePrice };
    }

    async function loadOnlineMenu() {
        const q = document.getElementById('search').value;
        let query = db.from('produk').select('*').gt('stok_sekarang', 0).eq('tampil_online', true);
        if (q) query = query.ilike('nama_barang', `%${q}%`);
        const { data } = await query.order('nama_barang');
        const display = document.getElementById('onlineDisplay');
        if (!data) return;
        display.innerHTML = data.map(p => {
            const pr = getActivePrice(p);
            return `
            <div class="product-card" onclick="openDetail('${p.id}', '${p.nama_barang}', ${pr.price}, ${pr.normal}, '${p.image_url}', '${p.keterangan || ''}')">
                ${pr.isDiscount ? `<div class="badge-diskon">PROMO ✨</div>` : ''}
                <div class="img-container"><img src="${p.image_url || 'https://placehold.co/300'}" onerror="this.src='https://placehold.co/300'"></div>
                <div class="p-4">
                    <h4 class="font-bold text-slate-700 text-[11px] truncate uppercase">${p.nama_barang}</h4>
                    <div class="mt-1">
                        <p class="text-[9px] text-slate-400 ${pr.isDiscount ? 'line-through' : ''}">Rp ${pr.normal.toLocaleString()}</p>
                        <p class="font-black text-[#ff85a2] text-sm">Rp ${pr.price.toLocaleString()}</p>
                    </div>
                    <button onclick="event.stopPropagation(); addToOnlineCart('${p.id}', '${p.nama_barang}', ${pr.price}, ${pr.normal})" class="w-full mt-3 bg-pink-50 text-pink-500 py-2 rounded-xl text-[10px] font-black active:scale-95 transition-all">TAMBAH ✨</button>
                </div>
            </div>`;
        }).join('');
    }

    // LOGIKA KERANJANG (BAG)
    function openDetail(id, nama, harga, hargaNormal, img, desc) {
        document.getElementById('detail-name').innerText = nama;
        document.getElementById('detail-price').innerText = "Rp " + harga.toLocaleString();
        document.getElementById('detail-img').src = img || 'https://placehold.co/300';
        document.getElementById('detail-desc').innerText = desc || 'Rahasia cantikmu.';
        document.getElementById('btn-add-modal').onclick = () => { addToOnlineCart(id, nama, harga, hargaNormal); closeAllModals(); };
        document.getElementById('productDetailModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    function addToOnlineCart(id, nama, hargaFinal, hargaNormal) {
        const idx = shopCart.findIndex(c => c.id === id);
        if (idx > -1) shopCart[idx].qty++;
        else shopCart.push({ id, nama, harga: hargaFinal, harga_normal: hargaNormal, qty: 1 });
        updateCartDisplay();
    }

    function updateCartDisplay() {
        const count = shopCart.reduce((total, item) => total + item.qty, 0);
        document.getElementById('cart-count').innerText = count;
        localStorage.setItem('finexcart', JSON.stringify(shopCart));
    }

    function renderCart() {
        const container = document.getElementById('cartList');
        let total = 0;
        if (shopCart.length === 0) {
            container.innerHTML = `<p class="text-center text-slate-300 py-10 italic">Bag kamu kosong 🌸</p>`;
            document.getElementById('cart-total-modal').innerText = "Rp 0";
            return;
        }
        container.innerHTML = shopCart.map((item, index) => {
            total += (item.harga * item.qty);
            return `
            <div class="flex items-center gap-4 bg-pink-50/30 p-3 rounded-2xl border border-pink-50">
                <div class="flex-1"><h4 class="font-bold text-slate-800 text-[11px] truncate uppercase">${item.nama}</h4><p class="text-pink-500 font-black text-[10px]">Rp ${item.harga.toLocaleString()}</p></div>
                <div class="flex items-center gap-3 bg-white px-3 py-1 rounded-xl shadow-sm">
                    <button onclick="updateQty(${index}, -1)" class="text-pink-400 font-bold">-</button>
                    <span class="text-xs font-black text-slate-700">${item.qty}</span>
                    <button onclick="updateQty(${index}, 1)" class="text-pink-400 font-bold">+</button>
                </div>
            </div>`;
        }).join('');
        document.getElementById('cart-total-modal').innerText = "Rp " + total.toLocaleString();
    }

    function updateQty(index, change) {
        shopCart[index].qty += change;
        if (shopCart[index].qty <= 0) shopCart.splice(index, 1);
        updateCartDisplay();
        renderCart();
    }

    function goToCheckout(mode = 'VIEW') {
        if (shopCart.length > 0) {
            if (mode === 'PROSES') window.location.href = "online-checkout.html";
            else {
                renderCart();
                document.getElementById('cartModal').classList.add('active');
                document.getElementById('modalOverlay').classList.add('active');
            }
        } else alert("Kosong!");
    }

    // LOGIKA PROFIL
    function openProfile() {
        if (!userData) return;
        document.getElementById('p-name').innerText = userData.full_name;
        document.getElementById('p-email').innerText = userData.email;
        document.getElementById('profileModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

    async function logoutCustomer() {
        if (confirm("Keluar akun?")) {
            await db.auth.signOut();
            localStorage.removeItem('finexcart');
            window.location.replace('login-customer.html');
        }
    }

    // LOGIKA SALDO & WALLET
    function toggleWallet() { document.getElementById('walletModal').classList.toggle('active'); document.getElementById('modalOverlay').classList.toggle('active'); }
    
    async function requestTopUp() {
        const nom = prompt("Nominal Top Up (Min Rp 10.000):", "50000");
        if (!nom || nom < 10000) return alert("Min Rp 10.000");
        const inv = "TOPUP-" + Date.now();
        await db.from('topup_history').insert([{ no_invoice: inv, customer_id: userData.id, nominal: parseInt(nom), status: 'PENDING' }]);
        try {
            const res = await fetch("https://uojhjskgugghwxtdsfvm.supabase.co/functions/v1/smart-endpoint", {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ order_id: inv, amount: parseInt(nom), customer_name: userData.full_name, customer_email: userData.email })
            });
            const d = await res.json();
            if (d.token) window.snap.pay(d.token, { onSuccess: () => location.reload() });
        } catch (e) { alert("Sibuk."); }
    }

    async function requestWithdraw() {
        if (userData.saldo < 10000) return alert("Saldo min Rp 10.000 🌸");
        const amount = prompt(`Berapa saldo ditarik? (Max: Rp ${userData.saldo.toLocaleString()})`, userData.saldo);
        if (!amount || isNaN(amount) || amount > userData.saldo || amount < 10000) return alert("Nominal salah.");
        const bank = prompt("Nama Bank:");
        const noRek = prompt("No Rekening:");
        const an = prompt("Nama Pemilik:");
        if (!bank || !noRek || !an) return alert("Data tidak lengkap.");
        const inv = "WD-" + Date.now();
        const { error } = await db.from('withdraw_requests').insert([{ no_invoice: inv, customer_id: userData.id, nominal: parseInt(amount), bank_name: bank, account_number: noRek, account_name: an, status: 'PENDING' }]);
        if (!error) {
            window.open(`https://wa.me/6281239739396?text=Tarik Saldo Rp ${amount} (Ref: ${inv})`, '_blank');
            location.reload();
        }
    }

    async function loadWalletHistory(userId) {
        const { data: t } = await db.from('topup_history').select('*').eq('customer_id', userId);
        const { data: w } = await db.from('withdraw_requests').select('*').eq('customer_id', userId);
        let combined = [];
        if (t) combined.push(...t.map(i => ({ ...i, jenis: 'ISI SALDO' })));
        if (w) combined.push(...w.map(i => ({ ...i, jenis: 'PENARIKAN' })));
        combined.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        const container = document.getElementById('walletHistory');
        if (combined.length > 0) {
            container.innerHTML = combined.slice(0, 10).map(h => {
                let color = h.status === 'SUCCESS' ? 'text-green-500' : (h.status === 'PENDING' ? 'text-orange-400' : 'text-red-500');
                let simbol = h.jenis === 'ISI SALDO' ? '+' : '-';
                return `
                <div class="bg-white border border-slate-50 p-4 rounded-2xl text-[10px] mb-2">
                    <div class="flex justify-between items-start">
                        <div><p class="font-black text-slate-800 uppercase">${h.no_invoice}</p><p class="text-slate-400">${new Date(h.created_at).toLocaleDateString()} • ${h.jenis}</p></div>
                        <div class="text-right"><p class="font-black">${simbol} Rp ${h.nominal.toLocaleString()}</p><p class="font-bold uppercase ${color}" style="font-size: 8px;">${h.status}</p></div>
                    </div>
                </div>`;
            }).join('');
        } else container.innerHTML = `<p class="text-center text-slate-300 py-5 italic text-[10px]">Kosong 🌸</p>`;
    }

    // LOGIKA PESANAN (ACTIVITY)
    async function openActivity() {
        const { data } = await db.from('transaksi_online').select('*').eq('customer_id', userData.id).order('created_at', { ascending: false });
        const container = document.getElementById('activityList');
        if (data && data.length > 0) {
            container.innerHTML = data.map(trx => {
                const s = (trx.status_order || 'pending').toLowerCase();
                const str = JSON.stringify(trx).replace(/'/g, "&apos;");
                const btnB = s === 'pending' ? `<button onclick="cancelOrder('${trx.id}', '${trx.no_invoice}')" class="text-[9px] font-bold text-red-400 border border-red-100 px-3 py-2 rounded-xl">Batal</button>` : '';
                return `
                <div class="bg-white border border-pink-50 p-5 rounded-[25px] shadow-sm mb-4 text-xs">
                    <div class="flex justify-between items-start mb-2">
                        <div><p class="font-black text-pink-300 uppercase">${trx.no_invoice}</p><p class="text-slate-400 text-[10px]">${new Date(trx.created_at).toLocaleDateString()}</p></div>
                        <span class="status-badge status-${s}">${trx.status_order}</span>
                    </div>
                    <div class="flex justify-between items-end border-t border-dashed border-pink-100 pt-3">
                        <p class="font-black text-slate-800">Rp ${parseFloat(trx.grand_total).toLocaleString()}</p>
                        <div class="flex gap-2">${btnB}<button onclick='viewDetailTrx(${str})' class="bg-slate-900 text-white text-[9px] font-black px-4 py-2 rounded-xl uppercase tracking-widest">Detail</button></div>
                    </div>
                </div>`;
            }).join('');
        } else container.innerHTML = `<p class="text-center py-10 italic">Belum ada pesanan 🌸</p>`;
        document.getElementById('activityModal').classList.add('active');
        document.getElementById('modalOverlay').classList.add('active');
    }

   // 1. FUNGSI LIHAT DETAIL (DENGAN TOMBOL KONFIRMASI DINAMIS)
function viewDetailTrx(trx) {
    activeTrx = trx;
    document.getElementById('v-invoice').innerText = trx.no_invoice;
    document.getElementById('v-status').innerText = trx.status_order;
    document.getElementById('v-total').innerText = "Rp " + parseFloat(trx.grand_total).toLocaleString();
    
    const items = typeof trx.items === 'string' ? JSON.parse(trx.items) : trx.items;
    document.getElementById('v-items').innerHTML = items.map(it => `
        <div class="flex justify-between bg-slate-50 p-3 rounded-xl">
            <div class="flex-1 text-[11px] font-bold">${it.nama || it.name} (${it.qty}x)</div>
            <p class="font-bold text-slate-800 text-[11px]">Rp ${(it.qty * it.harga).toLocaleString()}</p>
        </div>`).join('');

    // --- LOGIKA TOMBOL KONFIRMASI WA ---
    const btnWA = document.querySelector('[onclick="confirmToAdmin()"]');
    
    // Jika status sudah SETTLEMENT (Sudah Bayar), ubah teks jadi "MINTA KEMAS"
    if (trx.status_order === 'SETTLEMENT') {
        btnWA.innerHTML = '<i class="fab fa-whatsapp"></i> KONFIRMASI KEMAS';
        btnWA.style.display = "flex";
    } 
    // Jika status Dibatalkan atau Selesai, sembunyikan tombol WA
    else if (trx.status_order === 'Dibatalkan' || trx.status_order === 'Selesai') {
        btnWA.style.display = "none";
    }
    // Jika masih Pending, teks standar
    else {
        btnWA.innerHTML = '<i class="fab fa-whatsapp"></i> KONFIRMASI BAYAR';
        btnWA.style.display = "flex";
    }

    document.getElementById('trxDetailModal').classList.add('active');
    document.getElementById('modalOverlay').classList.add('active');
}

// 2. FUNGSI KIRIM PESAN WA (KONFIRMASI ADMIN)
function confirmToAdmin() {
    if (!activeTrx) return;
    
    let pesanWA = "";
    if (activeTrx.status_order === 'SETTLEMENT') {
        // Pesan jika sudah bayar
        pesanWA = `Halo Admin Beauty Bloom! 🌸%0A%0ASaya sudah membayar pesanan *${activeTrx.no_invoice}*%0AStatus: *LUNAS (Settlement)*%0ATotal: *Rp ${parseFloat(activeTrx.grand_total).toLocaleString()}*%0A%0AMohon pesanan saya segera *DIKEMAS* ya kak, terima kasih! ✨`;
    } else {
        // Pesan jika masih pending
        pesanWA = `Halo Admin Beauty Bloom! 🌸%0A%0ASaya ingin konfirmasi pesanan *${activeTrx.no_invoice}*%0AStatus: *PENDING*%0ATotal: *Rp ${parseFloat(activeTrx.grand_total).toLocaleString()}*%0A%0ASaya akan segera melakukan pembayaran. ✨`;
    }

    window.open(`https://wa.me/6281239739396?text=${pesanWA}`, '_blank');
}

// 3. FUNGSI BATAL PESANAN (DENGAN ALASAN)
async function cancelOrder(id, inv) {
    const alasan = prompt("Mohon maaf Kak, apa alasan pembatalannya? (Misal: Salah alamat / Mau ganti produk)");
    
    if (alasan) {
        // Update di Database
        const { error } = await db.from('transaksi_online')
            .update({ status_order: 'Dibatalkan' })
            .eq('id', id);

        if (!error) {
            // Kirim WA Sopan ke Admin
            const pesanBatal = `Halo Admin Beauty Bloom! 🌸%0A%0AMohon maaf admin, pesanan saya dengan nomor *${inv}* sudah saya *BATALKAN*.%0A%0A*Alasan:* ${alasan}%0A%0AMohon maaf atas ketidaknyamanannya, terima kasih. 🙏`;
            
            window.open(`https://wa.me/6281239739396?text=${pesanBatal}`, '_blank');
            
            alert("Pesanan berhasil dibatalkan. Pesan pembatalan dikirim ke Admin 🌸");
            openActivity(); // Refresh list
        } else {
            alert("Gagal membatalkan pesanan.");
        }
    } else {
        alert("Pembatalan dibatalkan (alasan harus diisi).");
    }
}

    function closeAllModals() { document.querySelectorAll('.side-modal, .activity-modal, .detail-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }
</script>
