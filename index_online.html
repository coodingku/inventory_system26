<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; overflow-x: hidden; padding-bottom: 40px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s ease; padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; padding-bottom: 40px; }
        .activity-modal.active { bottom: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[9px] font-black text-pink-500 uppercase tracking-widest italic">Beauty Bloom Member ✨</p>
                <h1 id="welcome-msg" class="text-xl font-extrabold text-slate-800 italic uppercase">Memuat...</h1>
            </div>
            <button onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </button>
        </div>

        <div class="gradient-pink w-full p-6 rounded-[30px] text-white shadow-xl shadow-pink-200 relative overflow-hidden mb-6">
            <div class="relative z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-80 mb-1">Saldo Dompet ✨</p>
                        <h2 id="w-saldo" class="text-3xl font-black italic">Rp 0</h2>
                    </div>
                    <i class="fa-solid fa-wallet text-2xl opacity-40"></i>
                </div>
                <div class="flex gap-2 mt-5">
                    <button onclick="requestTopUp()" class="flex-1 bg-white text-pink-500 py-3 rounded-xl text-[9px] font-black uppercase shadow-md active:scale-95 transition-all">TOP UP</button>
                    <button onclick="requestWithdraw()" class="flex-1 bg-black/20 text-white py-3 rounded-xl text-[9px] font-black uppercase border border-white/20 active:scale-95 transition-all">TARIK</button>
                </div>
            </div>
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full"></div>
        </div>

        <section class="grid grid-cols-4 gap-4 mb-8">
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-lg mb-2"><i class="fa-solid fa-bag-shopping text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Belanja</span>
            </button>
            <button onclick="openActivity()" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-lg mb-2"><i class="fa-solid fa-truck-fast text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Lacak</span>
            </button>
            <button onclick="toggleWallet()" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-lg mb-2"><i class="fa-solid fa-history text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Mutasi</span>
            </button>
            <button onclick="window.open('https://wa.me/6281239739396')" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-green-400 shadow-lg mb-2"><i class="fa-brands fa-whatsapp text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Admin</span>
            </button>
        </section>
    </header>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center italic uppercase">Pesanan Aktif 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
            <button onclick="openHistory()" class="w-full mt-4 py-4 text-pink-500 font-black text-[10px] uppercase italic bg-pink-50 rounded-2xl">Lihat Riwayat Selesai</button>
        </div>
    </div>

    <div id="historyModal" class="activity-modal px-6">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <h2 class="text-xl font-black text-slate-800 mb-6 text-center italic uppercase font-black">Riwayat Selesai 🌸</h2>
        <div id="historyList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
    </div>

    <div id="profileModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic">Profil Member ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="text-center mb-10">
            <div class="w-20 h-20 bg-pink-100 rounded-3xl mx-auto mb-4 flex items-center justify-center text-pink-400 text-2xl border-4 border-white shadow-md"><i class="fa-solid fa-user-sparkles"></i></div>
            <h3 id="p-name" class="font-black text-slate-800 italic uppercase">User</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">email@user.com</p>
        </div>
        <button onclick="logoutCustomer()" class="w-full py-4 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] uppercase flex justify-center items-center gap-3"><i class="fa-solid fa-power-off"></i> Keluar Akun</button>
    </div>

    <div id="walletModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8 text-xl font-black text-slate-800 italic">
            <h2>Mutasi Saldo 💎</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div id="walletHistory" class="space-y-3"></div>
    </div>

    <script>
        let userData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            await loadCustomerData(session.user.id);
        });

        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
                document.getElementById('w-saldo').innerText = "Rp " + (customer.saldo || 0).toLocaleString();
                loadWalletHistory(userId);
            }
        }

        // --- CORE LOGIC: LACAK PESANAN & PEMBATALAN ---

        async function openActivity() {
            const { data, error } = await db.from('transaksi_online')
                .select('*')
                .eq('customer_id', userData.id)
                .not('status_order', 'in', '("Selesai","Dibatalkan")')
                .order('created_at', { ascending: false });

            const container = document.getElementById('activityList');
            container.innerHTML = (data && data.length > 0) ? renderOrderCards(data) : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-black uppercase">Belum ada pesanan aktif 🌸</p>`;
            
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function renderOrderCards(data) {
            return data.map(t => {
                const canCancel = t.status_order === 'Pending' || t.status_order === 'Menunggu Pembayaran';
                return `
                    <div class="p-5 bg-white rounded-[28px] border border-slate-100 shadow-sm mb-4">
                        <div class="flex justify-between mb-4">
                            <div>
                                <p class="text-[8px] font-black text-pink-400 bg-pink-50 px-2 py-1 rounded-full uppercase italic">${t.no_invoice}</p>
                                <h4 class="font-black text-slate-800 italic uppercase text-[12px] mt-2 flex items-center gap-2">
                                    ${t.status_order} ${canCancel ? '<span class="w-1.5 h-1.5 bg-amber-400 rounded-full animate-pulse"></span>' : ''}
                                </h4>
                            </div>
                            <div class="text-right font-black italic text-slate-800 text-[11px]">Rp ${t.grand_total.toLocaleString()}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='alert("Detail Pesanan:\\n\\n"+JSON.stringify("${t.no_invoice}"))' class="flex-[2] py-3.5 bg-slate-800 text-white text-[9px] font-black uppercase rounded-2xl active:scale-95 transition-all">Detail</button>
                            ${canCancel ? `<button onclick="cancelOrder('${t.id}', '${t.no_invoice}', ${t.grand_total}, '${t.metode_pembayaran}')" class="flex-1 py-3.5 bg-red-50 text-red-500 text-[9px] font-black uppercase rounded-2xl border border-red-100">Batal</button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function cancelOrder(orderId, noInvoice, amount, method) {
            if (!confirm(`Apakah Anda yakin ingin membatalkan pesanan ${noInvoice}?`)) return;

            try {
                // 1. Update Status ke Dibatalkan
                const { error: updateErr } = await db.from('transaksi_online').update({ status_order: 'Dibatalkan' }).eq('id', orderId);
                if (updateErr) throw updateErr;

                // 2. LOGIC REFUND OTOMATIS: Jika bayar pakai Saldo, kembalikan saldonya
                if (method === 'Saldo Dompet' || method === 'Wallet') {
                    const newSaldo = (userData.saldo || 0) + amount;
                    await db.from('customers').update({ saldo: newSaldo }).eq('id', userData.id);
                    
                    // Catat ke riwayat mutasi sebagai refund
                    await db.from('topup_history').insert([{
                        customer_id: userData.id,
                        nominal: amount,
                        no_invoice: 'REFUND-' + noInvoice,
                        metode: 'SISTEM'
                    }]);
                }

                alert(`Pesanan ${noInvoice} berhasil dibatalkan. ${method.includes('Saldo') ? 'Saldo telah dikembalikan!' : ''}`);
                await loadCustomerData(userData.id);
                openActivity();

            } catch (err) {
                console.error(err);
                alert("Gagal membatalkan pesanan.");
            }
        }

        // --- FUNGSI TAMBAHAN ---
        async function openHistory() {
            const { data } = await db.from('transaksi_online').select('*').eq('customer_id', userData.id).in('status_order', ['Selesai', 'Dibatalkan']).order('created_at', { ascending: false });
            const container = document.getElementById('historyList');
            container.innerHTML = (data && data.length > 0) ? renderOrderCards(data) : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-black uppercase italic">Riwayat Kosong 🌸</p>`;
            closeAllModals();
            setTimeout(() => { document.getElementById('historyModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }, 300);
        }

        function toggleWallet() { closeAllModals(); document.getElementById('walletModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }
        
        function openProfile() {
            document.getElementById('p-name').innerText = userData.full_name;
            document.getElementById('p-email').innerText = userData.email;
            document.getElementById('profileModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeAllModals() { document.querySelectorAll('.side-modal, .activity-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }

        async function logoutCustomer() { if (confirm("Keluar akun?")) { await db.auth.signOut(); window.location.replace('login-customer.html'); } }

        async function loadWalletHistory(userId) {
            const { data: t } = await db.from('topup_history').select('*').eq('customer_id', userId);
            const { data: w } = await db.from('withdraw_requests').select('*').eq('customer_id', userId);
            let combined = [...(t || []).map(i => ({...i, jenis: 'MASUK'})), ...(w || []).map(i => ({...i, jenis: 'KELUAR'}))];
            combined.sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
            document.getElementById('walletHistory').innerHTML = combined.map(h => `
                <div class="bg-slate-50 p-4 rounded-2xl flex justify-between items-center text-[10px] mb-2 font-black italic">
                    <div><p class="text-slate-800 uppercase">${h.no_invoice}</p><p class="text-slate-400 uppercase">${h.jenis}</p></div>
                    <div class="${h.jenis === 'MASUK' ? 'text-green-500' : 'text-red-500'}">Rp ${h.nominal.toLocaleString()}</div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
