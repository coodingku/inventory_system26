<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; overflow-x: hidden; padding-bottom: 40px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        
        /* SLIDER FIXED STYLE */
        .slider-container { position: relative; width: 100%; border-radius: 25px; overflow: hidden; background: white; shadow: 0 10px 25px -5px rgba(247, 37, 133, 0.2); }
        .slider-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; }
        .slide-item { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease-in-out; display: none; }
        .slide-item.active { opacity: 1; display: block; z-index: 10; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .dots-container { display: flex; justify-content: center; gap: 6px; margin-top: 12px; }
        .dot-ad { width: 6px; height: 6px; border-radius: 50%; background: #ffd1dc; transition: all 0.3s; }
        .dot-ad.active { background: #f72585; width: 18px; border-radius: 10px; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s ease; padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; padding-bottom: 40px; }
        .activity-modal.active { bottom: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[9px] font-black text-pink-500 uppercase tracking-widest italic leading-none mb-1">Beauty Bloom ✨</p>
                <h1 id="welcome-msg" class="text-xl font-extrabold text-slate-800 italic uppercase">Memuat...</h1>
            </div>
            <button onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </button>
        </div>

        <div class="gradient-pink w-full p-6 rounded-[30px] text-white shadow-xl shadow-pink-200 relative overflow-hidden mb-6">
            <div class="relative z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-80 mb-1">Saldo Anda ✨</p>
                        <h2 id="w-saldo" class="text-3xl font-black italic tracking-tight">Rp 0</h2>
                    </div>
                    <i class="fa-solid fa-wallet text-2xl opacity-30"></i>
                </div>
                <div class="flex gap-2 mt-5">
                    <button onclick="requestTopUp()" class="flex-1 bg-white text-pink-500 py-3 rounded-xl text-[9px] font-black uppercase shadow-md active:scale-95">TOP UP</button>
                    <button onclick="requestWithdraw()" class="flex-1 bg-black/20 text-white py-3 rounded-xl text-[9px] font-black uppercase border border-white/20 active:scale-95">TARIK</button>
                </div>
            </div>
            <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-white/10 rounded-full"></div>
        </div>

        <section class="grid grid-cols-4 gap-4 mb-8">
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-lg mb-2"><i class="fa-solid fa-bag-shopping text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Belanja</span>
            </button>
            <button onclick="openActivity()" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-lg mb-2"><i class="fa-solid fa-truck-fast text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Lacak</span>
            </button>
            <button onclick="toggleWallet()" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-lg mb-2"><i class="fa-solid fa-history text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Mutasi</span>
            </button>
            <button onclick="window.open('https://wa.me/6281239739396')" class="flex flex-col items-center active:scale-95 transition-transform">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-green-400 shadow-lg mb-2"><i class="fa-brands fa-whatsapp text-xl"></i></div>
                <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter">Admin</span>
            </button>
        </section>

        <div class="px-1">
            <div class="slider-container">
                <div id="promo-slider" class="slider-wrapper bg-pink-50 flex items-center justify-center">
                    <i class="fa-solid fa-image text-pink-200 text-3xl animate-pulse"></i>
                </div>
            </div>
            <div id="promo-dots" class="dots-container"></div>
        </div>
    </header>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>
    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center italic uppercase">Status Pesanan 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
        </div>
    </div>

    <script>
        let userData = null;
        let currentSlide = 0;
        let slideInterval;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            
            await Promise.all([
                loadCustomerData(session.user.id),
                loadDynamicAds()
            ]);
        });

        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
                document.getElementById('w-saldo').innerText = "Rp " + (customer.saldo || 0).toLocaleString();
            }
        }

        // --- FUNGSI IKLAN (DIPERBAIKI) ---
        async function loadDynamicAds() {
            const slider = document.getElementById('promo-slider');
            const dotsContainer = document.getElementById('promo-dots');
            
            try {
                const { data: setting } = await db.from('app_settings')
                    .select('value_text, is_active')
                    .eq('key_name', 'dashboard_banners')
                    .single();
                
                if (!setting || !setting.is_active || !setting.value_text) {
                    slider.innerHTML = `<div class="p-10 text-pink-200 italic text-[10px] font-bold">Beauty Bloom Promo</div>`;
                    return;
                }

                const adImages = JSON.parse(setting.value_text);
                if (adImages.length > 0) {
                    // Isi Gambar
                    slider.innerHTML = adImages.map((imgUrl, i) => `
                        <div class="slide-item ${i === 0 ? 'active' : ''}">
                            <img src="${imgUrl}" alt="Promo ${i}" onerror="this.src='https://placehold.co/600x400?text=Beauty+Bloom'">
                        </div>
                    `).join('');
                    
                    // Isi Dots
                    dotsContainer.innerHTML = adImages.map((_, i) => `
                        <div class="dot-ad ${i === 0 ? 'active' : ''}"></div>
                    `).join('');

                    if (adImages.length > 1) {
                        currentSlide = 0;
                        if(slideInterval) clearInterval(slideInterval);
                        startAutoSlide(adImages.length);
                    }
                }
            } catch (e) {
                console.error("Gagal load iklan:", e);
                slider.innerHTML = `<div class="p-10 text-pink-200 italic text-[10px] font-bold tracking-widest">🌸 BEAUTY BLOOM 🌸</div>`;
            }
        }

        function startAutoSlide(total) {
            slideInterval = setInterval(() => {
                const slides = document.querySelectorAll('.slide-item');
                const dots = document.querySelectorAll('.dot-ad');
                
                if (slides.length === 0) return;

                slides[currentSlide].classList.remove('active');
                dots[currentSlide].classList.remove('active');
                
                currentSlide = (currentSlide + 1) % total;
                
                slides[currentSlide].classList.add('active');
                dots[currentSlide].classList.add('active');
            }, 4000);
        }

        // --- FUNGSI LACAK & REFUND (SINKRON ONLINE SHOP) ---
        async function openActivity() {
            const { data } = await db.from('transaksi_online').select('*')
                .eq('customer_id', userData.id)
                .not('status_order', 'in', '("Selesai","Dibatalkan")')
                .order('created_at', { ascending: false });

            const container = document.getElementById('activityList');
            container.innerHTML = (data && data.length > 0) ? data.map(t => {
                const canCancel = t.status_order === 'Pending' || t.status_order === 'Menunggu Pembayaran';
                return `
                    <div class="p-5 bg-white rounded-[28px] border border-slate-50 shadow-sm mb-4">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <p class="text-[8px] font-black text-pink-500 bg-pink-50 px-2 py-1 rounded-full uppercase italic">${t.no_invoice}</p>
                                <h4 class="font-black text-slate-800 italic uppercase text-[12px] mt-2">${t.status_order}</h4>
                            </div>
                            <div class="text-right font-black italic text-slate-800 text-[11px]">Rp ${t.grand_total.toLocaleString()}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='alert("Detail Pesanan: ${t.no_invoice}")' class="flex-[2] py-3.5 bg-slate-800 text-white text-[9px] font-black uppercase rounded-2xl active:scale-95">Detail</button>
                            ${canCancel ? `<button onclick="cancelOrder('${t.id}', '${t.no_invoice}', ${t.grand_total}, '${t.metode_pembayaran}')" class="flex-1 py-3.5 bg-red-50 text-red-500 text-[9px] font-black uppercase rounded-2xl border border-red-100">Batal</button>` : ''}
                        </div>
                    </div>`;
            }).join('') : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-black uppercase">Belum ada pesanan aktif 🌸</p>`;
            
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        async function cancelOrder(orderId, noInvoice, amount, method) {
            if (!confirm(`Batalkan ${noInvoice}?`)) return;
            try {
                await db.from('transaksi_online').update({ status_order: 'Dibatalkan' }).eq('id', orderId);
                if (method.includes('Saldo') || method.includes('Wallet')) {
                    const newSaldo = (userData.saldo || 0) + amount;
                    await db.from('customers').update({ saldo: newSaldo }).eq('id', userData.id);
                    await db.from('topup_history').insert([{ customer_id: userData.id, nominal: amount, no_invoice: 'REFUND-'+noInvoice, metode: 'SISTEM' }]);
                }
                alert("Berhasil dibatalkan!");
                loadCustomerData(userData.id);
                openActivity();
            } catch (e) { alert("Gagal memproses pembatalan."); }
        }

        function closeAllModals() { document.querySelectorAll('.activity-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }
    </script>
</body>
</html>
