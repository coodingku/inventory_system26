<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex | Beauty Bloom Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; margin-bottom: 100px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        .menu-card:active { transform: scale(0.95); background: #fff0f3; }
        .banner-slide { width: 100%; height: 160px; border-radius: 25px; overflow: hidden; position: relative; }
    </style>
</head>
<body>

    <header class="p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p id="greeting" class="text-[10px] font-black text-pink-500 uppercase tracking-widest italic">Selamat Datang ✨</p>
                <h1 id="user-name" class="text-xl font-extrabold text-slate-800">Beauty Bloom</h1>
            </div>
            <div onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </div>
        </div>

        <div class="gradient-pink p-6 rounded-[32px] text-white shadow-xl shadow-pink-200 relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex items-center gap-2 opacity-80 mb-1">
                    <i class="fa-solid fa-wallet text-xs"></i>
                    <p class="text-[10px] font-bold uppercase tracking-widest">Saldo Dompet Cantik</p>
                </div>
                <h2 id="display-saldo" class="text-3xl font-black italic">Rp 0</h2>
                <div class="flex gap-3 mt-4">
                    <button onclick="window.location.href='online-shop.html'" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl text-[10px] font-black backdrop-blur-md transition-all">ISI SALDO</button>
                    <button onclick="window.location.href='online-shop.html'" class="bg-white text-pink-500 px-4 py-2 rounded-xl text-[10px] font-black shadow-sm">BELANJA ✨</button>
                </div>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>
    </header>

    <section class="px-6 mb-8">
        <div class="banner-slide shadow-lg">
            <img src="https://img.freepik.com/free-vector/skincare-banner-template_23-2148911545.jpg" class="w-full h-full object-cover" alt="Promo">
            <div class="absolute inset-0 bg-gradient-to-r from-black/40 to-transparent flex flex-col justify-center p-6 text-white">
                <span class="bg-pink-500 text-[8px] font-black px-2 py-1 rounded-md w-fit mb-2">NEW ARRIVAL</span>
                <h3 class="font-black text-lg leading-tight">Perawatan Glowing<br>Diskon Hingga 50%</h3>
            </div>
        </div>
    </section>

    <section class="px-6">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Layanan Utama</h3>
        <div class="grid grid-cols-4 gap-4">
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-sm mb-2">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Belanja</span>
            </button>

            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-sm mb-2">
                    <i class="fa-solid fa-receipt text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Pesanan</span>
            </button>

            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-sm mb-2">
                    <i class="fa-solid fa-tags text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Promo</span>
            </button>

            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-orange-400 shadow-sm mb-2">
                    <i class="fa-solid fa-circle-info text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Bantuan</span>
            </button>
        </div>
    </section>

    <nav class="fixed bottom-0 left-0 right-0 bg-white p-4 flex justify-around border-t border-pink-50 rounded-t-[30px] shadow-2xl z-[100]">
        <a href="index.html" class="flex flex-col items-center text-pink-500">
            <i class="fa-solid fa-house text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Beranda</span>
        </a>
        <a href="online-shop.html" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-shop text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Store</span>
        </a>
        <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-wallet text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Dompet</span>
        </button>
        <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center text-slate-300">
            <i class="fa-solid fa-circle-user text-xl"></i>
            <span class="text-[8px] font-black mt-1 uppercase">Profil</span>
        </button>
    </nav>

    <script>
        window.onload = async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');

            // Ambil data user
            const { data: user } = await db.from('customers')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (user) {
                document.getElementById('user-name').innerText = user.full_name;
                document.getElementById('display-saldo').innerText = "Rp " + (user.saldo || 0).toLocaleString();
            }
        };
    </script>
</body>
</html>
