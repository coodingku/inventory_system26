<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex Beauty Bloom | Online Shop 🌸</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-XXXXX"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root { --primary-pink: #ff85a2; --soft-pink: #fff0f3; --deep-pink: #f72585; --accent-peach: #ffb3c1; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--soft-pink); margin: 0; overflow-x: hidden; }
        .glass-header { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 133, 162, 0.1); }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        
        /* Modal Styles */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s ease; }
        .activity-modal.active { bottom: 0; }

        .product-card { background: white; border-radius: 28px; overflow: hidden; transition: all 0.3s; border: 1px solid rgba(255, 133, 162, 0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="pb-28 no-scrollbar">

    <header class="glass-header sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <div>
            <p id="welcome-msg" class="text-[10px] font-bold text-[#ff4d6d] uppercase tracking-widest italic leading-none mb-1">Halo, Cantik! ✨</p>
            <h1 class="text-xl font-extrabold text-slate-800 italic">Beauty Bloom 🌸</h1>
        </div>
        <button onclick="openProfile()" class="group relative">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-pink-100 to-pink-200 p-0.5 shadow-sm active:scale-90 transition-all overflow-hidden">
                <div class="w-full h-full bg-white rounded-[14px] flex items-center justify-center text-pink-400">
                    <i class="fa-solid fa-user-sparkles text-lg"></i>
                </div>
            </div>
            <span class="absolute -top-1 -right-1 w-3 h-3 bg-green-400 border-2 border-white rounded-full"></span>
        </button>
    </header>

    <main class="px-6 mt-6">
        <div onclick="toggleWallet()" class="gradient-pink w-full p-6 rounded-[32px] text-white shadow-xl shadow-pink-200 relative overflow-hidden mb-8 active:scale-[0.98] transition-all">
            <div class="relative z-10 flex justify-between items-end">
                <div>
                    <p class="text-[9px] font-bold uppercase tracking-widest opacity-80 mb-1">Saldo Dompet Cantik ✨</p>
                    <h2 id="w-saldo" class="text-2xl font-black italic tracking-tight">Rp 0</h2>
                </div>
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md border border-white/20">
                    <i class="fa-solid fa-wallet text-xl"></i>
                </div>
            </div>
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full"></div>
            <div class="absolute right-12 -top-10 w-20 h-20 bg-pink-300/20 rounded-full"></div>
        </div>

        <div class="relative mb-8">
            <i class="fas fa-search absolute left-5 top-4 text-pink-300"></i>
            <input type="text" id="search" onkeyup="loadOnlineMenu()" class="w-full pl-12 pr-4 py-4 bg-white rounded-3xl border-none shadow-sm outline-none focus:ring-2 focus:ring-pink-300 italic text-sm" placeholder="Cari perawatan cantikmu...">
        </div>

        <div id="onlineDisplay" class="grid grid-cols-2 gap-5"></div>
    </main>

    <div id="profileModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic">Profil Member ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        
        <div class="text-center mb-8">
            <div class="w-20 h-20 bg-pink-100 rounded-3xl mx-auto mb-4 flex items-center justify-center border-4 border-white shadow-md text-pink-400">
                <i class="fa-solid fa-user-tie text-3xl"></i>
            </div>
            <h3 id="p-name" class="font-black text-slate-800 italic uppercase">Nama Pengguna</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">email@bloom.com</p>
        </div>

        <div id="reward-section" class="mb-6"></div>

        <div class="space-y-3 mb-10">
            <button onclick="openHistory()" class="w-full py-4 bg-white border-2 border-slate-50 text-slate-700 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-between px-6 shadow-sm active:bg-slate-50">
                <span class="flex items-center gap-3"><i class="fa-solid fa-bag-shopping text-pink-400"></i> Pesanan Saya</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
            </button>
            <button onclick="toggleWallet()" class="w-full py-4 bg-white border-2 border-slate-50 text-slate-700 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-between px-6 shadow-sm active:bg-slate-50">
                <span class="flex items-center gap-3"><i class="fa-solid fa-money-bill-transfer text-blue-400"></i> Mutasi Saldo</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
            </button>
        </div>

        <button onclick="logoutCustomer()" class="w-full py-4 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-center gap-2">
            <i class="fa-solid fa-power-off text-xs"></i> Keluar Akun
        </button>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>
    
    <div id="walletModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic text-pink-500">Dompet ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="requestTopUp()" class="p-5 bg-pink-50 rounded-3xl border border-pink-100 text-pink-500 text-[10px] font-black uppercase"><i class="fa-solid fa-circle-plus block text-2xl mb-2"></i>Top Up</button>
            <button onclick="requestWithdraw()" class="p-5 bg-slate-50 rounded-3xl border border-slate-100 text-slate-400 text-[10px] font-black uppercase"><i class="fa-solid fa-money-bill-transfer block text-2xl mb-2"></i>WD</button>
        </div>
        <h4 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 italic">Catatan Keuangan 📑</h4>
        <div id="walletHistory" class="space-y-3"></div>
    </div>

    <div id="historyModal" class="activity-modal px-6 pb-10">
        <div class="w-12 h-1.5 bg-slate-100 rounded-full mx-auto my-5"></div>
        <h2 class="text-xl font-black text-slate-800 mb-6 text-center italic uppercase">Riwayat Belanja ✨</h2>
        <div id="historyList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar"></div>
        <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-pink-50 text-pink-500 font-bold rounded-2xl text-[10px] uppercase tracking-widest">Tutup</button>
    </div>

    <nav class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-lg flex justify-around padding-safe-bottom py-4 border-t border-pink-50 rounded-t-[35px] z-[100] shadow-2xl">
        <a href="#" class="flex flex-col items-center text-pink-500"><i class="fas fa-house text-xl"></i><span class="text-[8px] font-black mt-1 uppercase italic">Home</span></a>
        <button onclick="openHistory()" class="flex flex-col items-center text-slate-300"><i class="fas fa-receipt text-xl"></i><span class="text-[8px] font-black mt-1 uppercase italic">Order</span></button>
        <button onclick="toggleWallet()" class="flex flex-col items-center text-slate-300"><i class="fas fa-wallet text-xl"></i><span class="text-[8px] font-black mt-1 uppercase italic">Saldo</span></button>
        <button onclick="goToCheckout()" class="flex flex-col items-center text-slate-300 relative">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-pink-500 text-white text-[8px] font-black w-4 h-4 flex items-center justify-center rounded-full border-2 border-white">0</span>
            <span class="text-[8px] font-black mt-1 uppercase italic">Bag</span>
        </button>
    </nav>

    <script>
        // Gunakan script yang sama dengan penyesuaian ID UI
        // Pastikan loadCustomerData memanggil renderRewardStatus
        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            const { data: settings } = await db.from('app_settings').select('*').eq('key_name', 'loyalty_target_count').single();
            const targetCount = settings ? settings.value_int : 5;

            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
                document.getElementById('w-saldo').innerText = "Rp " + (customer.saldo || 0).toLocaleString();
                document.getElementById('p-name').innerText = customer.full_name;
                document.getElementById('p-email').innerText = customer.email;
                renderRewardStatus(customer, targetCount);
                loadWalletHistory(userId);
            }
        }

        function openHistory() {
            closeAllModals();
            document.getElementById('historyModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
            // Tambahkan logika load orders di sini
        }

        function closeAllModals() {
            document.querySelectorAll('.side-modal, .activity-modal').forEach(m => m.classList.remove('active'));
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // ... Sisanya masukkan logika database dan keranjang dari kode lama Anda ...
    </script>
</body>
</html>
