<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; overflow-x: hidden; padding-bottom: 40px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        
        /* MODAL STYLES */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s ease; padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; padding-bottom: 40px; }
        .activity-modal.active { bottom: 0; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }

        /* BANNER SETTINGS */
        .slider-wrapper { position: relative; width: 100vw; aspect-ratio: 16 / 9; overflow: hidden; background: #fff; }
        .slide-item { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide-item.active { opacity: 1; z-index: 10; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .dots-container { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 20; }
        .dot-ad { width: 5px; height: 5px; border-radius: 50%; background: rgba(0,0,0,0.1); transition: all 0.3s; }
        .dot-ad.active { background: #f72585; width: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="p-6 pb-4">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[9px] font-black text-pink-500 uppercase tracking-widest italic">Beauty Bloom Member ✨</p>
                <h1 id="user-name" class="text-xl font-extrabold text-slate-800 italic uppercase leading-none">Memuat...</h1>
            </div>
            <button onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </button>
        </div>

        <div onclick="openWallet()" class="gradient-pink w-full p-6 rounded-[30px] text-white shadow-xl shadow-pink-200 relative overflow-hidden active:scale-[0.98] transition-all">
            <div class="relative z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-80 mb-1">Saldo Dompet Cantik ✨</p>
                        <h2 id="display-saldo" class="text-3xl font-black italic tracking-tight">Rp 0</h2>
                    </div>
                    <i class="fa-solid fa-wallet text-2xl opacity-40"></i>
                </div>
                <div class="flex gap-2 mt-5">
                    <button onclick="event.stopPropagation(); openWallet()" class="bg-white text-pink-500 px-5 py-2 rounded-xl text-[9px] font-black uppercase tracking-widest shadow-md">ISI SALDO</button>
                    <button onclick="event.stopPropagation(); openHistory()" class="bg-white/20 px-5 py-2 rounded-xl text-[9px] font-black backdrop-blur-md uppercase tracking-widest border border-white/20">PESANAN</button>
                </div>
            </div>
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full"></div>
            <div class="absolute right-10 -top-10 w-20 h-20 bg-pink-300/20 rounded-full"></div>
        </div>
    </header>

    <section class="relative w-full overflow-hidden bg-white mb-4">
        <div id="promo-slider" class="slider-wrapper">
            <div class="slide-item active flex items-center justify-center bg-pink-50 text-pink-200">
                <i class="fa-solid fa-wand-magic-sparkles text-4xl animate-pulse"></i>
            </div>
        </div>
        <div id="promo-dots" class="dots-container"></div>
    </section>

    <section class="px-6 py-4 grid grid-cols-4 gap-4">
        <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
            <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-lg mb-2"><i class="fa-solid fa-bag-shopping text-xl"></i></div>
            <span class="text-[9px] font-extrabold text-slate-700 uppercase">Belanja</span>
        </button>
        <button onclick="openHistory()" class="flex flex-col items-center">
            <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-lg mb-2"><i class="fa-solid fa-receipt text-xl"></i></div>
            <span class="text-[9px] font-extrabold text-slate-700 uppercase">Pesanan</span>
        </button>
        <button onclick="openWallet()" class="flex flex-col items-center">
            <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-lg mb-2"><i class="fa-solid fa-history text-xl"></i></div>
            <span class="text-[9px] font-extrabold text-slate-700 uppercase">Mutasi</span>
        </button>
        <button onclick="window.open('https://wa.me/6281239739396')" class="flex flex-col items-center">
            <div class="menu-card w-14 h-14 flex items-center justify-center text-green-400 shadow-lg mb-2"><i class="fa-brands fa-whatsapp text-xl"></i></div>
            <span class="text-[9px] font-extrabold text-slate-700 uppercase">Admin</span>
        </button>
    </section>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="profileModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic">Profil Member ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-pink-100 rounded-3xl mx-auto mb-4 flex items-center justify-center text-pink-400 text-2xl border-4 border-white shadow-md">
                <i class="fa-solid fa-user-sparkles"></i>
            </div>
            <h3 id="p-name" class="font-black text-slate-800 italic uppercase">User</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">email@user.com</p>
        </div>

        <div id="reward-section" class="mb-8">
            </div>

        <div class="space-y-3 mb-10">
            <button onclick="openHistory()" class="w-full py-4 px-6 bg-slate-50 text-slate-700 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-between shadow-sm">
                <span><i class="fa-solid fa-clock-rotate-left mr-2 text-pink-400"></i> Riwayat Transaksi</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
            </button>
            <button onclick="openWallet()" class="w-full py-4 px-6 bg-slate-50 text-slate-700 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-between shadow-sm">
                <span><i class="fa-solid fa-wallet mr-2 text-blue-400"></i> Detail Dompet</span>
                <i class="fa-solid fa-chevron-right text-[8px]"></i>
            </button>
        </div>

        <button onclick="logoutCustomer()" class="w-full py-4 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] tracking-widest uppercase flex items-center justify-center gap-3">
            <i class="fa-solid fa-power-off"></i> Keluar Akun
        </button>
    </div>

    <div id="walletModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Mutasi Saldo</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400"></i></button>
        </div>
        <div id="walletHistory" class="space-y-3"></div>
    </div>

    <div id="historyModal" class="activity-modal px-6">
        <div class="w-12 h-1.5 bg-slate-100 rounded-full mx-auto my-5"></div>
        <h2 class="text-lg font-black text-slate-800 mb-6 text-center italic uppercase">Pesanan Saya</h2>
        <div id="historyList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-2"></div>
        <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-pink-50 text-pink-400 font-bold rounded-2xl text-[10px] uppercase">Tutup</button>
    </div>

    <script>
        let userData = null;
        let currentSlide = 0;

        window.onload = async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            await loadCustomerData(session.user.id);
            await loadDynamicAds();
        };

        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            const { data: settings } = await db.from('app_settings').select('*').eq('key_name', 'loyalty_target_count').single();
            const targetCount = settings ? settings.value_int : 5;

            if (customer) {
                userData = customer;
                document.getElementById('user-name').innerText = customer.full_name;
                document.getElementById('p-name').innerText = customer.full_name;
                document.getElementById('p-email').innerText = customer.email;
                document.getElementById('display-saldo').innerText = "Rp " + (customer.saldo || 0).toLocaleString();
                
                // Render Progress Member di dalam modal profil
                renderRewardStatus(customer, targetCount);
            }
        }

        function renderRewardStatus(profile, target) {
            const container = document.getElementById('reward-section');
            const count = profile.total_order_count || 0;
            const progress = (count / target) * 100;
            
            container.innerHTML = `
                <div class="bg-pink-50/50 p-5 rounded-[24px] border border-pink-100">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-[10px] font-black text-pink-500 uppercase tracking-widest">Progress Member</span>
                        <span class="text-[10px] font-bold text-slate-500">${count}/${target} Belanja</span>
                    </div>
                    <div class="w-full bg-white h-2 rounded-full overflow-hidden border border-pink-100">
                        <div class="gradient-pink h-full transition-all duration-1000" style="width: ${progress}%"></div>
                    </div>
                    <p class="text-[8px] text-slate-400 mt-3 font-bold italic text-center uppercase tracking-tighter">
                        Belanja ${target - count}x lagi untuk klaim diskon cantik! 🌸
                    </p>
                </div>`;
        }

        // Fungsi Banner & Modal Tetap Sama
        async function loadDynamicAds() {
            const slider = document.getElementById('promo-slider');
            const dotsContainer = document.getElementById('promo-dots');
            const { data: setting } = await db.from('app_settings').select('value_text, is_active').eq('key_name', 'dashboard_banners').single();
            if (!setting || !setting.is_active || !setting.value_text) return;
            try {
                const adImages = JSON.parse(setting.value_text);
                slider.innerHTML = adImages.map((imgUrl, i) => `
                    <div class="slide-item ${i === 0 ? 'active' : ''}">
                        <img src="${imgUrl}" class="w-full h-full object-cover">
                    </div>`).join('');
                dotsContainer.innerHTML = adImages.map((_, i) => `<div class="dot-ad ${i === 0 ? 'active' : ''}"></div>`).join('');
                if (adImages.length > 1) startAutoSlide(adImages.length);
            } catch (e) { console.error(e); }
        }

        function startAutoSlide(total) {
            setInterval(() => {
                const slides = document.querySelectorAll('.slide-item');
                const dots = document.querySelectorAll('.dot-ad');
                if(!slides[currentSlide]) return;
                slides[currentSlide].classList.remove('active');
                dots[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % total;
                slides[currentSlide].classList.add('active');
                dots[currentSlide].classList.add('active');
            }, 5000);
        }

        function closeAllModals() { document.querySelectorAll('.side-modal, .activity-modal').forEach(m => m.classList.remove('active')); document.getElementById('modalOverlay').classList.remove('active'); }
        function openWallet() { closeAllModals(); document.getElementById('walletModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }
        function openProfile() { closeAllModals(); document.getElementById('profileModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }
        function openHistory() { closeAllModals(); document.getElementById('historyModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }
        async function logoutCustomer() { if(confirm("Keluar dari akun?")) { await db.auth.signOut(); window.location.replace('login-customer.html'); } }
    </script>
</body>
</html>
