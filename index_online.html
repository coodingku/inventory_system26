<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finex Admin | Beauty Bloom Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; }
        .sidebar { background: white; border-right: 2px solid #ff85a220; }
        .stat-card { background: white; border-radius: 24px; transition: transform 0.2s; border: 1px solid #ff85a210; }
        .stat-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body class="flex min-h-screen">

    <aside class="w-64 sidebar hidden md:flex flex-col p-6 sticky top-0 h-screen">
        <div class="mb-10 text-center">
            <h1 class="text-xl font-black text-slate-800 italic">Finex <span class="text-[#ff85a2]">Bloom</span> 🌸</h1>
        </div>
        
        <nav class="space-y-2 flex-1">
            <a href="#" class="flex items-center gap-3 p-4 bg-pink-50 text-pink-500 rounded-2xl font-bold">
                <i class="fa-solid fa-house"></i> Dasbor
            </a>
            <a href="admin-input-produk.html" class="flex items-center gap-3 p-4 text-slate-400 hover:bg-pink-50 hover:text-pink-500 rounded-2xl transition-all">
                <i class="fa-solid fa-box"></i> Katalog Produk
            </a>
            <a href="#" class="flex items-center gap-3 p-4 text-slate-400 hover:bg-pink-50 hover:text-pink-500 rounded-2xl transition-all">
                <i class="fa-solid fa-cart-shopping"></i> Pesanan Masuk
            </a>
            <a href="#" class="flex items-center gap-3 p-4 text-slate-400 hover:bg-pink-50 hover:text-pink-500 rounded-2xl transition-all">
                <i class="fa-solid fa-users"></i> Data Customer
            </a>
            <a href="#" class="flex items-center gap-3 p-4 text-slate-400 hover:bg-pink-50 hover:text-pink-500 rounded-2xl transition-all">
                <i class="fa-solid fa-wallet"></i> Keuangan
            </a>
        </nav>

        <button onclick="logoutAdmin()" class="mt-auto p-4 text-red-400 font-bold flex items-center gap-3">
            <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
    </aside>

    <main class="flex-1 p-8">
        <header class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-black text-slate-800">Ringkasan Hari Ini ✨</h2>
                <p class="text-slate-400 text-sm">Pantau performa Beauty Bloom Anda</p>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <p class="text-xs font-bold text-slate-400 uppercase">Administrator</p>
                    <p class="font-black text-slate-800">BeautyBloom Admin</p>
                </div>
                <div class="w-12 h-12 bg-pink-100 rounded-2xl flex items-center justify-center text-pink-500 shadow-sm">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
            </div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="stat-card p-6 shadow-sm">
                <div class="w-10 h-10 bg-green-50 text-green-500 rounded-xl flex items-center justify-center mb-4"><i class="fa-solid fa-money-bill-trend-up"></i></div>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Pendapatan Online</p>
                <h3 id="stat-income" class="text-2xl font-black text-slate-800 mt-1">Rp 0</h3>
            </div>
            <div class="stat-card p-6 shadow-sm">
                <div class="w-10 h-10 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center mb-4"><i class="fa-solid fa-bag-shopping"></i></div>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Pesanan Masuk</p>
                <h3 id="stat-orders" class="text-2xl font-black text-slate-800 mt-1">0 Pesanan</h3>
            </div>
            <div class="stat-card p-6 shadow-sm">
                <div class="w-10 h-10 bg-pink-50 text-pink-500 rounded-xl flex items-center justify-center mb-4"><i class="fa-solid fa-heart"></i></div>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Customer Baru</p>
                <h3 id="stat-customers" class="text-2xl font-black text-slate-800 mt-1">0 Orang</h3>
            </div>
        </div>

        <div class="bg-white rounded-[32px] p-8 shadow-sm border border-pink-50">
            <h3 class="font-black text-slate-800 mb-6 flex items-center gap-2">
                <i class="fa-solid fa-clock-rotate-left text-pink-400"></i> Pesanan Terbaru
            </h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="text-slate-400 text-[10px] uppercase font-black tracking-widest border-b border-slate-50">
                            <th class="pb-4">Invoice</th>
                            <th class="pb-4">Customer</th>
                            <th class="pb-4">Status</th>
                            <th class="pb-4">Total</th>
                        </tr>
                    </thead>
                    <tbody id="recent-orders-list" class="text-sm">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Logika untuk fetch data dari Supabase (income, orders, customers)
        // bisa ditambahkan di sini menggunakan tabel 'transaksi_online' dan 'customers'
    </script>
</body>
</html>
