<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finex | Beauty Bloom Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; margin-bottom: 120px; overflow-x: hidden; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        .menu-card:active { transform: scale(0.95); background: #fff0f3; }
        .banner-slide { width: 100%; height: 160px; border-radius: 25px; overflow: hidden; position: relative; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        
        /* Modal Samping untuk Profil & Dompet */
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); padding: 30px; border-radius: 40px 0 0 40px; box-shadow: -10px 0 30px rgba(0,0,0,0.1); }
        .side-modal.active { right: 0; }
        
        /* Modal Bawah untuk Pesanan */
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; box-shadow: 0 -15px 35px rgba(0,0,0,0.1); }
        .activity-modal.active { bottom: 0; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0 25px 0; box-shadow: 0 -10px 25px rgba(255, 133, 162, 0.1); border-radius: 30px 30px 0 0; z-index: 100; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <header class="p-6">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[10px] font-black text-pink-500 uppercase tracking-widest italic">Selamat Datang ✨</p>
                <h1 id="user-name" class="text-xl font-extrabold text-slate-800 italic">Beauty Bloom</h1>
            </div>
            <div onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm cursor-pointer active:scale-90 transition-all">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </div>
        </div>

        <div class="gradient-pink p-6 rounded-[32px] text-white shadow-xl shadow-pink-200 relative overflow-hidden">
            <div class="relative z-10">
                <div class="flex items-center gap-2 opacity-80 mb-1">
                    <i class="fa-solid fa-wallet text-xs"></i>
                    <p class="text-[10px] font-bold uppercase tracking-widest">Saldo Dompet Cantik</p>
                </div>
                <h2 id="display-saldo" class="text-3xl font-black italic text-white">Rp 0</h2>
                <div class="flex gap-3 mt-4">
                    <button onclick="toggleWallet()" class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-xl text-[10px] font-black backdrop-blur-md transition-all uppercase">Detail Saldo</button>
                    <button onclick="window.location.href='online-shop.html'" class="bg-white text-pink-500 px-4 py-2 rounded-xl text-[10px] font-black shadow-sm uppercase">Belanja ✨</button>
                </div>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>
    </header>

    <section class="px-6 mb-8">
        <div class="banner-slide shadow-lg">
            <img src="https://img.freepik.com/free-vector/skincare-banner-template_23-2148911545.jpg" class="w-full h-full object-cover" alt="Promo">
            <div class="absolute inset-0 bg-gradient-to-r from-black/40 to-transparent flex flex-col justify-center p-6 text-white">
                <span class="bg-pink-500 text-[8px] font-black px-2 py-1 rounded-md w-fit mb-2">NEW ARRIVAL</span>
                <h3 class="font-black text-lg leading-tight italic">Perawatan Glowing<br>Diskon Hingga 50%</h3>
            </div>
        </div>
    </section>

    <section class="px-6">
        <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Layanan Utama</h3>
        <div class="grid grid-cols-4 gap-4">
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-sm mb-2">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Belanja</span>
            </button>
            <button onclick="openActivity()" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-sm mb-2">
                    <i class="fa-solid fa-receipt text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Pesanan</span>
            </button>
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-sm mb-2">
                    <i class="fa-solid fa-tags text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Promo</span>
            </button>
            <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center">
                <div class="menu-card w-14 h-14 flex items-center justify-center text-orange-400 shadow-sm mb-2">
                    <i class="fa-solid fa-circle-info text-xl"></i>
                </div>
                <span class="text-[9px] font-bold text-slate-600 uppercase">Bantuan</span>
            </button>
        </div>
    </section>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="profileModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic">Profil Saya ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="text-center mb-10">
            <div class="w-24 h-24 bg-pink-100 rounded-3xl mx-auto mb-4 flex items-center justify-center border-4 border-pink-50 shadow-inner">
                <i class="fa-solid fa-user-astronaut text-3xl text-pink-500"></i>
            </div>
            <h3 id="p-name" class="text-lg font-black text-slate-800 italic uppercase tracking-tighter">Memuat...</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold tracking-widest uppercase">email@user.com</p>
        </div>
        <div class="space-y-3">
            <button onclick="window.location.href='online-shop.html'" class="w-full p-4 bg-slate-50 text-slate-600 rounded-2xl text-[10px] font-black uppercase text-left flex items-center gap-3">
                <i class="fa-solid fa-gear text-pink-400"></i> Pengaturan Akun
            </button>
            <button onclick="logoutCustomer()" class="w-full p-4 bg-red-50 text-red-500 rounded-2xl text-[10px] font-black uppercase text-left flex items-center gap-3">
                <i class="fa-solid fa-right-from-bracket"></i> Keluar Aplikasi
            </button>
        </div>
    </div>

    <div id="walletModal" class="side-modal">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800">Dompet Cantik ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="bg-gradient-to-br from-[#ff85a2] to-[#f72585] p-8 rounded-[35px] text-white shadow-xl mb-8">
            <p class="text-xs font-bold opacity-80 uppercase tracking-widest">Saldo Tersedia</p>
            <h3 id="w-saldo" class="text-3xl font-black mt-2 italic">Rp 0</h3>
        </div>
        <button onclick="window.location.href='online-shop.html'" class="w-full py-4 bg-pink-50 text-pink-500 rounded-2xl font-black text-[10px] tracking-widest uppercase mb-4 italic">Isi Saldo di Store</button>
        <button onclick="closeAllModals()" class="w-full py-4 bg-slate-50 text-slate-400 rounded-2xl font-bold text-[10px] uppercase">Tutup</button>
    </div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-1 text-center italic">Riwayat Pesanan 🚚</h2>
            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest text-center mb-6">Pantau belanja cantikmu</p>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4 text-center text-slate-400 italic text-sm">
                Memuat riwayat belanja...
            </div>
            <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl uppercase text-[10px] tracking-widest">Tutup</button>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="flex flex-col items-center text-[#ff85a2]">
            <i class="fas fa-home text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Beranda</span>
        </a>
        <a href="online-shop.html" class="flex flex-col items-center text-slate-300">
            <i class="fas fa-store text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Belanja</span>
        </a>
        <button onclick="openActivity()" class="flex flex-col items-center text-slate-300">
            <i class="fas fa-receipt text-2xl"></i>
            <span class="text-[9px] font-black mt-1 uppercase">Pesanan</span>
        </button>
        <a href="online-shop.html" class="flex flex-col items-center text-slate-300 relative">
            <i class="fas fa-shopping-bag text-2xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-3 bg-[#f72585] text-white text-[10px] font-black px-2 py-0.5 rounded-full border-2 border-white shadow-sm">0</span>
            <span class="text-[9px] font-black mt-1 uppercase">Bag</span>
        </a>
    </nav>

    <script>
        let userData = null;

        window.onload = async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');

            const { data: user } = await db.from('customers')
                .select('*')
                .eq('id', session.user.id)
                .single();

            if (user) {
                userData = user;
                document.getElementById('user-name').innerText = user.full_name;
                document.getElementById('p-name').innerText = user.full_name;
                document.getElementById('p-email').innerText = user.email;
                
                const formatSaldo = "Rp " + (user.saldo || 0).toLocaleString();
                document.getElementById('display-saldo').innerText = formatSaldo;
                document.getElementById('w-saldo').innerText = formatSaldo;
            }

            const shopCart = JSON.parse(localStorage.getItem('finexcart')) || [];
            const count = shopCart.reduce((total, item) => total + item.qty, 0);
            document.getElementById('cart-count').innerText = count;
        };

        function toggleWallet() {
            document.getElementById('walletModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function openProfile() {
            document.getElementById('profileModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        async function openActivity() {
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
            
            const list = document.getElementById('activityList');
            const { data: orders } = await db.from('orders')
                .select('*')
                .eq('customer_id', userData.id)
                .order('created_at', { ascending: false });

            if (orders && orders.length > 0) {
                list.innerHTML = orders.map(o => `
                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100 text-left">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-black text-pink-500 uppercase">${o.no_invoice}</span>
                            <span class="text-[8px] px-2 py-0.5 bg-white border rounded-md font-bold uppercase text-slate-500">${o.status}</span>
                        </div>
                        <p class="text-xs font-black text-slate-700">Rp ${o.total_bayar.toLocaleString()}</p>
                        <p class="text-[9px] text-slate-400 mt-1">${new Date(o.created_at).toLocaleDateString('id-ID')}</p>
                    </div>
                `).join('');
            } else {
                list.innerHTML = "Belum ada riwayat pesanan nih. <br> Yuk mulai belanja cantik! 🌸";
            }
        }

        function closeAllModals() {
            document.querySelectorAll('.side-modal, .activity-modal').forEach(m => m.classList.remove('active'));
            document.getElementById('modalOverlay').classList.remove('active');
        }

        async function logoutCustomer() {
            if (confirm("Ingin keluar dari Beauty Bloom?")) {
                await db.auth.signOut();
                window.location.replace('login-customer.html');
            }
        }
    </script>
</body>
</html>
