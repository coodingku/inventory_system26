<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <script type="text/javascript" src="https://app.sandbox.midtrans.com/snap/snap.js" data-client-key="SB-Mid-client-YOUR_KEY"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; overflow-x: hidden; padding-bottom: 40px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        .sticky-menu-container { position: sticky; top: 0; z-index: 100; background-color: #fff0f3; padding: 15px 0; border-bottom: 1px solid #ff85a220; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .side-modal { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: white; z-index: 1000; transition: 0.4s ease; padding: 30px; border-radius: 40px 0 0 40px; }
        .side-modal.active { right: 0; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; padding-bottom: 40px; }
        .activity-modal.active { bottom: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        /* SLIDER STYLE FIXED */
        .slider-wrapper { position: relative; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #fff; border-radius: 20px; }
        .slide-item { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; display: none; }
        .slide-item.active { opacity: 1; z-index: 10; display: block; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .dots-container { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 20; }
        .dot-ad { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: all 0.3s; }
        .dot-ad.active { background: #f72585; width: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="p-6 pb-0">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[9px] font-black text-pink-500 uppercase tracking-widest italic">Beauty Bloom Member ✨</p>
                <h1 id="welcome-msg" class="text-xl font-extrabold text-slate-800 italic uppercase leading-none">Memuat...</h1>
            </div>
            <button onclick="openProfile()" class="w-12 h-12 bg-white rounded-2xl border-2 border-pink-100 flex items-center justify-center text-pink-400 shadow-sm active:scale-90 transition-all">
                <i class="fa-solid fa-user-sparkles text-xl"></i>
            </button>
        </div>

        <div class="gradient-pink w-full p-6 rounded-[30px] text-white shadow-xl shadow-pink-200 relative overflow-hidden transition-all mb-4">
            <div class="relative z-10">
                <div class="flex justify-between items-start">
                    <div>
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-80 mb-1">Saldo Dompet Cantik ✨</p>
                        <h2 id="w-saldo" class="text-3xl font-black italic tracking-tight">Rp 0</h2>
                    </div>
                    <i class="fa-solid fa-wallet text-2xl opacity-40"></i>
                </div>
                <div class="flex gap-2 mt-5">
                    <button onclick="requestTopUp()" class="flex-1 bg-white text-pink-500 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-md active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-circle-plus"></i> TOP UP
                    </button>
                    <button onclick="requestWithdraw()" class="flex-1 bg-black/20 text-white py-3 rounded-xl text-[10px] font-black backdrop-blur-md uppercase tracking-widest border border-white/20 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-money-bill-transfer"></i> TARIK
                    </button>
                </div>
            </div>
            <div class="absolute -right-6 -bottom-6 w-24 h-24 bg-white/10 rounded-full"></div>
        </div>

        <div class="sticky-menu-container">
            <section class="grid grid-cols-4 gap-4 px-2">
                <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center active:scale-95">
                    <div class="menu-card w-14 h-14 flex items-center justify-center text-pink-500 shadow-lg mb-2"><i class="fa-solid fa-bag-shopping text-xl"></i></div>
                    <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Belanja</span>
                </button>
                <button onclick="openActivity()" class="flex flex-col items-center active:scale-95">
                    <div class="menu-card w-14 h-14 flex items-center justify-center text-blue-400 shadow-lg mb-2"><i class="fa-solid fa-truck-fast text-xl"></i></div>
                    <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Lacak</span>
                </button>
                <button onclick="toggleWallet()" class="flex flex-col items-center active:scale-95">
                    <div class="menu-card w-14 h-14 flex items-center justify-center text-purple-400 shadow-lg mb-2"><i class="fa-solid fa-history text-xl"></i></div>
                    <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Mutasi</span>
                </button>
                <button onclick="window.open('https://wa.me/6281239739396')" class="flex flex-col items-center active:scale-95">
                    <div class="menu-card w-14 h-14 flex items-center justify-center text-green-400 shadow-lg mb-2"><i class="fa-brands fa-whatsapp text-xl"></i></div>
                    <span class="text-[9px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Admin</span>
                </button>
            </section>
        </div>
    </header>

    <section class="relative px-6 mt-4 overflow-hidden">
        <div class="slider-wrapper shadow-lg border-2 border-white">
            <div id="promo-slider">
                <div class="slide-item active flex items-center justify-center bg-pink-50 text-pink-200">
                    <i class="fa-solid fa-wand-magic-sparkles text-4xl animate-pulse"></i>
                </div>
            </div>
            <div id="promo-dots" class="dots-container"></div>
        </div>
    </section>

    <div class="px-6 mt-8 mb-8">
        <div id="reward-section"></div>
    </div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center italic uppercase">Pesanan Aktif 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
            <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl text-[10px] uppercase font-black">Tutup</button>
        </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>
    <div id="profileModal" class="side-modal no-scrollbar overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-black text-slate-800 italic">Profil Member ✨</h2>
            <button onclick="closeAllModals()"><i class="fa-solid fa-xmark text-slate-400 text-xl"></i></button>
        </div>
        <div class="text-center mb-6">
            <div class="w-20 h-20 bg-pink-100 rounded-3xl mx-auto mb-4 flex items-center justify-center text-pink-400 text-2xl border-4 border-white shadow-md"><i class="fa-solid fa-user-sparkles"></i></div>
            <h3 id="p-name" class="font-black text-slate-800 italic uppercase text-sm">User</h3>
            <p id="p-email" class="text-[10px] text-slate-400 font-bold uppercase tracking-widest italic">email@user.com</p>
        </div>
        <button onclick="openHistory()" class="w-full py-4 px-6 bg-slate-50 text-slate-700 rounded-2xl font-black text-[10px] uppercase flex justify-between items-center shadow-sm mb-6">
            <span><i class="fa-solid fa-clock-rotate-left mr-2 text-pink-400"></i> Riwayat Selesai</span>
            <i class="fa-solid fa-chevron-right text-[8px]"></i>
        </button>
        <button onclick="logoutCustomer()" class="w-full py-4 bg-red-50 text-red-500 rounded-2xl font-black text-[10px] uppercase flex justify-center items-center gap-3"><i class="fa-solid fa-power-off"></i> Keluar Akun</button>
    </div>

    <div id="historyModal" class="activity-modal px-6">
        <div class="w-12 h-1.5 bg-slate-100 rounded-full mx-auto my-5"></div>
        <h2 class="text-lg font-black text-slate-800 mb-6 text-center italic uppercase">Riwayat Selesai 🌸</h2>
        <div id="historyList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-2"></div>
    </div>

    <script>
        let userData = null;
        let currentSlide = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            await loadCustomerData(session.user.id);
            await loadDynamicAds();
        });

        // --- FUNGSI LOAD DATA ---
        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
                document.getElementById('w-saldo').innerText = "Rp " + (customer.saldo || 0).toLocaleString();
                loadWalletHistory(userId);
            }
        }

        // --- FUNGSI IKLAN (FIXED) ---
        async function loadDynamicAds() {
            const slider = document.getElementById('promo-slider');
            const dots = document.getElementById('promo-dots');
            const { data: setting } = await db.from('app_settings').select('value_text, is_active').eq('key_name', 'dashboard_banners').single();
            
            if (!setting || !setting.is_active || !setting.value_text) return;

            try {
                const images = JSON.parse(setting.value_text);
                slider.innerHTML = images.map((url, i) => `
                    <div class="slide-item ${i === 0 ? 'active' : ''}">
                        <img src="${url}" class="w-full h-full object-cover">
                    </div>`).join('');
                
                dots.innerHTML = images.map((_, i) => `<div class="dot-ad ${i === 0 ? 'active' : ''}"></div>`).join('');

                if (images.length > 1) startAutoSlide(images.length);
            } catch (e) { console.error("Banner Error:", e); }
        }

        function startAutoSlide(total) {
            setInterval(() => {
                const slides = document.querySelectorAll('.slide-item');
                const dots = document.querySelectorAll('.dot-ad');
                if(!slides[currentSlide]) return;
                slides[currentSlide].classList.remove('active');
                dots[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % total;
                slides[currentSlide].classList.add('active');
                dots[currentSlide].classList.add('active');
            }, 5000);
        }

        // --- FUNGSI LACAK PESANAN & PEMBATALAN ---
        async function openActivity() {
            const { data } = await db.from('transaksi_online').select('*')
                .eq('customer_id', userData.id)
                .not('status_order', 'in', '("Selesai","Dibatalkan")')
                .order('created_at', { ascending: false });

            const container = document.getElementById('activityList');
            container.innerHTML = (data && data.length > 0) ? renderOrderCards(data) : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-black uppercase">Belum ada pesanan aktif 🌸</p>`;
            
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function renderOrderCards(data) {
            return data.map(t => {
                const canCancel = t.status_order === 'Pending' || t.status_order === 'Menunggu Pembayaran';
                return `
                    <div class="p-5 bg-white rounded-[25px] border border-slate-100 shadow-sm mb-2">
                        <div class="flex justify-between mb-4">
                            <div>
                                <p class="text-[8px] font-black text-pink-400 bg-pink-50 px-2 py-1 rounded-full uppercase italic leading-none">${t.no_invoice}</p>
                                <h4 class="font-black text-slate-800 italic uppercase text-[11px] mt-2">${t.status_order}</h4>
                            </div>
                            <div class="text-right font-black italic text-slate-800 text-[11px]">Rp ${t.grand_total.toLocaleString()}</div>
                        </div>
                        <div class="flex gap-2">
                            <button onclick='viewDetailTrx(${JSON.stringify(t)})' class="flex-[2] py-3.5 bg-slate-800 text-white text-[9px] font-black uppercase rounded-2xl active:scale-95 transition-all">Detail</button>
                            ${canCancel ? `<button onclick="cancelOrder('${t.id}', '${t.no_invoice}', ${t.grand_total}, '${t.metode_pembayaran}')" class="flex-1 py-3.5 bg-red-50 text-red-500 text-[9px] font-black uppercase rounded-2xl border border-red-100">Batal</button>` : ''}
                        </div>
                    </div>`;
            }).join('');
        }

        async function cancelOrder(orderId, noInvoice, amount, method) {
            if (!confirm(`Batalkan pesanan ${noInvoice}?`)) return;

            try {
                // 1. Update Status
                const { error } = await db.from('transaksi_online').update({ status_order: 'Dibatalkan' }).eq('id', orderId);
                if (error) throw error;

                // 2. Refund Otomatis jika pakai Saldo
                if (method.includes('Saldo') || method.includes('Wallet')) {
                    const newSaldo = (userData.saldo || 0) + amount;
                    await db.from('customers').update({ saldo: newSaldo }).eq('id', userData.id);
                    // Catat mutasi refund
                    await db.from('topup_history').insert([{
                        customer_id: userData.id,
                        nominal: amount,
                        no_invoice: 'REFUND-' + noInvoice,
                        metode: 'SISTEM'
                    }]);
                }

                alert(`Pesanan ${noInvoice} berhasil dibatalkan.`);
                await loadCustomerData(userData.id);
                openActivity();
            } catch (err) { alert("Gagal memproses pembatalan."); }
        }

        // --- FUNGSI PENDUKUNG LAINNYA ---
        function closeAllModals() { document.querySelectorAll('.side-modal, .activity-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }
        
        async function openHistory() {
            const { data } = await db.from('transaksi_online').select('*').eq('customer_id', userData.id).in('status_order', ['Selesai', 'Dibatalkan']).order('created_at', { ascending: false });
            document.getElementById('historyList').innerHTML = (data && data.length > 0) ? renderOrderCards(data) : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-black uppercase">Riwayat Kosong 🌸</p>`;
            closeAllModals();
            setTimeout(() => { document.getElementById('historyModal').classList.add('active'); document.getElementById('modalOverlay').classList.add('active'); }, 200);
        }

        function viewDetailTrx(t) { alert(`Invoice: ${t.no_invoice}\nStatus: ${t.status_order}\nTotal: Rp ${t.grand_total.toLocaleString()}`); }
        
        // Tambahkan fungsi logout & wallet history sesuai kode asli Anda...
    </script>
</body>
</html>
