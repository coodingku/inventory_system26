<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beauty Bloom | Dashboard 🌸</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-online.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fff0f3; overflow-x: hidden; padding-bottom: 40px; }
        .gradient-pink { background: linear-gradient(135deg, #ff85a2 0%, #f72585 100%); }
        .menu-card { background: white; border-radius: 20px; transition: all 0.2s; border: 1px solid #ff85a210; }
        
        .sticky-menu-container {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #fff0f3;
            padding: 15px 0;
            border-bottom: 1px solid #ff85a220;
        }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; z-index: 999; }
        .modal-overlay.active { display: block; }
        .activity-modal { position: fixed; bottom: -100%; left: 0; right: 0; background: white; z-index: 1000; border-radius: 35px 35px 0 0; transition: bottom 0.4s; padding-bottom: 40px; }
        .activity-modal.active { bottom: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .slider-wrapper { position: relative; width: 100vw; aspect-ratio: 1 / 1; overflow: hidden; background: #fff; }
        .slide-item { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1s ease-in-out; }
        .slide-item.active { opacity: 1; z-index: 10; }
        .slide-item img { width: 100%; height: 100%; object-fit: cover; }
        .dots-container { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: center; gap: 5px; z-index: 20; }
        .dot-ad { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: all 0.3s; }
        .dot-ad.active { background: #f72585; width: 15px; border-radius: 10px; }
    </style>
</head>
<body>

    <header class="p-6 pb-0">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-[9px] font-black text-pink-500 uppercase tracking-widest italic">Beauty Bloom Member ✨</p>
                <h1 id="welcome-msg" class="text-xl font-extrabold text-slate-800 italic uppercase leading-none">Memuat...</h1>
            </div>
            <button onclick="logoutCustomer()" class="text-slate-400 text-xs font-bold uppercase italic px-4 py-2 bg-white rounded-xl shadow-sm border border-pink-50">
                Keluar <i class="fa-solid fa-power-off ml-1"></i>
            </button>
        </div>

        <div class="sticky-menu-container">
            <section class="grid grid-cols-3 gap-4 px-2">
                <button onclick="window.location.href='online-shop.html'" class="flex flex-col items-center active:scale-95 transition-transform">
                    <div class="menu-card w-16 h-16 flex items-center justify-center text-pink-500 shadow-lg mb-2"><i class="fa-solid fa-bag-shopping text-2xl"></i></div>
                    <span class="text-[10px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Belanja</span>
                </button>
                <button onclick="openActivity()" class="flex flex-col items-center active:scale-95 transition-transform">
                    <div class="menu-card w-16 h-16 flex items-center justify-center text-blue-400 shadow-lg mb-2"><i class="fa-solid fa-receipt text-2xl"></i></div>
                    <span class="text-[10px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Pesanan</span>
                </button>
                <button onclick="window.open('https://wa.me/6281239739396')" class="flex flex-col items-center active:scale-95 transition-transform">
                    <div class="menu-card w-16 h-16 flex items-center justify-center text-green-400 shadow-lg mb-2"><i class="fa-brands fa-whatsapp text-2xl"></i></div>
                    <span class="text-[10px] font-extrabold text-slate-700 uppercase tracking-tighter text-center">Admin</span>
                </button>
            </section>
        </div>
    </header>

    <section class="relative w-full overflow-hidden bg-white mt-4">
        <div id="promo-slider" class="slider-wrapper">
            <div class="slide-item active flex items-center justify-center bg-pink-50 text-pink-200">
                <i class="fa-solid fa-wand-magic-sparkles text-4xl animate-pulse"></i>
            </div>
        </div>
        <div id="promo-dots" class="dots-container"></div>
    </section>

    <div class="px-6 mt-8 mb-8">
        <div id="reward-section"></div>
    </div>

    <div id="modalOverlay" class="modal-overlay" onclick="closeAllModals()"></div>

    <div id="activityModal" class="activity-modal">
        <div class="w-10 h-1 bg-slate-200 rounded-full mx-auto my-4"></div>
        <div class="px-6 pb-10">
            <h2 class="text-xl font-black text-slate-800 mb-2 text-center uppercase italic">Lacak Pesanan 🚚</h2>
            <div id="activityList" class="space-y-4 max-h-[60vh] overflow-y-auto no-scrollbar pt-4"></div>
            <button onclick="closeAllModals()" class="w-full mt-6 py-4 bg-slate-100 text-slate-400 font-bold rounded-2xl text-[10px] uppercase">Tutup</button>
        </div>
    </div>

    <script>
        let userData = null;
        let currentSlide = 0;

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await db.auth.getSession();
            if (!session) return window.location.replace('login-customer.html');
            await loadCustomerData(session.user.id);
            await loadDynamicAds();
        });

        async function loadCustomerData(userId) {
            const { data: customer } = await db.from('customers').select('*').eq('id', userId).single();
            const { data: settings } = await db.from('app_settings').select('value_int').eq('key_name', 'loyalty_target_count').single();
            const targetCount = settings ? settings.value_int : 5;

            if (customer) {
                userData = customer;
                document.getElementById('welcome-msg').innerText = `Halo, ${customer.full_name.split(' ')[0]}! ✨`;
                renderRewardStatus(customer, targetCount);
            }
        }

        function renderRewardStatus(profile, target) {
            const container = document.getElementById('reward-section');
            if (!container) return;
            const count = profile.total_order_count || 0;
            const claimed = profile.is_reward_claimed;
            let currentProgress = count % target;
            let isGoalReached = (count > 0 && currentProgress === 0 && !claimed);

            if (isGoalReached) {
                container.innerHTML = `<div class="gradient-pink p-5 rounded-[28px] text-white shadow-lg relative overflow-hidden"><div class="relative z-10"><p class="text-[9px] font-black uppercase tracking-widest mb-1 opacity-80">Reward Member 🎁</p><h4 class="text-sm font-black mb-3 italic uppercase">Target Belanja Tercapai!</h4><button onclick="claimRewardMember()" class="w-full py-3 bg-white text-pink-500 rounded-2xl font-black text-[10px] uppercase">Klaim Diskon Sekarang</button></div><i class="fa-solid fa-crown absolute -right-2 -bottom-2 text-white/20 text-5xl rotate-12"></i></div>`;
            } else if (claimed) {
                container.innerHTML = `<div class="bg-white p-4 rounded-[28px] border-2 border-green-100 text-center shadow-sm"><p class="text-[10px] font-black text-green-600 uppercase tracking-widest">Diskon Member Aktif ✨</p></div>`;
            } else {
                let progress = (currentProgress / target) * 100;
                container.innerHTML = `<div class="bg-white p-5 rounded-[28px] border-2 border-pink-50 shadow-sm"><div class="flex justify-between items-center mb-3"><span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Progres Member</span><span class="text-[11px] font-black text-pink-500 italic">${currentProgress}/${target}</span></div><div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden border border-slate-50"><div class="gradient-pink h-full transition-all duration-1000" style="width: ${progress}%"></div></div><p class="text-[8px] text-slate-400 mt-3 font-bold italic uppercase">Belanja ${target - currentProgress}x lagi untuk reward.</p></div>`;
            }
        }

        async function openActivity() {
            const { data } = await db.from('transaksi_online').select('*').eq('customer_id', userData.id).order('created_at', { ascending: false });
            const container = document.getElementById('activityList');
            const activeOrders = data ? data.filter(trx => !['Selesai', 'Dibatalkan'].includes(trx.status_order)) : [];
            
            container.innerHTML = activeOrders.length > 0 ? activeOrders.map(t => `
                <div class="p-4 bg-pink-50/50 rounded-2xl border border-pink-100 flex justify-between items-center">
                    <div>
                        <p class="text-[8px] font-bold text-slate-400 uppercase">INV: ${t.no_invoice.slice(-6)}</p>
                        <h4 class="font-black text-slate-800 text-xs italic uppercase">${t.status_order}</h4>
                    </div>
                    <span class="text-[10px] font-black text-pink-500">Rp ${t.grand_total.toLocaleString()}</span>
                </div>
            `).join('') : `<p class="text-center py-10 italic text-slate-400 text-[10px] font-bold uppercase">Semua pesanan selesai 🌸</p>`;
            
            document.getElementById('activityModal').classList.add('active');
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeAllModals() { document.querySelectorAll('.activity-modal, .modal-overlay').forEach(el => el.classList.remove('active')); }

        async function logoutCustomer() {
            if (confirm("Keluar akun?")) {
                await db.auth.signOut();
                localStorage.removeItem('finexcart');
                window.location.replace('login-customer.html');
            }
        }

        async function loadDynamicAds() {
            const slider = document.getElementById('promo-slider');
            const dotsContainer = document.getElementById('promo-dots');
            const { data: setting } = await db.from('app_settings').select('value_text, is_active').eq('key_name', 'dashboard_banners').single();
            if (!setting || !setting.is_active || !setting.value_text) return;
            try {
                const adImages = JSON.parse(setting.value_text);
                slider.innerHTML = adImages.map((imgUrl, i) => `<div class="slide-item ${i === 0 ? 'active' : ''}"><img src="${imgUrl}" class="w-full h-full object-cover"></div>`).join('');
                dotsContainer.innerHTML = adImages.map((_, i) => `<div class="dot-ad ${i === 0 ? 'active' : ''}"></div>`).join('');
                if (adImages.length > 1) startAutoSlide(adImages.length);
            } catch (e) { console.error(e); }
        }

        function startAutoSlide(total) {
            setInterval(() => {
                const slides = document.querySelectorAll('.slide-item');
                const dots = document.querySelectorAll('.dot-ad');
                if(!slides[currentSlide]) return;
                slides[currentSlide].classList.remove('active'); 
                if(dots[currentSlide]) dots[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % total;
                slides[currentSlide].classList.add('active'); 
                if(dots[currentSlide]) dots[currentSlide].classList.add('active');
            }, 5000);
        }
    </script>
</body>
</html>
